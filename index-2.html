/* ---------------------------- REQUISIÇÕES DE COMPRA ---------------------------- */
const ST_RC = {'rascunho':'badge-muted','aguardando':'badge-warning','aprovada':'badge-success',
               'reprovada':'badge-danger','convertida':'badge-info'};
const URG_BADGE = {'normal':'badge-muted','alta':'badge-warning','urgente':'badge-danger'};
const alcada = u => u.master ? Infinity : (Number(u.limite) || 0);
const quemAprova = valor => app.data.users
  .filter(u => u.active !== false && (u.master || (u.perms&&u.perms.requisitions&&u.perms.requisitions.aprovar)))
  .filter(u => alcada(u) >= valor).map(u => u.name);

let __rc = null;
function formRC(id){
  const rc = id ? byId(app.data.requisitions, id) : null;
  if(!guard('requisitions', rc?'editar':'criar')) return;
  if(rc && rc.status !== 'rascunho'){
    toast('Só requisições em rascunho podem ser editadas. Reabra antes, se for o caso.','warn'); return;
  }
  __rc = {id, lines: rc ? rc.lines.map(l=>({...l})) : [{itemId:'',quantity:1,unitPrice:0}]};
  const ativos = app.data.employees.filter(e=>e.status==='ativo');
  openModal(rc?`Editar ${rc.code}`:'Nova requisição de compra', `
    <div class="form-row">
      <div class="form-group">
        <label for="rc_sol">Solicitante *</label>
        <select id="rc_sol" onchange="rcAjustaDepto()">
          <option value="">— selecione —</option>
          ${ativos.map(e=>`<option value="${e.id}" data-dep="${e.deptId}"${rc&&rc.requesterId===e.id?' selected':''}>${esc(e.name)} — ${esc(e.cargo)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label for="rc_dep">Centro de custo *</label>
        <select id="rc_dep">
          <option value="">— selecione —</option>
          ${app.data.departments.map(d=>`<option value="${d.id}"${rc&&rc.deptId===d.id?' selected':''}>${d.code} · ${esc(d.name)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label for="rc_urg">Urgência *</label>
        <select id="rc_urg">${['normal','alta','urgente'].map(u=>`<option value="${u}"${rc&&rc.urgencia===u?' selected':''}>${u}</option>`).join('')}</select>
      </div>
      <div class="form-group">
        <label for="rc_data">Necessário até *</label>
        <input type="date" id="rc_data" value="${rc?rc.neededAt:addDays(today(),20)}">
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label for="rc_just">Justificativa *</label>
        <textarea id="rc_just" rows="2" placeholder="Por que esta compra é necessária?">${rc?esc(rc.justificativa):''}</textarea>
        <div class="form-hint">Quem aprova lê isso antes de decidir. Seja específico.</div>
      </div>
    </div>
    <div class="lines-head">
      <h4>Itens solicitados</h4>
      <button class="btn btn-xs btn-primary" onclick="addLineRC()">Adicionar item</button>
    </div>
    <div id="rcLinesBox"></div>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="salvarRC()">Salvar rascunho</button>`);
  renderLinesRC();
}
function rcAjustaDepto(){
  const sel = document.getElementById('rc_sol');
  const dep = sel.options[sel.selectedIndex] && sel.options[sel.selectedIndex].dataset.dep;
  if(dep) document.getElementById('rc_dep').value = dep;
}
function renderLinesRC(){
  const box = document.getElementById('rcLinesBox');
  const opts = app.data.inventory;
  if(!__rc.lines.length){ box.innerHTML = `<div class="lines-empty">Nenhum item. Use "Adicionar item".</div>`; return; }
  box.innerHTML = `
    <table class="lines"><thead><tr>
      <th style="width:50%">Item</th><th class="num" style="width:14%">Qtd</th>
      <th class="num" style="width:18%">Preço estimado</th><th class="num">Total</th><th></th>
    </tr></thead><tbody>
    ${__rc.lines.map((l,i)=>`<tr>
      <td><select onchange="updLineRC(${i},'itemId',this.value)"><option value="">— selecione —</option>
        ${opts.map(o=>`<option value="${o.id}"${o.id===l.itemId?' selected':''}>${esc(o.sku+' · '+o.description)} (${num(o.quantity)} em estoque)</option>`).join('')}
      </select></td>
      <td><input type="number" min="1" value="${l.quantity}" oninput="updLineRC(${i},'quantity',this.value)"></td>
      <td><input type="number" min="0" step="0.01" value="${l.unitPrice}" oninput="updLineRC(${i},'unitPrice',this.value)"></td>
      <td class="num" id="rclt${i}">${money(l.quantity*l.unitPrice)}</td>
      <td><button class="rm" onclick="rmLineRC(${i})" aria-label="Remover linha">✕</button></td>
    </tr>`).join('')}</tbody></table>
    <div class="lines-total"><span>Total estimado</span><strong id="rcTotal">${money(rcTotal())}</strong></div>`;
}
const rcTotal = () => __rc.lines.reduce((s,l)=>s+(Number(l.quantity)||0)*(Number(l.unitPrice)||0),0);
function addLineRC(){ __rc.lines.push({itemId:'',quantity:1,unitPrice:0}); renderLinesRC(); }
function rmLineRC(i){ __rc.lines.splice(i,1); renderLinesRC(); }
function updLineRC(i, campo, v){
  const l = __rc.lines[i];
  if(campo==='itemId'){ l.itemId = v; const it = item(v);
    if(it && !Number(l.unitPrice)){ l.unitPrice = it.unitPrice; renderLinesRC(); return; } }
  else l[campo] = Number(v)||0;
  const c = document.getElementById('rclt'+i);
  if(c) c.textContent = money((Number(l.quantity)||0)*(Number(l.unitPrice)||0));
  const t = document.getElementById('rcTotal'); if(t) t.textContent = money(rcTotal());
}
function salvarRC(){
  const sol = document.getElementById('rc_sol').value;
  const dep = document.getElementById('rc_dep').value;
  const just = document.getElementById('rc_just').value.trim();
  if(!sol){ toast('Selecione o solicitante.','err'); return; }
  if(!dep){ toast('Selecione o centro de custo.','err'); return; }
  if(just.length < 10){ toast('Escreva uma justificativa com pelo menos 10 caracteres — quem aprova precisa entender o motivo.','err'); return; }
  if(!__rc.lines.length){ toast('Inclua pelo menos um item.','err'); return; }
  const vistos = new Set();
  for(let i=0;i<__rc.lines.length;i++){
    const l = __rc.lines[i], n = i+1;
    if(!l.itemId){ toast(`Linha ${n}: escolha o item.`,'err'); return; }
    if(!(Number(l.quantity)>0)){ toast(`Linha ${n}: quantidade precisa ser maior que zero.`,'err'); return; }
    if(vistos.has(l.itemId)){ toast(`Linha ${n}: item repetido. Some as quantidades numa linha só.`,'err'); return; }
    vistos.add(l.itemId);
  }
  const lines = __rc.lines.map(l=>({itemId:l.itemId, quantity:Math.round(Number(l.quantity)), unitPrice:+Number(l.unitPrice).toFixed(2)}));
  const dados = {requesterId:sol, deptId:dep, lines, justificativa:just,
    urgencia:document.getElementById('rc_urg').value, neededAt:document.getElementById('rc_data').value};
  const rc = __rc.id ? byId(app.data.requisitions, __rc.id) : null;
  if(rc) Object.assign(rc, dados);
  else app.data.requisitions.push({id:uid(), code:seq(app.data.requisitions,'RC',5), ...dados,
    status:'rascunho', createdAt:today(), aprovacoes:[], purchaseId:''});
  audit(rc?'Editou requisição':'Criou requisição','Requisições', rc?rc.code:'', `${lines.length} item(ns) · ${money(rcTotal())}`);
  saveData(); closeModal(); switchTab('requisitions');
  toast(rc?'Rascunho atualizado.':'Requisição criada em rascunho. Envie para aprovação quando estiver pronta.');
}

function enviarRC(id){
  const rc = byId(app.data.requisitions, id); if(!rc) return;
  if(!guard('requisitions','editar')) return;
  if(rc.status !== 'rascunho'){ toast('Esta requisição já foi enviada.','warn'); return; }
  const total = docTotal(rc);
  const exigido = nivelExigido(total);
  const cadeia = NIVEIS.filter(n=>n.n<=exigido).map(n=>n.label).join(' → ');
  const podem = quemAssina(rc);
  confirmDialog('Enviar para aprovação',
    `${rc.code} · ${money(total)}\n\nFaixa de ${nivelLabel(exigido)}: exige assinatura de ${cadeia}.\n\n` +
    (podem.length ? `Primeira assinatura cabe a: ${podem.join(', ')}.`
                  : `Atenção: ninguém ativo tem nível e limite para a primeira assinatura. Ela ficará parada.`),
    () => { rc.status='aguardando';
      audit('Enviou requisição para aprovação','Requisições',rc.code,money(total));
      saveData(); switchTab('requisitions');
      toast(`${rc.code} enviada para aprovação.`); }, 'Enviar');
}

function decidirRC(id, aprovar){
  const rc = byId(app.data.requisitions, id); if(!rc) return;
  if(!guard('requisitions','aprovar')) return;
  if(rc.status !== 'aguardando'){ toast('Esta requisição não está aguardando aprovação.','warn'); return; }
  const total = docTotal(rc);
  if(aprovar){
    const chk = podeAssinar(rc, app.user);
    if(!chk.ok){
      const podem = quemAssina(rc);
      toast(`Não é possível assinar: ${chk.motivo}.` + (podem.length?` Cabe a: ${podem.join(', ')}.`:''), 'err');
      return;
    }
  }
  const dep = depto(rc.deptId);
  const gasto = app.data.requisitions.filter(q=>q.deptId===rc.deptId && q.status!=='reprovada' && q.id!==rc.id)
    .reduce((a,q)=>a+docTotal(q),0);
  const prox = proximoNivel(rc);
  const exigido = nivelExigido(total);
  const cots = app.data.quotations.filter(c=>c.requisitionId===rc.id);
  openModal(aprovar ? `Aprovar ${rc.code} — ${nivelLabel(prox)}` : `Reprovar ${rc.code}`, `
    <dl class="dl" style="margin-bottom:12px">
      <dt>Solicitante</dt><dd>${esc(funcLbl(rc.requesterId))}</dd>
      <dt>Centro de custo</dt><dd>${esc(deptoLbl(rc.deptId))}</dd>
      <dt>Valor</dt><dd><strong>${money(total)}</strong> — faixa de ${nivelLabel(exigido)}</dd>
      <dt>Assinaturas</dt><dd>${selosAssinatura(rc)}</dd>
      <dt>Justificativa</dt><dd>${esc(rc.justificativa)}</dd>
      ${dep && dep.orcamento ? `<dt>Orçamento do centro</dt><dd>${money(gasto+total)} de ${money(dep.orcamento)} comprometidos ${
        (gasto+total) > dep.orcamento ? '<span class="badge badge-danger">estoura o orçamento</span>'
        : (gasto+total) > dep.orcamento*0.85 ? '<span class="badge badge-warning">perto do limite</span>' : ''}</dd>` : ''}
      <dt>Cotações</dt><dd>${cots.length
        ? `${cots.length} recebida(s)${cots.some(c=>c.escolhida)?' · fornecedor já escolhido':' · nenhuma escolhida ainda'}`
        : '<span class="badge badge-warning">nenhuma cotação registrada</span>'}</dd>
    </dl>
    ${aprovar && exigido > 1 ? `<div class="info-box" style="margin-bottom:12px">
      Você está assinando como <strong>${nivelLabel(prox)}</strong>.
      ${prox < exigido ? `Depois de você, ainda falta a assinatura de ${NIVEIS.filter(n=>n.n>prox&&n.n<=exigido).map(n=>n.label).join(' e ')}.`
                       : 'Esta é a última assinatura necessária — a requisição será liberada.'}
    </div>` : ''}
    <div class="form-group">
      <label for="rc_motivo">${aprovar ? 'Observação (opcional)' : 'Motivo da reprovação *'}</label>
      <textarea id="rc_motivo" rows="3" placeholder="${aprovar?'Alguma condição ou ressalva?':'Explique para o solicitante o que precisa mudar.'}"></textarea>
    </div>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn ${aprovar?'btn-success':'btn-danger'}" onclick="confirmarDecisaoRC('${id}',${aprovar})">${aprovar?'Assinar aprovação':'Reprovar'}</button>`);
}
function confirmarDecisaoRC(id, aprovar){
  const rc = byId(app.data.requisitions, id);
  const motivo = document.getElementById('rc_motivo').value.trim();
  if(!aprovar && motivo.length < 5){ toast('Escreva o motivo da reprovação — o solicitante precisa saber o que corrigir.','err'); return; }
  const total = docTotal(rc);
  if(aprovar){
    const chk = podeAssinar(rc, app.user);
    if(!chk.ok){ toast('Não é possível assinar: '+chk.motivo+'.','err'); return; }
    rc.aprovacoes.push({user:app.user.name, acao:'aprovou', nivel:chk.nivel,
      nivelLabel:nivelLabel(chk.nivel), at:today(), motivo});
    const falta = proximoNivel(rc);
    if(falta){
      audit('Assinou requisição','Requisições',rc.code,`${nivelLabel(chk.nivel)} · ${money(total)} · aguarda ${nivelLabel(falta)}`);
      saveData(); closeModal(); switchTab(app.tab);
      toast(`${rc.code} assinada por ${nivelLabel(chk.nivel)}. Ainda aguarda ${nivelLabel(falta)}.`);
      return;
    }
    rc.status = 'aprovada';
    audit('Aprovou requisição','Requisições',rc.code,`${money(total)} · todas as assinaturas concluídas`);
    saveData(); closeModal(); switchTab(app.tab);
    toast(`${rc.code} aprovada com todas as assinaturas. Já pode virar pedido de compra.`);
    return;
  }
  rc.status = 'reprovada';
  rc.aprovacoes.push({user:app.user.name, acao:'reprovou', nivel:nivelDoUsuario(app.user),
    nivelLabel:nivelLabel(nivelDoUsuario(app.user)), at:today(), motivo});
  audit('Reprovou requisição','Requisições',rc.code, money(total)+' · '+motivo);
  saveData(); closeModal(); switchTab(app.tab);
  toast(`${rc.code} reprovada.`);
}
function reabrirRC(id){
  const rc = byId(app.data.requisitions, id); if(!rc || !guard('requisitions','editar')) return;
  confirmDialog('Reabrir requisição',
    `${rc.code} volta para rascunho e pode ser corrigida e reenviada. O histórico de aprovações é mantido.`,
    () => { rc.status='rascunho'; audit('Reabriu requisição','Requisições',rc.code,'');
      saveData(); switchTab('requisitions'); toast(`${rc.code} voltou para rascunho.`); }, 'Reabrir');
}
function gerarPedidoRC(id){
  const rc = byId(app.data.requisitions, id); if(!rc) return;
  if(!guard('purchases','criar')) return;
  if(rc.status !== 'aprovada'){ toast('Só requisições aprovadas viram pedido de compra.','warn'); return; }
  const escolhida = cotDe(rc.id).find(c=>c.escolhida);
  const sugerido = escolhida ? byId(app.data.suppliers, escolhida.supplierId)
    : (app.data.suppliers.find(f => rc.lines.some(l => { const i=item(l.itemId); return i && i.supplierId===f.id; }))
       || app.data.suppliers[0]);
  openForm(`Gerar pedido a partir de ${rc.code}`, [
    {name:'supplierId', label:'Fornecedor', type:'select', required:true,
      options:app.data.suppliers.map(f=>({value:f.id,label:f.name})),
      hint: escolhida ? `Sugerido pela cotação escolhida (${supLbl(escolhida.supplierId)}).`
                      : 'Sugerido a partir do fornecedor cadastrado nos itens. Nenhuma cotação foi escolhida.'},
    {name:'expectedAt', label:'Previsão de entrega', type:'date', required:true, half:true,
      hint:`A requisição precisa do material até ${fmtDate(rc.neededAt)}.`},
  ], {supplierId: sugerido?sugerido.id:'', expectedAt: rc.neededAt}, v => {
    const pc = {id:uid(), code:seq(app.data.purchases,'PC',5), supplierId:v.supplierId,
      lines: rc.lines.map(l=>({...l})), status:'enviado', createdAt:today(),
      expectedAt:v.expectedAt, stockApplied:false, requisitionId:rc.id};
    app.data.purchases.push(pc);
    rc.status = 'convertida'; rc.purchaseId = pc.id;

/* ---------------------------- COTAÇÕES ---------------------------- */
/* Cada cotação é a proposta de um fornecedor para uma requisição inteira. */
const cotDe = rcId => app.data.quotations.filter(c=>c.requisitionId===rcId);
const cotTotal = c => (c.lines||[]).reduce((a,l)=>a+l.quantity*l.unitPrice, 0);

function mapaCotacao(rcId){
  const rc = byId(app.data.requisitions, rcId); if(!rc) return;
  const cots = cotDe(rcId);
  const melhorTotal = cots.length ? Math.min(...cots.map(cotTotal)) : 0;
  /* por linha: qual fornecedor tem o menor preço */
  const melhorLinha = {};
  rc.lines.forEach(l => {
    let min = Infinity;
    cots.forEach(c => { const cl = c.lines.find(x=>x.itemId===l.itemId);
      if(cl && cl.unitPrice > 0 && cl.unitPrice < min) min = cl.unitPrice; });
    melhorLinha[l.itemId] = min;
  });
  const escolhida = cots.find(c=>c.escolhida);
  openModal(`Mapa de cotação — ${rc.code}`, `
    <dl class="dl" style="margin-bottom:12px">
      <dt>Requisição</dt><dd>${esc(rc.code)} · ${esc(funcLbl(rc.requesterId))}</dd>
      <dt>Valor estimado</dt><dd>${money(docTotal(rc))}</dd>
      <dt>Propostas</dt><dd>${cots.length} fornecedor(es)${escolhida?` · escolhido: <strong>${esc(supLbl(escolhida.supplierId))}</strong>`:''}</dd>
    </dl>
    ${cots.length ? `
    <table class="lines"><thead><tr>
      <th style="width:30%">Item</th><th class="num">Qtd</th>
      ${cots.map(c=>`<th class="num">${esc(supLbl(c.supplierId))}</th>`).join('')}
    </tr></thead><tbody>
      ${rc.lines.map(l=>`<tr>
        <td>${esc(itemLbl(l.itemId))}</td><td class="num">${num(l.quantity)}</td>
        ${cots.map(c=>{
          const cl = c.lines.find(x=>x.itemId===l.itemId);
          if(!cl || !cl.unitPrice) return '<td class="num" style="color:var(--text-light)">não cotou</td>';
          const eMelhor = cl.unitPrice === melhorLinha[l.itemId];
          return `<td class="num"${eMelhor?' style="background:rgba(8,127,35,.12);font-weight:700"':''}>
            ${money(cl.unitPrice)}${eMelhor?' <span class="badge badge-success">menor</span>':''}</td>`;
        }).join('')}
      </tr>`).join('')}
      <tr style="border-top:2px solid var(--border-color)">
        <td colspan="2"><strong>Total da proposta</strong></td>
        ${cots.map(c=>{const t=cotTotal(c); const eMelhor = t===melhorTotal;
          return `<td class="num"${eMelhor?' style="background:rgba(8,127,35,.12)"':''}>
            <strong>${money(t)}</strong>${eMelhor?'<br><span class="badge badge-success">melhor total</span>':''}</td>`;}).join('')}
      </tr>
      <tr><td colspan="2">Prazo de entrega</td>
        ${cots.map(c=>`<td class="num">${c.prazoDias} dia(s)</td>`).join('')}</tr>
      <tr><td colspan="2">Condição de pagamento</td>
        ${cots.map(c=>`<td class="num">${esc(c.pagamento||'—')}</td>`).join('')}</tr>
      <tr><td colspan="2">Validade da proposta</td>
        ${cots.map(c=>`<td class="num">${c.validade?fmtDate(c.validade):'—'}${c.validade&&c.validade<today()?' <span class="badge badge-danger">vencida</span>':''}</td>`).join('')}</tr>
      <tr><td colspan="2"></td>
        ${cots.map(c=>`<td class="num">
          ${c.escolhida ? '<span class="badge badge-success">escolhida</span>'
            : ifCan('requisitions','editar',`<button class="btn btn-xs btn-primary" onclick="escolherCotacao('${c.id}')">Escolher</button>`)}
          ${ifCan('requisitions','editar',`<button class="btn btn-xs btn-danger" onclick="excluirCotacao('${c.id}')">✕</button>`)}
        </td>`).join('')}</tr>
    </tbody></table>
    ${cots.length < 3 ? `<div class="info-box" style="margin-top:12px;border-left-color:var(--warning)">
      Boa prática de compras pede pelo menos três cotações antes de decidir. Você tem ${cots.length}.</div>` : ''}
    ` : `<div class="lines-empty">Nenhuma cotação registrada. Use o botão abaixo para lançar a proposta de um fornecedor.</div>`}`,
    `<button class="btn" onclick="closeModal()">Fechar</button>
     ${ifCan('requisitions','editar',`<button class="btn btn-primary" onclick="formCotacao('${rcId}')">Lançar cotação</button>`)}`);
}

let __cot = null;
function formCotacao(rcId){
  const rc = byId(app.data.requisitions, rcId); if(!rc) return;
  if(!guard('requisitions','editar')) return;
  const jaCotaram = cotDe(rcId).map(c=>c.supplierId);
  const disponiveis = app.data.suppliers.filter(f=>!jaCotaram.includes(f.id));
  if(!disponiveis.length){ toast('Todos os fornecedores cadastrados já cotaram esta requisição.','warn'); return; }
  __cot = {rcId, lines: rc.lines.map(l=>({itemId:l.itemId, quantity:l.quantity, unitPrice:0}))};
  openModal(`Lançar cotação — ${rc.code}`, `
    <div class="form-row">
      <div class="form-group" style="grid-column:1/-1">
        <label for="ct_forn">Fornecedor *</label>
        <select id="ct_forn"><option value="">— selecione —</option>
        ${disponiveis.map(f=>`<option value="${f.id}">${esc(f.name)} — ${esc(f.city)}</option>`).join('')}</select>
      </div>
      <div class="form-group">
        <label for="ct_prazo">Prazo de entrega (dias) *</label>
        <input type="number" id="ct_prazo" min="1" value="15">
      </div>
      <div class="form-group">
        <label for="ct_val">Validade da proposta</label>
        <input type="date" id="ct_val" value="${addDays(today(),15)}">
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label for="ct_pag">Condição de pagamento</label>
        <input type="text" id="ct_pag" placeholder="Ex.: 30/60 dias, à vista com 3% de desconto">
      </div>
    </div>
    <div class="lines-head"><h4>Preços propostos</h4></div>
    <div id="ctLinesBox"></div>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="salvarCotacao()">Salvar cotação</button>`);
  renderLinesCot();
}
function renderLinesCot(){
  document.getElementById('ctLinesBox').innerHTML = `
    <table class="lines"><thead><tr>
      <th style="width:56%">Item</th><th class="num">Qtd</th><th class="num" style="width:22%">Preço unitário</th><th class="num">Total</th>
    </tr></thead><tbody>
    ${__cot.lines.map((l,i)=>`<tr>
      <td>${esc(itemLbl(l.itemId))}</td>
      <td class="num">${num(l.quantity)}</td>
      <td><input type="number" min="0" step="0.01" value="${l.unitPrice||''}" placeholder="0,00"
           oninput="updLineCot(${i}, this.value)"></td>
      <td class="num" id="ctlt${i}">${money(l.quantity*l.unitPrice)}</td>
    </tr>`).join('')}</tbody></table>
    <div class="lines-total"><span>Total da proposta</span><strong id="ctTotal">${money(__cot.lines.reduce((a,l)=>a+l.quantity*l.unitPrice,0))}</strong></div>
    <div class="form-hint" style="margin-top:8px">Deixe em zero os itens que este fornecedor não cotou.</div>`;
}
function updLineCot(i, v){
  __cot.lines[i].unitPrice = Number(v)||0;
  document.getElementById('ctlt'+i).textContent = money(__cot.lines[i].quantity*__cot.lines[i].unitPrice);
  document.getElementById('ctTotal').textContent = money(__cot.lines.reduce((a,l)=>a+l.quantity*l.unitPrice,0));
}
function salvarCotacao(){
  const forn = document.getElementById('ct_forn').value;
  const prazo = Number(document.getElementById('ct_prazo').value);
  if(!forn){ toast('Selecione o fornecedor.','err'); return; }
  if(!(prazo>0)){ toast('Informe o prazo de entrega em dias.','err'); return; }
  if(!__cot.lines.some(l=>l.unitPrice>0)){ toast('Preencha o preço de pelo menos um item.','err'); return; }
  const rc = byId(app.data.requisitions, __cot.rcId);
  app.data.quotations.push({id:uid(), code:seq(app.data.quotations,'COT',5), requisitionId:__cot.rcId,
    supplierId:forn, lines:__cot.lines.map(l=>({...l})), prazoDias:prazo,
    validade:document.getElementById('ct_val').value,
    pagamento:document.getElementById('ct_pag').value.trim(),
    escolhida:false, createdAt:today()});
  audit('Lançou cotação','Cotações', rc.code, `${supLbl(forn)} · ${money(__cot.lines.reduce((a,l)=>a+l.quantity*l.unitPrice,0))}`);
  saveData(); closeModal(); mapaCotacao(__cot.rcId);
  toast('Cotação registrada.');
}
function escolherCotacao(id){
  const c = byId(app.data.quotations, id); if(!c) return;
  if(!guard('requisitions','editar')) return;
  const rc = byId(app.data.requisitions, c.requisitionId);
  const outras = cotDe(c.requisitionId).filter(x=>x.id!==id);
  const maisBarata = [c,...outras].sort((a,b)=>cotTotal(a)-cotTotal(b))[0];
  const total = cotTotal(c);
  const aviso = maisBarata.id !== id
    ? `\n\nAtenção: esta não é a proposta mais barata. A de ${supLbl(maisBarata.supplierId)} sai por ${money(cotTotal(maisBarata))}, ${money(total-cotTotal(maisBarata))} a menos.`
    : '';
  confirmDialog('Escolher fornecedor',
    `${supLbl(c.supplierId)} — ${money(total)} — entrega em ${c.prazoDias} dia(s).\n\nOs preços desta proposta passam a valer na requisição ${rc.code}.${aviso}`,
    () => {
      cotDe(c.requisitionId).forEach(x=>x.escolhida = (x.id===id));
      /* atualiza os preços da requisição com os da cotação escolhida */
      rc.lines.forEach(l => { const cl = c.lines.find(x=>x.itemId===l.itemId);
        if(cl && cl.unitPrice>0) l.unitPrice = cl.unitPrice; });
      audit('Escolheu cotação','Cotações', rc.code, `${supLbl(c.supplierId)} · ${money(total)}`);
      saveData(); closeModal(); switchTab('requisitions');
      toast(`${supLbl(c.supplierId)} escolhido. Preços da requisição atualizados.`);
    }, 'Escolher');
}
function excluirCotacao(id){
  const c = byId(app.data.quotations, id); if(!c) return;
  if(!guard('requisitions','excluir')) { toast('Seu usuário não pode excluir cotações.','err'); return; }
  const rcId = c.requisitionId;
  confirmDialog('Excluir cotação', `A proposta de ${supLbl(c.supplierId)} será removida do mapa.`,
    () => { app.data.quotations = app.data.quotations.filter(x=>x.id!==id);
      audit('Excluiu cotação','Cotações','', supLbl(c.supplierId));
      saveData(); closeModal(); mapaCotacao(rcId); toast('Cotação removida.'); }, 'Excluir');
}

      segAntes!==v.segmento ? `ramo alterado para ${v.segmento}` : 'dados atualizados');
    saveData(); buildSidebar(); switchTab(app.tab);
    toast(segAntes!==v.segmento
      ? `Ramo alterado para ${SEGMENTOS[v.segmento]}. O menu foi ajustado.`
      : 'Dados da empresa atualizados.');
  });
}

/* ---------------------------- USUÁRIOS ---------------------------- */
const usuario = id => byId(app.data.users, id);

function contaGestores(exceto){
  return app.data.users.filter(u => u.id !== exceto && u.active !== false &&
    (u.master || (u.perms && u.perms.users && u.perms.users.editar))).length;
}
function formUser(id){
  const u = id ? usuario(id) : null;
  if(!guard('users', u ? 'editar' : 'criar')) return;
  if(u && u.master && !app.user.master){
    toast('Somente o próprio usuário mestre altera os dados do mestre.','err'); return;
  }
  const outros = app.data.users.filter(x => !x.master && x.id !== id);
  const campos = [
    {name:'name', label:'Nome completo', required:true},
    {name:'email', label:'E-mail de acesso', type:'email', required:true, half:true},
    {name:'modelo', label:'Perfil base', type:'select', required:true, half:true,
      options:Object.entries(MODELOS).map(([k,v])=>({value:k, label:k+' — '+v}))
        .concat(u && u.modelo==='personalizado' ? [{value:'personalizado', label:'personalizado — matriz ajustada manualmente'}] : []),
      hint: u ? 'Trocar o perfil substitui a matriz de permissões atual.'
              : 'Define as permissões iniciais. Ajuste depois em "Permissões".'},
    {name:'password', label: u ? 'Nova senha' : 'Senha inicial', type:'password', required:!u, half:true,
      onchange:"medirSenha('fld_password','hint_password')",
      hint: u ? 'Deixe em branco para manter a senha atual.'
              : `Mínimo de ${SENHA_MIN} caracteres, com maiúscula, minúscula e número.`},
    {name:'mustChange', label:'Exigir troca no primeiro acesso', type:'select', required:true, half:true,
      options:[{value:'sim',label:'Sim — usuário define a própria senha ao entrar'},{value:'nao',label:'Não'}]},
    {name:'active', label:'Situação', type:'select', required:true, half:true,
      options:[{value:'sim',label:'Ativo'},{value:'nao',label:'Bloqueado'}]},
    {name:'expiresAt', label:'Acesso válido até', type:'date', half:true,
      hint:'Opcional. Use para estagiário, consultor ou terceiro. Em branco = sem prazo.'},
    {name:'nivel', label:'Nível de alçada', type:'select', half:true,
      options:[{value:0,label:'sem alçada — não aprova'}].concat(NIVEIS.map(n=>({value:n.n,
        label:`${n.n} · ${n.label} (até ${n.ate===Infinity?'sem teto':money(n.ate)})`}))),
      hint:'Define em que etapa da cadeia este usuário assina.'},
    {name:'limite', label:'Limite individual (R$)', type:'number', min:0, step:'0.01', half:true,
      hint:'Teto próprio, independente do nível. Zero = não aprova nada.'},
  ];
  if(!u && outros.length) campos.push({name:'copiarDe', label:'Copiar permissões de', type:'select',
    options:outros.map(x=>({value:x.id, label:`${x.name} (${x.modelo})`})),
    hint:'Opcional. Se preenchido, ignora o perfil base e clona a matriz do usuário escolhido.'});

  openForm(u ? `Editar ${u.name}` : 'Novo usuário', campos,
    u ? {...u, active: u.active===false?'nao':'sim', mustChange: u.mustChangePassword?'sim':'nao', password:''}
      : {modelo:'operador', active:'sim', mustChange:'sim', limite:0, nivel:0}, v => {
    const email = v.email.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return 'Informe um e-mail válido.';
    if(app.data.users.some(x => x.email.toLowerCase()===email && x.id!==id))
      return `Já existe um usuário com o e-mail ${email}.`;
    if(v.password){ const e = validaSenha(v.password); if(e) return e; }
    if(!u && !v.password) return 'Defina uma senha inicial para o novo usuário.';
    if(v.expiresAt && v.expiresAt < today()) return 'A data de validade não pode estar no passado.';

    if(u){
      if(u.master && v.active==='nao') return 'O usuário mestre não pode ser bloqueado.';
      if(u.id===app.user.id && v.active==='nao') return 'Você não pode bloquear o próprio acesso.';
      if(v.active==='nao' && !u.master && (u.perms&&u.perms.users&&u.perms.users.editar) && contaGestores(u.id)===0)
        return 'Este é o último usuário ativo capaz de gerenciar acessos. Promova outro antes de bloquear este.';
      const trocouModelo = u.modelo !== v.modelo && v.modelo !== 'personalizado';
      u.name = v.name; u.email = email; u.modelo = v.modelo;
      u.active = v.active==='sim'; u.expiresAt = v.expiresAt || '';
      u.mustChangePassword = v.mustChange==='sim';
      u.limite = Number(v.limite) || 0;
      u.nivel = Number(v.nivel) || 0;
      if(v.password){ u.password = v.password; u.passwordChangedAt = today(); }
      if(trocouModelo) u.perms = permsDe(v.modelo);
      audit('Editou usuário','Usuários', email,
        [v.password?'senha redefinida':'', trocouModelo?`perfil alterado para ${v.modelo}`:'',
         v.active==='nao'?'acesso bloqueado':''].filter(Boolean).join(' · ') || 'dados atualizados');
    } else {
      const base = v.copiarDe ? usuario(v.copiarDe) : null;
      app.data.users.push({id:uid(), name:v.name, email, password:v.password, master:false,
        modelo: base ? 'personalizado' : v.modelo, active:v.active==='sim',
        perms: base ? JSON.parse(JSON.stringify(base.perms)) : permsDe(v.modelo),
        expiresAt: v.expiresAt || '', mustChangePassword: v.mustChange==='sim',
        limite: Number(v.limite) || 0, nivel: Number(v.nivel) || 0,
        createdAt:today(), createdBy:app.user.name, lastLogin:'', passwordChangedAt:''});
      audit('Criou usuário','Usuários', email,
        base ? `permissões copiadas de ${base.name}` : 'perfil '+v.modelo);
    }
    saveData(); renderGrid('users');
    toast(u ? 'Usuário atualizado.' : `Usuário ${email} criado.${v.mustChange==='sim'?' Ele definirá a própria senha no primeiro acesso.':''}`);
  });
}
function alternarBloqueio(id){
  if(!guard('users','editar')) return;
  const u = usuario(id); if(!u) return;
  if(u.master){ toast('O usuário mestre não pode ser bloqueado.','err'); return; }
  if(u.id===app.user.id){ toast('Você não pode bloquear o próprio acesso.','err'); return; }
  const bloquear = u.active !== false;
  if(bloquear && u.perms && u.perms.users && u.perms.users.editar && contaGestores(u.id)===0){
    toast('Este é o último usuário ativo capaz de gerenciar acessos. Promova outro antes de bloquear este.','err');
    return;
  }
  confirmDialog(bloquear ? 'Bloquear acesso' : 'Reativar acesso',
    bloquear ? `${u.name} deixa de conseguir entrar no sistema. Os registros e a trilha de auditoria dele continuam intactos.`
             : `${u.name} volta a conseguir entrar com as permissões que já tinha.`,
    () => { u.active = !bloquear;
      audit(bloquear?'Bloqueou usuário':'Reativou usuário','Usuários',u.email,'');
      saveData(); renderGrid('users');
      toast(bloquear ? 'Acesso bloqueado.' : 'Acesso reativado.'); },
    bloquear ? 'Bloquear' : 'Reativar');
}

/* ---- editor da matriz de permissões ---- */
let __perms = null;
function editarPerms(id){
  if(!guard('users','editar')) return;
  const u = usuario(id); if(!u) return;
  if(u.master){ toast('O usuário mestre tem acesso irrestrito por definição — não há o que ajustar.','warn'); return; }
  if(u.id===app.user.id){ toast('Você não pode alterar as próprias permissões. Peça a outro administrador.','err'); return; }
  __perms = {id, matriz: JSON.parse(JSON.stringify(u.perms || permsVazio()))};
  openModal(`Permissões de ${u.name}`, `
    <div class="info-box" style="margin-bottom:14px">
      Marque o que ${esc(u.name.split(' ')[0])} pode fazer em cada módulo.
      Sem <strong>Ver</strong>, o módulo nem aparece no menu dele.
    </div>
    <div class="grid-toolbar" style="margin-bottom:12px">
      <span style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-light)">Aplicar modelo:</span>
      ${Object.keys(MODELOS).map(m=>`<button class="btn btn-xs" onclick="aplicarModelo('${m}')" title="${esc(MODELOS[m])}">${m}</button>`).join('')}
      <button class="btn btn-xs btn-danger" onclick="limparPerms()">Desmarcar tudo</button>
    </div>
    <div id="permsBox"></div>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="salvarPerms()">Salvar permissões</button>`);
  renderPerms();
}
function renderPerms(){
  document.getElementById('permsBox').innerHTML = `
    <table class="lines"><thead><tr><th style="width:34%">Módulo</th>
      ${ACOES.map(a=>`<th style="text-align:center">${ACAO_LABEL[a]}</th>`).join('')}
    </tr></thead><tbody>
    ${MODULES.map(g => `<tr><td colspan="${ACOES.length+1}"
        style="background:var(--light-gray);font-size:9px;font-weight:700;text-transform:uppercase;
        letter-spacing:.5px;color:var(--text-light);padding:6px 7px">${esc(g.group)}</td></tr>` +
      g.items.map(m => `<tr>
        <td>${esc(m.label)}<span class="tcode" style="margin-left:6px;font-size:9px;color:var(--text-light)">${m.code}</span></td>
        ${ACOES.map(a => {
          if(!MOD_ACOES[m.id].includes(a)) return '<td style="text-align:center;color:var(--text-light)">—</td>';
          const dica = a==='aprovar' ? APROVAR_LABEL[m.id]
                     : (ACAO_HINT[a] && ACAO_HINT[a][m.id]) || '';
          return `<td style="text-align:center"><input type="checkbox"
            ${__perms.matriz[m.id][a]?'checked':''} style="width:auto;cursor:pointer"
            ${dica?`title="${esc(dica)}"`:''}
            onchange="__perms.matriz['${m.id}']['${a}']=this.checked"></td>`;
        }).join('')}
      </tr>`).join('')).join('')}
    </tbody></table>
    <div class="form-hint" style="margin-top:10px">
      Passe o mouse sobre as caixas de <strong>Aprovar</strong> e <strong>Criar</strong> para ver o que cada uma libera.
    </div>`;
}
function aplicarModelo(m){ __perms.matriz = permsDe(m); renderPerms(); toast(`Modelo "${m}" aplicado. Ajuste o que quiser antes de salvar.`); }
function limparPerms(){ __perms.matriz = permsVazio(); renderPerms(); }
function salvarPerms(){
  const u = usuario(__perms.id); if(!u) return;
  // coerência: sem "ver", as outras ações do módulo não fazem sentido
  const ajustados = [];
  for(const m in __perms.matriz){
    if(!__perms.matriz[m].ver && Object.values(__perms.matriz[m]).some(Boolean)){
      ACOES.forEach(a => { if(__perms.matriz[m][a] !== undefined) __perms.matriz[m][a] = false; });
      ajustados.push(m);
    }
  }
  u.perms = __perms.matriz; u.modelo = 'personalizado';
  const liberados = Object.entries(u.perms).filter(([,v])=>v.ver).length;
  audit('Alterou permissões','Usuários',u.email,`${liberados} módulo(s) liberado(s)`);
  saveData(); closeModal(); renderGrid('users');
  toast(ajustados.length
    ? `Permissões salvas. ${ajustados.length} módulo(s) foram zerados por estarem sem a permissão de Ver.`
    : `Permissões de ${u.name} atualizadas.`);
}

/* ---------------------------- IMPORTAÇÃO REAL ---------------------------- */
const IMPORT_SCHEMAS = {
  inventory:{ label:'Estoque', collection:'inventory',
    fields:[['sku','SKU',true],['description','Descrição',true],['category','Categoria',false],
            ['type','Tipo',false],['quantity','Quantidade',true],['minQuantity','Mínimo',false],
            ['unitPrice','Custo unitário',true]],
    build:r=>({id:uid(), sku:String(r.sku).trim(), description:String(r.description).trim(),
      category:CATEGORIAS.includes(r.category)?r.category:'Motor',
      type:String(r.type).toLowerCase().startsWith('prod')?'produto':'materia',
      quantity:Math.max(0,Math.round(Number(r.quantity)||0)),
      minQuantity:Math.max(0,Math.round(Number(r.minQuantity)||50)),
      unitPrice:Math.max(0,+(Number(r.unitPrice)||0).toFixed(2)),
      supplierId:'', updatedAt:today()}),
    dup:(r,d)=>d.inventory.some(i=>i.sku.toUpperCase()===String(r.sku).trim().toUpperCase())
  },
  employees:{ label:'Funcionários', collection:'employees',
    fields:[['name','Nome',true],['cpf','CPF',true],['cargo','Cargo',true],
            ['departamento','Sigla do departamento',true],['salario','Salário',false],
            ['admissao','Admissão (AAAA-MM-DD)',false],['email','E-mail',false]],
    build:r=>{
      const dp = app.data.departments.find(d=>d.code===String(r.departamento).trim().toUpperCase());
      return {id:uid(), code:seq(app.data.employees,'MAT',4), name:String(r.name).trim(),
        cpf:String(r.cpf).trim(), cargo:String(r.cargo).trim(),
        deptId: dp ? dp.id : (app.data.departments[0]||{}).id,
        admissao: /^\d{4}-\d{2}-\d{2}$/.test(r.admissao) ? r.admissao : today(),
        salario: Math.max(0, Number(r.salario)||0), status:'ativo',
        email:r.email||'', phone:'', userId:''};
    },
    dup:(r,d)=>d.employees.some(e=>e.cpf===String(r.cpf).trim())
  },
  customers:{ label:'Clientes', collection:'customers',
    fields:[['name','Razão social',true],['cnpj','CNPJ',false],['city','Cidade',false],
            ['phone','Telefone',false],['email','E-mail',false]],
    build:r=>({id:uid(), code:seq(app.data.customers,'CLI',4), name:String(r.name).trim(),
      cnpj:r.cnpj||'', city:r.city||'', phone:r.phone||'', email:r.email||'', active:true}),
    dup:(r,d)=>d.customers.some(c=>c.name.toLowerCase()===String(r.name).trim().toLowerCase())
  },
  suppliers:{ label:'Fornecedores', collection:'suppliers',
    fields:[['name','Razão social',true],['cnpj','CNPJ',false],['city','Cidade',false],
            ['phone','Telefone',false],['email','E-mail',false]],
    build:r=>({id:uid(), code:seq(app.data.suppliers,'FOR',4), name:String(r.name).trim(),
      cnpj:r.cnpj||'', city:r.city||'', phone:r.phone||'', email:r.email||'', active:true}),
    dup:(r,d)=>d.suppliers.some(c=>c.name.toLowerCase()===String(r.name).trim().toLowerCase())
  },
};
function baixarModelo(){
  const key = document.getElementById('impModule').value;
  if(!key){ toast('Escolha primeiro o módulo de destino.','err'); return; }
  const sch = IMPORT_SCHEMAS[key];
  const header = Object.fromEntries(sch.fields.map(([f])=>[f,'']));
  const ws = XLSX.utils.json_to_sheet([header]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sch.label);
  XLSX.writeFile(wb, `modelo_${key}.xlsx`);
  toast('Modelo baixado. Preencha e envie de volta.');
}
function lerArquivo(){
  const key = document.getElementById('impModule').value;
  const file = document.getElementById('impFile').files[0];
  const out = document.getElementById('impPreview');
  if(!key){ toast('Escolha o módulo de destino antes do arquivo.','err'); return; }
  if(!file) return;
  const sch = IMPORT_SCHEMAS[key];
  const reader = new FileReader();
  reader.onload = e => {
    let rows;
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
    }catch(err){
      out.innerHTML = `<div class="info-box" style="border-left-color:var(--danger)">
        Não foi possível ler o arquivo. Envie um .xlsx, .xls ou .csv com a primeira linha de cabeçalho.</div>`;
      return;
    }
    if(!rows.length){
      out.innerHTML = `<div class="info-box" style="border-left-color:var(--warning)">O arquivo está vazio.</div>`;
      return;
    }
    const cols = Object.keys(rows[0]);
    const faltando = sch.fields.filter(([f,,req])=>req && !cols.includes(f)).map(([,l])=>l);
    if(faltando.length){
      out.innerHTML = `<div class="info-box" style="border-left-color:var(--danger)">
        <strong>Colunas obrigatórias ausentes:</strong> ${faltando.join(', ')}.<br>
        O cabeçalho precisa usar exatamente estes nomes: <code>${sch.fields.map(([f])=>f).join(', ')}</code>.
        Baixe o modelo para conferir.</div>`;
      app.importBuffer = null;
      return;
    }
    const validas = [], erros = [];
    rows.forEach((r,i)=>{
      const linha = i+2;
      const vazio = sch.fields.filter(([f,l,req])=>req && String(r[f]??'').trim()==='').map(([,l])=>l);
      if(vazio.length){ erros.push(`Linha ${linha}: falta ${vazio.join(', ')}`); return; }
      if(sch.dup(r, app.data)){ erros.push(`Linha ${linha}: já existe no sistema (ignorada)`); return; }
      validas.push(r);
    });
    app.importBuffer = {key, validas};
    out.innerHTML = `
      <div class="panel" style="margin-top:16px">
        <div class="panel-head"><h3>Prévia — ${validas.length} de ${rows.length} linha(s) serão importadas</h3></div>
        <table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${rows.slice(0,8).map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>
        ${rows.length>8?`<div class="pager"><span class="pager-info">Mostrando as 8 primeiras linhas de ${rows.length}.</span></div>`:''}
      </div>
      ${erros.length?`<div class="info-box" style="border-left-color:var(--warning);margin-top:12px">

function confirmarImport(){
  const b = app.importBuffer;
  if(!b || !b.validas.length){ toast('Nada para importar.','err'); return; }
  const sch = IMPORT_SCHEMAS[b.key];
  b.validas.forEach(r => app.data[sch.collection].push(sch.build(r)));
  audit('Importou planilha', sch.label, '', `${b.validas.length} registro(s)`);
  saveData();
  toast(`${b.validas.length} registro(s) importados para ${sch.label}.`);
  cancelarImport();
}

function restaurarBackup(input){
  if(!guard('settings','config')) return;
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      const d = JSON.parse(e.target.result);
      if(!d.inventory || !d.users) throw new Error('estrutura inválida');

      toast('Backup restaurado.');
    }catch(err){ toast('Arquivo inválido. Envie um backup gerado pelo próprio NEXUS.','err'); }
  };
  r.readAsText(f);
}

function gridToRows(key){
  const cfg = GRIDS[key], st = gs(key);
  let rows = cfg.rows();
  if(st.q){ const q=st.q.toLowerCase();
    rows = rows.filter(r => cfg.cols.some(c => String(c.raw(r)??'').toLowerCase().includes(q))); }
  return rows.map(r => Object.fromEntries(cfg.cols.map(c => [c.label, c.raw(r)])));
}
function exportGrid(key, fmt){
  const rows = gridToRows(key), cfg = GRIDS[key];
  if(!rows.length){ toast('Não há registros para exportar.','warn'); return; }
  fmt==='xlsx' ? toXlsx(rows, cfg.title, key) : toPdf(rows, cfg.title, key);
}
function exportReport(fmt){
  if(!reportAtual || !reportAtual.rows.length){ toast('Gere um relatório primeiro.','warn'); return; }
  fmt==='xlsx' ? toXlsx(reportAtual.rows, reportAtual.title, reportAtual.key)
               : toPdf(reportAtual.rows, reportAtual.title, reportAtual.key);
}
function toXlsx(rows, title, name){
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = Object.keys(rows[0]).map(k => ({wch: Math.min(42, Math.max(k.length+2,
    ...rows.slice(0,200).map(r => String(r[k]??'').length + 2)))}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, title.slice(0,28));
  XLSX.writeFile(wb, `nexus_${name}_${today()}.xlsx`);
  toast('Planilha exportada.');
}
function toPdf(rows, title, name){
  const cols = Object.keys(rows[0]);
  const el = document.createElement('div');
  el.style.cssText = 'font-family:Segoe UI,Arial,sans-serif;padding:22px;color:#1A1A1A';
  el.innerHTML = `
    <div style="border-bottom:3px solid #0052CC;padding-bottom:10px;margin-bottom:16px">
      <div style="font-size:22px;font-weight:700;color:#0052CC;letter-spacing:2px">NEXUS</div>
      <div style="font-size:11px;color:#666">NEXUS AUTOMOTIVE SOLUTIONS · Documento gerado em ${fmtDate(today())}</div>
    </div>
    <h2 style="font-size:15px;margin:0 0 12px">${esc(title)}</h2>
    <table style="width:100%;border-collapse:collapse;font-size:9px">
      <thead><tr>${cols.map(c=>`<th style="background:#E8E8E8;border:1px solid #D1D1D1;padding:5px;text-align:left">${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td style="border:1px solid #D1D1D1;padding:5px">${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>
    <div style="margin-top:14px;font-size:9px;color:#666">${rows.length} registro(s) · NEXUS v4.3</div>`;
  html2pdf().set({filename:`nexus_${name}_${today()}.pdf`, margin:8,
    jsPDF:{unit:'mm', format:'a4', orientation: cols.length>6?'landscape':'portrait'}}).from(el).save();
  toast('PDF gerado.');
}

const COLORS = ['#0052CC','#B35C00','#087F23','#C10000','#5B93E8','#7A4FBF'];
function chartOpts(extra={}){
  const dark = document.body.classList.contains('dark-mode');
  const tick = dark ? '#C8C8C8' : '#444', grid = dark ? '#444' : '#E0E0E0';
  return Object.assign({
    responsive:true, maintainAspectRatio:false,
    animation:{duration:400},
    plugins:{legend:{labels:{color:tick, font:{size:11}}}},
    scales:{x:{ticks:{color:tick,font:{size:10}},grid:{color:grid}},
            y:{ticks:{color:tick,font:{size:10}},grid:{color:grid},beginAtZero:true}}
  }, extra);
}
function mk(id, cfg){
  const el = document.getElementById(id); if(!el) return;
  if(app.charts[id]) app.charts[id].destroy();
  app.charts[id] = new Chart(el, cfg);
}
function ultimosMeses(n){
  const out = [], d = new Date();
  for(let i=n-1;i>=0;i--){ const x = new Date(d.getFullYear(), d.getMonth()-i, 1);
    out.push(x.toISOString().slice(0,7)); }
  return out;
}
const mesLabel = m => { const [y,mm]=m.split('-');
  return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+mm-1]+'/'+y.slice(2); };

/* ---------- barra de comando ---------- */
let cmdSel = -1;
function setupCommandBar(){
  const input = document.getElementById('commandInput');
  const box   = document.getElementById('commandSuggestions');
  const matches = q => {
    q = q.trim().toUpperCase();
    if(!q) return [];
    return ALL_MODULES.filter(m => can(m.id,'ver') && moduloVisivel(m.id)).filter(m => m.code.startsWith(q) ||
      m.label.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q));
  };
  const draw = list => {
    box.innerHTML = list.map((m,i)=>
      `<li class="${i===cmdSel?'sel':''}" onmousedown="switchTab('${m.id}');document.getElementById('commandInput').value=''">
        <span>${esc(m.label)}</span><span class="code">${m.code}</span></li>`).join('');
    box.classList.toggle('show', list.length>0);
  };
  input.addEventListener('input', () => { cmdSel = -1; draw(matches(input.value)); });
  input.addEventListener('blur', () => setTimeout(()=>box.classList.remove('show'), 150));
  input.addEventListener('focus', () => { if(input.value) draw(matches(input.value)); });
  input.addEventListener('keydown', e => {
    const list = matches(input.value);
    if(e.key==='ArrowDown'){ e.preventDefault(); cmdSel = Math.min(cmdSel+1, list.length-1); draw(list); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); cmdSel = Math.max(cmdSel-1, 0); draw(list); }
    else if(e.key==='Enter'){
      const alvo = list[cmdSel >= 0 ? cmdSel : 0];
      if(alvo){ switchTab(alvo.id); input.value=''; box.classList.remove('show'); input.blur(); }
      else toast(`Código "${input.value}" não existe. Tente EST, PROD, FIN…`,'err');
    }
    else if(e.key==='Escape'){ input.value=''; box.classList.remove('show'); input.blur(); }
  });
}

/* ==========================================================================
   AUTENTICAÇÃO / TEMA / INÍCIO
   ========================================================================== */
function authenticate(){
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass  = document.getElementById('loginPassword').value;
  const err   = document.getElementById('loginErr');
  const falhar = msg => { err.textContent = msg; err.style.display = 'block'; };

  if(!email || !pass){ falhar('Informe e-mail e senha.'); return; }

  const espera = bloqueioAtivo(email);
  if(espera){ falhar(`Acesso temporariamente bloqueado por tentativas seguidas. Tente novamente em ${espera} minuto(s).`); return; }

  const u = app.data.users.find(x => x.email.toLowerCase()===email);
  if(!u || u.password !== pass){
    const restam = registraFalha(email);
    falhar(restam < 0
      ? `Acesso bloqueado por ${BLOQUEIO_MIN} minutos após ${MAX_TENTATIVAS} tentativas seguidas.`
      : `E-mail ou senha não conferem. Restam ${restam} tentativa(s) antes do bloqueio temporário.`);
    return;
  }
  if(u.active === false){
    audit('Acesso negado — usuário bloqueado','Sessão', email, '', email); saveData();
    falhar('Este acesso está bloqueado. Fale com o administrador do sistema.'); return;
  }
  if(u.expiresAt && u.expiresAt < today()){
    audit('Acesso negado — prazo expirado','Sessão', email, 'expirou em '+fmtDate(u.expiresAt), email); saveData();
    falhar(`O prazo deste acesso expirou em ${fmtDate(u.expiresAt)}. Fale com o administrador.`); return;
  }

  limpaFalhas(email);
  err.style.display = 'none';
  app.user = u;
  u.lastLogin = new Date().toISOString();
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'flex';
  document.getElementById('userDisplay').innerHTML =
    `<span style="cursor:pointer;text-decoration:underline" onclick="meuPerfil()" title="Meu perfil">${esc(u.name)}</span>`
    + ` · ${u.master ? 'mestre' : esc(u.modelo)}`;
  audit('Entrou no sistema','Sessão','', u.email);
  saveData();
  buildSidebar();
  setupCommandBar();
  iniciaSessao();
  atualizaPendencias();
  switchTab('dashboard');
  if(u.mustChangePassword) setTimeout(()=>trocarSenha(true), 300);
}

/* ---- troca de senha pelo próprio usuário ---- */
function trocarSenha(obrigatoria){
  const u = app.user;
  openModal(obrigatoria ? 'Defina uma nova senha' : 'Alterar minha senha', `
    ${obrigatoria ? `<div class="info-box" style="margin-bottom:14px;border-left-color:var(--warning)">
      Esta senha foi definida por um administrador. Escolha uma nova antes de continuar usando o sistema.
    </div>` : ''}
    <div class="form-group">
      <label for="sn_atual">Senha atual</label>
      <input type="password" id="sn_atual" autocomplete="current-password">
    </div>
    <div class="form-group">
      <label for="sn_nova">Nova senha</label>
      <input type="password" id="sn_nova" autocomplete="new-password" oninput="medirSenha('sn_nova','sn_forca')">
      <div id="sn_forca"></div>
    </div>
    <div class="form-group">
      <label for="sn_conf">Repita a nova senha</label>
      <input type="password" id="sn_conf" autocomplete="new-password">
    </div>`,
    `${obrigatoria ? '' : '<button class="btn" onclick="closeModal()">Cancelar</button>'}
     <button class="btn btn-primary" onclick="salvarSenha(${!!obrigatoria})">Salvar senha</button>`);
  setTimeout(()=>{ const el=document.getElementById('sn_atual'); if(el) el.focus(); }, 60);
}
function salvarSenha(obrigatoria){
  const u = app.user;
  const atual = document.getElementById('sn_atual').value;
  const nova  = document.getElementById('sn_nova').value;
  const conf  = document.getElementById('sn_conf').value;
  if(atual !== u.password){ toast('A senha atual não confere.','err'); return; }
  if(nova !== conf){ toast('A nova senha e a repetição não são iguais.','err'); return; }
  if(nova === atual){ toast('A nova senha precisa ser diferente da atual.','err'); return; }
  const erro = validaSenha(nova);
  if(erro){ toast(erro,'err'); return; }
  u.password = nova; u.mustChangePassword = false; u.passwordChangedAt = today();
  audit('Alterou a própria senha','Sessão', u.email, '');
  saveData(); closeModal();
  toast('Senha alterada. Use a nova no próximo acesso.');
}

/* ---- meu perfil ---- */
function meuPerfil(){
  const u = app.user;
  openModal('Meu perfil', `
    <dl class="dl">
      <dt>Nome</dt><dd>${esc(u.name)}</dd>
      <dt>E-mail</dt><dd>${esc(u.email)}</dd>
      <dt>Perfil</dt><dd>${u.master ? 'usuário mestre — acesso irrestrito' : esc(u.modelo)}</dd>
      <dt>Cadastrado em</dt><dd>${fmtDate(u.createdAt)} por ${esc(u.createdBy||'—')}</dd>
      <dt>Último acesso</dt><dd>${fmtDateTime(u.lastLogin)}</dd>
      <dt>Senha alterada em</dt><dd>${u.passwordChangedAt ? fmtDate(u.passwordChangedAt) : 'nunca — ainda é a senha definida no cadastro'}</dd>
      <dt>Alçada de aprovação</dt><dd>${u.master ? 'Diretoria — sem limite'
        : (u.limite ? `${nivelLabel(u.nivel||0)} — até ${money(u.limite)}` : 'não aprova requisições')}</dd>
      ${u.expiresAt ? `<dt>Acesso válido até</dt><dd>${fmtDate(u.expiresAt)}</dd>` : ''}
    </dl>
    <div class="lines-head"><h4>Nome exibido</h4></div>
    <div class="form-group">
      <input type="text" id="mp_nome" value="${esc(u.name)}">
      <div class="form-hint">O e-mail e o perfil só podem ser alterados por um administrador.</div>
    </div>`,
    `<button class="btn" onclick="closeModal()">Fechar</button>
     <button class="btn" onclick="trocarSenha(false)">Alterar senha</button>
     <button class="btn btn-primary" onclick="salvarMeuPerfil()">Salvar nome</button>`);
}
function salvarMeuPerfil(){
  const nome = document.getElementById('mp_nome').value.trim();
  if(!nome){ toast('O nome não pode ficar em branco.','err'); return; }
  app.user.name = nome;
  audit('Atualizou o próprio perfil','Sessão', app.user.email, '');
  saveData(); closeModal();
  document.getElementById('userDisplay').innerHTML =
    `<span style="cursor:pointer;text-decoration:underline" onclick="meuPerfil()" title="Meu perfil">${esc(nome)}</span>`
    + ` · ${app.user.master ? 'mestre' : esc(app.user.modelo)}`;
  toast('Nome atualizado.');
}

['loginEmail','loginPassword'].forEach(id =>
  document.getElementById(id).addEventListener('keydown', e => { if(e.key==='Enter') authenticate(); }));

function logout(){
  confirmDialog('Encerrar sessão','Você voltará para a tela de login. Os dados lançados continuam salvos neste navegador.',
    () => { audit('Saiu do sistema','Sessão','', app.user.email); saveData(); encerrarSessao(); }, 'Sair');
}
function toggleDarkMode(){
  const on = document.body.classList.toggle('dark-mode');
  try{ localStorage.setItem('nexus_theme', on ? 'dark' : 'light'); }catch(e){}
  if(app.user) switchTab(app.tab);
}
(function init(){
  try{ if(localStorage.getItem('nexus_theme')==='dark') document.body.classList.add('dark-mode'); }catch(e){}
  loadData();
  const vl = document.getElementById('verLogin'); if(vl) vl.textContent = NEXUS_VERSION;
})();
</script>
