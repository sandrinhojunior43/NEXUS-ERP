/* ==========================================================================
   SEGURANÇA — política de senha, tentativas e sessão
   ========================================================================== */
const SENHA_MIN = 8;
const MAX_TENTATIVAS = 5;
const BLOQUEIO_MIN = 5;      // minutos de espera após esgotar as tentativas
const SESSAO_MIN = 30;       // inatividade até encerrar a sessão
const AVISO_MIN = 2;         // aviso antes de encerrar

function forcaSenha(senha){
  const falhas = [];
  if(senha.length < SENHA_MIN) falhas.push(`ter pelo menos ${SENHA_MIN} caracteres`);
  if(!/[a-z]/.test(senha) || !/[A-Z]/.test(senha)) falhas.push('misturar maiúsculas e minúsculas');
  if(!/[0-9]/.test(senha)) falhas.push('incluir ao menos um número');
  let nota = 0;
  if(senha.length >= SENHA_MIN) nota++;
  if(senha.length >= 12) nota++;
  if(/[a-z]/.test(senha) && /[A-Z]/.test(senha)) nota++;
  if(/[0-9]/.test(senha)) nota++;
  if(/[^A-Za-z0-9]/.test(senha)) nota++;
  const fracas = ['123456','senha','password','123456789','qwerty','abc123','admin','nexus','12345678'];
  if(fracas.some(f => senha.toLowerCase().includes(f))){ nota = 1; falhas.push('não usar sequências ou palavras óbvias'); }
  if(/^\d+$/.test(senha)){ nota = Math.min(nota,1); falhas.push('não ser só números — datas são as primeiras a serem testadas'); }
  const rotulos = ['muito fraca','fraca','razoável','boa','forte','excelente'];
  return {nota, rotulo:rotulos[nota], falhas, ok: falhas.length===0};
}
function validaSenha(senha){
  const f = forcaSenha(senha);
  return f.ok ? null : 'A senha precisa ' + f.falhas.join(', ') + '.';
}
function barraSenha(senha){
  if(!senha) return '';
  const f = forcaSenha(senha);
  const cor = f.nota<=1 ? 'var(--danger)' : f.nota<=2 ? 'var(--warning)' : f.nota<=3 ? 'var(--primary)' : 'var(--success)';
  return `<div style="margin-top:6px">
    <div style="height:5px;background:var(--light-gray);border:1px solid var(--border-color)">
      <div style="height:100%;width:${f.nota*20}%;background:${cor}"></div></div>
    <div style="font-size:11px;margin-top:4px;color:${cor};font-weight:600">Senha ${f.rotulo}</div>
    ${f.falhas.length?`<div style="font-size:11px;color:var(--text-light);margin-top:2px">Precisa ${f.falhas.join(', ')}.</div>`:''}
  </div>`;
}
function medirSenha(campo, alvo){
  const el = document.getElementById(alvo);
  if(el) el.innerHTML = barraSenha(document.getElementById(campo).value);
}

/* ---- tentativas de acesso ---- */
function seguranca(){
  if(!app.data.security) app.data.security = {tentativas:{}};
  return app.data.security;
}
function bloqueioAtivo(email){
  const t = seguranca().tentativas[email];
  if(!t || !t.ate) return 0;
  const falta = Math.ceil((new Date(t.ate) - new Date())/60000);
  return falta > 0 ? falta : 0;
}
function registraFalha(email){
  const seg = seguranca();
  const t = seg.tentativas[email] = seg.tentativas[email] || {n:0, ate:''};
  t.n++;
  if(t.n >= MAX_TENTATIVAS){
    t.ate = new Date(Date.now() + BLOQUEIO_MIN*60000).toISOString();
    t.n = 0;
    audit('Acesso bloqueado por tentativas','Sessão', email, `${MAX_TENTATIVAS} senhas erradas seguidas`, email);
    saveData();
    return -1;
  } else {
    audit('Tentativa de acesso negada','Sessão', email, `tentativa ${t.n} de ${MAX_TENTATIVAS}`, email);
  }
  saveData();
  return MAX_TENTATIVAS - t.n;
}
function limpaFalhas(email){
  const seg = seguranca();
  if(seg.tentativas[email]){ delete seg.tentativas[email]; }
}

/* ---- sessão por inatividade ---- */
let _idleT = null, _avisoT = null;
function iniciaSessao(){
  ['click','keydown','mousemove','touchstart','scroll'].forEach(ev =>
    document.addEventListener(ev, reiniciaSessao, {passive:true}));
  reiniciaSessao();
}
function reiniciaSessao(){
  if(!app.user) return;
  clearTimeout(_idleT); clearTimeout(_avisoT);
  _avisoT = setTimeout(() => {
    if(app.user) toast(`Sua sessão será encerrada em ${AVISO_MIN} minutos por inatividade. Mexa na tela para continuar.`,'warn');
  }, (SESSAO_MIN - AVISO_MIN)*60000);
  _idleT = setTimeout(() => {
    if(!app.user) return;
    audit('Sessão encerrada por inatividade','Sessão','', `${SESSAO_MIN} minutos sem uso`);
    saveData(); encerrarSessao();
    toast(`Sessão encerrada após ${SESSAO_MIN} minutos sem atividade. Entre novamente.`,'warn');
  }, SESSAO_MIN*60000);
}
function encerrarSessao(){
  clearTimeout(_idleT); clearTimeout(_avisoT);
  app.user = null;
  closeModal();
  document.getElementById('appPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginErr').style.display = 'none';
}

const ACEITA_LBL = {materia:'Matéria-prima', produto:'Produto acabado', ambos:'Qualquer item'};

function formDeposito(id){
  const d = id ? dep(id) : null;
  if(!guard('depositos', d?'editar':'criar')) return;
  openForm(d?`Editar ${d.nome}`:'Novo depósito', [
    {name:'code', label:'Sigla', required:true, half:true, hint:'Ex.: ALM, EXP, QUA.'},
    {name:'nome', label:'Nome do depósito', required:true, half:true},
    {name:'aceita', label:'Aceita', type:'select', required:true, half:true,
      options:Object.entries(ACEITA_LBL).map(([k,v])=>({value:k,label:v}))},
    {name:'principal', label:'Depósito padrão', type:'select', required:true, half:true,
      options:[{value:'nao',label:'Não'},{value:'sim',label:'Sim — recebe as entradas automáticas'}],
      hint:'Entradas de compra e produção caem aqui quando ninguém escolhe o destino.'},
    {name:'descricao', label:'Descrição', type:'textarea'},
  ], d ? {...d, principal: d.principal?'sim':'nao'} : {aceita:'ambos', principal:'nao'}, v => {
    const code = v.code.trim().toUpperCase();
    if(app.data.depositos.some(x=>x.code===code && x.id!==id)) return `A sigla ${code} já está em uso.`;
    const principal = v.principal==='sim';
    if(d){
      if(!principal && d.principal && !app.data.depositos.some(x=>x.id!==id && x.principal && x.aceita===d.aceita))
        return 'Este é o único depósito padrão para esse tipo de item. Defina outro antes de tirar a marcação.';
      Object.assign(d, v, {code, principal});
    } else {
      app.data.depositos.push({id:uid(), ...v, code, principal, ativo:true});
    }
    if(principal) app.data.depositos.forEach(x => {
      if(x.id !== (d?d.id:app.data.depositos[app.data.depositos.length-1].id) && x.aceita===v.aceita) x.principal = false;
    });
    audit(d?'Editou depósito':'Criou depósito','Depósitos',code,v.nome);
    saveData(); renderGrid('depositos');
    toast(d?'Depósito atualizado.':'Depósito criado.');
  });
}

/* ---------------------------- LOTES E RASTREABILIDADE ---------------------------- */
const loteVencido  = l => l.validade && l.validade < today();
const loteVencendo = l => l.validade && !loteVencido(l) &&
  diasEntre(today(), l.validade) <= 60;

/* genealogia: dado um lote de matéria-prima, para onde ele foi */
function rastreioAdiante(loteId){
  const consumos = app.data.moves.filter(m => m.loteId === loteId && m.type === 'saida'
    && m.refType === 'producao');
  const ops = consumos.map(m => app.data.production.find(o => o.code === m.refCode)).filter(Boolean);
  const saidas = [];
  ops.forEach(op => {
    /* o que essa OP produziu e para quem foi */
    const entradas = app.data.moves.filter(m => m.refCode === op.code && m.type === 'entrada');
    entradas.forEach(e => {
      const vendas = app.data.sales.filter(v => v.stockApplied &&
        v.lines.some(l => l.itemId === e.itemId));
      vendas.forEach(v => {
        const nf = app.data.invoices.find(n => n.saleId === v.id && n.status !== 'cancelada');
        saidas.push({op, produto:e.itemId, venda:v, nf});
      });
    });
  });
  return {consumos, ops, saidas};
}
/* dado um produto acabado, de quais lotes ele veio */
function rastreioAtras(opCode){
  const op = app.data.production.find(o => o.code === opCode);
  if(!op) return [];
  return app.data.moves.filter(m => m.refCode === opCode && m.type === 'saida' && m.loteId)
    .map(m => ({...m, l: lote(m.loteId), it: item(m.itemId)}));
}

   MRP — necessidade de material com prazo, e capacidade produtiva
   ========================================================================== */
const centroPor = nome => app.data.centros.find(c => c.nome === nome);

/* recebimentos já programados de um item: saldo pendente de pedidos de compra em aberto,
   com a data mais próxima de chegada */
function recebimentosProgramados(itemId){
  const pendentes = app.data.purchases.filter(p => !pedidoCompleto(p) &&
    ['enviado','parcial'].includes(p.status) && p.lines.some(l=>l.itemId===itemId));
  let qtd = 0, dataMaisProxima = '';
  pendentes.forEach(p => {
    const linha = saldoPedido(p).find(l=>l.itemId===itemId);
    if(linha && linha.saldo > 0){
      qtd += linha.saldo;
      if(!dataMaisProxima || p.expectedAt < dataMaisProxima) dataMaisProxima = p.expectedAt;
    }
  });
  return {quantidade:qtd, dataMaisProxima};
}

/* necessidade líquida de uma matéria-prima, considerando tudo que já está em andamento */
function necessidadeMaterial(itemId){
  const it = item(itemId);
  const abertas = app.data.production.filter(o => !o.stockApplied &&
    (o.consumo||[]).some(c=>c.itemId===itemId));
  const necessidadeBruta = abertas.reduce((a,o) => {
    const c = (o.consumo||[]).find(x=>x.itemId===itemId);
    return a + (c ? c.quantity : 0);
  }, 0);
  const dataNecessaria = abertas.length
    ? abertas.reduce((min,o) => o.dueAt < min ? o.dueAt : min, abertas[0].dueAt) : '';

  const depQUA = app.data.depositos.find(d=>d.code==='QUA');
  const disponivel = saldoTotal(itemId) - (depQUA ? saldoDeposito(itemId, depQUA.id) : 0);
  const receb = recebimentosProgramados(itemId);
  const necessidadeLiquida = Math.max(0,
    necessidadeBruta + (it?it.minQuantity:0) - disponivel - receb.quantidade);

  const forn = it && it.supplierId ? byId(app.data.suppliers, it.supplierId) : null;
  const leadTime = forn ? (forn.leadTimeDias||15) : 15;
  let dataSugerida = '', situacao = 'ok';
  if(necessidadeLiquida > 0){
    dataSugerida = dataNecessaria ? addDays(dataNecessaria, -leadTime) : today();
    situacao = dataSugerida <= today() ? 'urgente' : 'planejar';
  }
  return {itemId, necessidadeBruta, disponivel, recebimentos:receb.quantidade,
    necessidadeLiquida, dataNecessaria, dataSugerida, situacao, leadTime,
    fornecedor: forn ? forn.name : ''};
}

function todasNecessidades(){
  return app.data.inventory.filter(i=>i.type==='materia')
    .map(i => necessidadeMaterial(i.id))
    .filter(n => n.necessidadeBruta > 0 || n.necessidadeLiquida > 0)
    .sort((a,b) => {
      const ordem = {urgente:0, planejar:1, ok:2};
      return ordem[a.situacao]-ordem[b.situacao] || (a.dataSugerida||'9999').localeCompare(b.dataSugerida||'9999');
    });
}

function gerarRequisicaoMRP(){
  if(!guard('mrp','criar')) return;
  const need = todasNecessidades().filter(n=>n.necessidadeLiquida>0);
  if(!need.length){ toast('Nada precisa ser comprado no momento.','warn'); return; }
  const sol = app.data.employees.find(e=>e.status==='ativo' &&
    (byId(app.data.departments,e.deptId)||{}).code==='SUP') || app.data.employees.find(e=>e.status==='ativo');
  const lines = need.map(n => { const it=item(n.itemId);
    return {itemId:n.itemId, quantity:Math.ceil(n.necessidadeLiquida), unitPrice: it?it.unitPrice:0}; });
  app.data.requisitions.push({id:uid(), code:seq(app.data.requisitions,'RC',5),
    requesterId: sol?sol.id:'', deptId: sol?sol.deptId:'', lines,
    justificativa:`Gerada pelo planejamento de material (MRP): ${need.length} item(ns) com necessidade líquida positiva.`,
    urgencia: need.some(n=>n.situacao==='urgente')?'urgente':'alta',
    status:'rascunho', createdAt:today(), neededAt: need[0].dataNecessaria || addDays(today(),15),
    aprovacoes:[], purchaseId:''});
  audit('Gerou requisição pelo MRP','Requisições','', `${need.length} item(ns)`);
  saveData(); switchTab('requisitions');
  toast(`Requisição criada em rascunho com ${need.length} item(ns). Revise e envie para aprovação.`);
}

/* carga vs capacidade de cada centro de trabalho, dentro de um horizonte em dias */
function cargaCentros(horizonteDias){
  const ate = addDays(today(), horizonteDias);
  const abertas = app.data.production.filter(o => !o.stockApplied && o.dueAt <= ate);
  const cargaPorCentro = {};
  abertas.forEach(o => (o.operacoes||[]).forEach(op => {
    const horas = (op.tempo||0)/60 * o.quantity;
    cargaPorCentro[op.centro] = (cargaPorCentro[op.centro]||0) + horas;
  }));
  return app.data.centros.map(c => {
    const carga = +(cargaPorCentro[c.nome]||0).toFixed(1);
    const capacidade = +(c.capacidadeDiariaHoras * horizonteDias).toFixed(1);
    const pct = capacidade ? Math.round(carga/capacidade*100) : 0;
    return {centro:c, carga, capacidade, pct, sobrecarga: pct > 100};
  });
}

      </tr>`;}).join('') : `<tr><td colspan="8"><div class="empty-state"><strong>Nenhuma necessidade no momento</strong>

      </tbody></table></div>

  }
  const need = todasNecessidades();
  const urgentes = need.filter(n=>n.situacao==='urgente').length;
  const sobrecarga = cargaCentros(mrpHorizonte).filter(c=>c.sobrecarga).length;
  return head('Planejamento de Material (MRP)','Cruza estoque, produção aberta, compras em trânsito e capacidade dos centros de trabalho') + `

    </div>

};

const ST_DEV = {'venda':'badge-info','compra':'badge-warning'};

const devolvidoDoDocumento = (tipo, refId, itemId) =>
  app.data.devolucoes.filter(d => d.tipo===tipo && d.refId===refId)
    .flatMap(d => d.lines).filter(l => l.itemId===itemId)
    .reduce((a,l) => a+l.quantity, 0);

function saldoDevolucaoVenda(pv){
  return pv.lines.map(l => { const dev = devolvidoDoDocumento('venda', pv.id, l.itemId);
    return {...l, jaDevolvido:dev, saldo: l.quantity - dev}; });
}
function saldoDevolucaoCompra(pc){
  return pc.lines.map(l => { const dev = devolvidoDoDocumento('compra', pc.id, l.itemId);
    return {...l, jaDevolvido:dev, saldo: l.quantity - dev}; });
}

/* reduz título(s) em aberto ligados ao documento; o que sobrar (por já estar tudo pago)
   vira reembolso direto em caixa — simplificação assumida e documentada na tela. */
function ajustaTituloDevolucao(refType, refId, tipoTitulo, valor){
  const titulos = app.data.financial.filter(t => t.refType===refType && t.refId===refId && t.type===tipoTitulo);
  let restante = valor, reduziuAberto = 0;
  for(const t of titulos){
    if(restante <= 0.01) break;
    if(t.paidAt) continue;
    const abate = Math.min(restante, t.amount);
    t.amount = +(t.amount - abate).toFixed(2);
    restante = +(restante - abate).toFixed(2);
    reduziuAberto = +(reduziuAberto + abate).toFixed(2);
    if(t.amount <= 0.01){ t.amount = 0; t.paidAt = today(); t.description += ' (quitado por devolução)'; }
  }
  return {reduziuAberto, reembolsoCaixa: Math.max(0, +restante.toFixed(2))};
}

function lancarDevolucaoVenda(dev, valorTotal, custoCMV, ajuste){
  const partidas = [{contaId:contaCod('4.3').id, tipo:'debito', valor:valorTotal}];
  if(ajuste.reduziuAberto > 0) partidas.push({contaId:contaCod('1.1.2').id, tipo:'credito', valor:ajuste.reduziuAberto});
  if(ajuste.reembolsoCaixa > 0) partidas.push({contaId:contaCod('1.1.1').id, tipo:'credito', valor:ajuste.reembolsoCaixa});
  lancar(dev.data, `Devolução de venda — ${dev.refCode}`, partidas, {tipo:'devolucao', ref:dev.code});
  if(custoCMV > 0){
    lancar(dev.data, `Estorno de custo — devolução ${dev.code}`,
      [{contaId:contaCod('1.1.4').id, tipo:'debito', valor:custoCMV},
       {contaId:contaCod('5.1').id, tipo:'credito', valor:custoCMV}],
      {tipo:'devolucao', ref:dev.code});
  }
}
function lancarDevolucaoCompra(dev, valorTotal, ajuste){
  const partidas = [];
  if(ajuste.reduziuAberto > 0) partidas.push({contaId:contaCod('2.1.1').id, tipo:'debito', valor:ajuste.reduziuAberto});
  if(ajuste.reembolsoCaixa > 0) partidas.push({contaId:contaCod('1.1.1').id, tipo:'debito', valor:ajuste.reembolsoCaixa});
  partidas.push({contaId:contaCod('1.1.3').id, tipo:'credito', valor:valorTotal});
  lancar(dev.data, `Devolução de compra — ${dev.refCode}`, partidas, {tipo:'devolucao', ref:dev.code});
}

let __dev = null;
function formDevolucaoVenda(saleId){

  openModal(`Devolução — ${pv.code}`, `

        <select id="dev_condicao">
          <option value="boa">Boa — volta ao estoque disponível</option>

function renderDevLines(){
  document.getElementById('devLinesBox').innerHTML = `
    <table class="lines"><thead><tr>
      <th style="width:44%">Item</th><th class="num">Vendido</th><th class="num">Já devolvido</th>
      <th class="num">Saldo</th><th class="num" style="width:16%">Devolver agora</th>
    </tr></thead><tbody>
    ${__dev.lines.map((l,i)=>`<tr>
      <td>${esc(itemLbl(l.itemId))}</td>
      <td class="num">${num(l.saldo+l.devolver)}</td>
      <td class="num">${num((byId(app.data.sales,__dev.refId)||{lines:[]}).lines.find(x=>x.itemId===l.itemId)?.quantity - l.saldo || 0)}</td>

      <td><input type="number" min="0" max="${l.saldo}" value="${l.devolver||''}" placeholder="0"
           oninput="updDevLine(${i}, this.value)"></td>
    </tr>`).join('')}</tbody></table>
    <div class="lines-total"><span>Valor a devolver</span><strong id="devTotal">${money(__dev.lines.reduce((a,l)=>a+l.devolver*l.unitPrice,0))}</strong></div>`;
}
function updDevLine(i, v){
  const l = __dev.lines[i];
  let q = Math.round(Number(v)||0);
  if(q > l.saldo){ q = l.saldo; toast(`Não é possível devolver mais que ${num(l.saldo)}.`,'warn'); }
  if(q < 0) q = 0;
  l.devolver = q;
  document.getElementById('devTotal').textContent = money(__dev.lines.reduce((a,x)=>a+x.devolver*x.unitPrice,0));
}
function confirmarDevolucaoVenda(){
  const pv = byId(app.data.sales, __dev.refId);
  const motivo = document.getElementById('dev_motivo').value.trim();
  const condicao = document.getElementById('dev_condicao').value;
  const data = document.getElementById('dev_data').value;
  if(motivo.length < 10){ toast('Descreva o motivo com pelo menos 10 caracteres.','err'); return; }
  if(!data || data > today()){ toast('Informe uma data válida, não posterior a hoje.','err'); return; }
  const linhas = __dev.lines.filter(l=>l.devolver > 0);
  if(!linhas.length){ toast('Informe a quantidade de pelo menos um item.','err'); return; }

  const depDestino = condicao==='avariada' ? app.data.depositos.find(d=>d.code==='QUA') : depPadrao('produto');
  const valorTotal = linhas.reduce((a,l)=>a+l.devolver*l.unitPrice, 0);
  const custoCMV = linhas.reduce((a,l)=>a + custoUnitarioProduto(l.itemId)*l.devolver, 0);

  for(const l of linhas){
    const err = moveStock(l.itemId, 'entrada', l.devolver, 'devolucao', pv.code,
      `Devolução (${condicao}) — motivo: ${motivo}`, depDestino ? depDestino.id : '');
    if(err){ toast(err,'err'); return; }
  }
  const ajuste = ajustaTituloDevolucao('venda', pv.id, 'receber', valorTotal);
  const dev = {id:uid(), code:seq(app.data.devolucoes,'DEV',5), tipo:'venda', refId:pv.id, refCode:pv.code,
    parceiroId:pv.customerId, lines:linhas.map(l=>({itemId:l.itemId, quantity:l.devolver, unitPrice:l.unitPrice})),
    motivo, condicao, data, registradoPor:app.user.name};
  app.data.devolucoes.push(dev);
  lancarDevolucaoVenda(dev, valorTotal, custoCMV, ajuste);
  audit('Registrou devolução de venda','Devoluções', dev.code, `${pv.code} · ${money(valorTotal)}`);
  saveData(); closeModal(); switchTab('sales');
  toast(`${dev.code} registrada. ${money(valorTotal)} devolvidos${ajuste.reembolsoCaixa>0?' (reembolso em caixa)':' (abatido do título em aberto)'}.`);
}

  document.getElementById('devTotal').textContent = money(__dev.lines.reduce((a,x)=>a+x.devolver*x.unitPrice,0));

/* ---------------------------- FICHA TÉCNICA (BOM) ---------------------------- */
const bomDe = prodId => app.data.boms.find(b => b.productId===prodId && b.ativa);
const bomPorId = id => byId(app.data.boms, id);

/* custo de material: soma componente × quantidade × (1 + perda) */
function custoMaterial(bom){
  return (bom.lines||[]).reduce((a,l)=>{
    const it = item(l.itemId);
    return a + (it ? it.unitPrice * l.quantity * (1 + (l.perda||0)/100) : 0);
  }, 0);
}
/* custo de transformação: soma tempo × custo/hora de cada operação */
function custoOperacao(bom){
  return (bom.operacoes||[]).reduce((a,o)=> a + (o.tempo||0)/60 * (o.custoHora||0), 0);
}
const custoTotal = bom => custoMaterial(bom) + custoOperacao(bom);
const tempoTotal = bom => (bom.operacoes||[]).reduce((a,o)=>a+(o.tempo||0), 0);

/* quanto de cada componente uma OP precisa */
function necessidade(bom, qtd){
  return (bom.lines||[]).map(l => ({itemId:l.itemId,
    quantity: Math.ceil(qtd * l.quantity * (1 + (l.perda||0)/100))}));
}
/* verifica saldo e devolve o que falta */
function faltaEstoque(consumo){
  const dmp = depPadrao('materia');
  return consumo.map(c => {
    const disp = dmp ? saldoDeposito(c.itemId, dmp.id) : saldoTotal(c.itemId);
    return {...c, disponivel: disp, falta: Math.max(0, c.quantity - disp)};
  }).filter(c => c.falta > 0);
}

function salvarBOM(){
  const prodId = document.getElementById('bm_prod').value || (__bom.id ? bomPorId(__bom.id).productId : '');
  if(!prodId){ toast('Selecione o produto acabado.','err'); return; }
  if(!__bom.lines.length){ toast('Inclua pelo menos um componente.','err'); return; }
  const vistos = new Set();
  for(let i=0;i<__bom.lines.length;i++){
    const l = __bom.lines[i], n = i+1;
    if(!l.itemId){ toast(`Componente ${n}: escolha o item.`,'err'); return; }
    if(l.itemId === prodId){ toast(`Componente ${n}: um produto não pode ser componente de si mesmo.`,'err'); return; }
    if(!(l.quantity > 0)){ toast(`Componente ${n}: a quantidade precisa ser maior que zero.`,'err'); return; }
    if(vistos.has(l.itemId)){ toast(`Componente ${n}: item repetido. Some as quantidades numa linha só.`,'err'); return; }
    vistos.add(l.itemId);
  }
  const seqs = __bom.operacoes.map(o=>o.seq);
  if(new Set(seqs).size !== seqs.length){ toast('Há operações com a mesma sequência. Use números distintos.','err'); return; }

  const lines = __bom.lines.map(l=>({itemId:l.itemId, quantity:+Number(l.quantity).toFixed(3), perda:+Number(l.perda||0).toFixed(1)}));
  const operacoes = [...__bom.operacoes].sort((a,b2)=>a.seq-b2.seq)
    .map(o=>({seq:Number(o.seq), centro:o.centro, tempo:+Number(o.tempo).toFixed(2), custoHora:Number(o.custoHora)}));
  if(b){ Object.assign(b, {lines, operacoes, updatedAt:today()}); }

  saveData(); closeModal(); switchTab('boms');
  toast(b?'Ficha técnica atualizada.':'Ficha técnica criada.');
}

function opRecalcula(){

  __op.consumo = necessidade(bom, qtd);

    </div>` : ''}`;

function salvarOP(){
  const prodId = document.getElementById('op_prod').value;
  const qtd = Math.round(Number(document.getElementById('op_qtd').value)||0);
  const prog = Number(document.getElementById('op_prog').value)||0;
  if(!prodId){ toast('Selecione o produto.','err'); return; }
  if(!(qtd>0)){ toast('A quantidade precisa ser maior que zero.','err'); return; }
  if(prog<0||prog>100){ toast('O progresso precisa estar entre 0 e 100.','err'); return; }
  const dados = {productId:prodId, quantity:qtd, machine:document.getElementById('op_maq').value,
    dueAt:document.getElementById('op_prazo').value, status:document.getElementById('op_st').value,
    progress:prog, bomId:__op.bomId, consumo:__op.consumo, operacoes:__op.operacoes};
  const op = __op.id ? byId(app.data.production, __op.id) : null;
  if(op) Object.assign(op, dados);
  else app.data.production.push({id:uid(), code:seq(app.data.production,'OP',5), ...dados,
    createdAt:today(), stockApplied:false});
  audit(op?'Editou ordem':'Criou ordem','Produção', op?op.code:'',
    `${num(qtd)} un. de ${item(prodId).sku} · ${__op.consumo.length} componente(s)`);

    </tr></thead><tbody>${(op.consumo||[]).map(c=>{ const it=item(c.itemId);

    </tr></thead><tbody>${op.operacoes.map(o=>`<tr><td class="num">${o.seq}</td><td>${esc(o.centro)}</td>

    ${faltas.length?`<div class="info-box" style="margin-top:12px;border-left-color:var(--danger)">

    `<button class="btn" onclick="closeModal()">Fechar</button>`);
}

/* ---------------------------- CRONOGRAMA (GANTT) ---------------------------- */
const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const dia = d => new Date(d + 'T00:00:00');
const diasEntre = (a,b) => Math.round((dia(b) - dia(a)) / 864e5);

function renderGantt(){
  const ordens = filtraSub('production', app.data.production)
    .filter(o => o.createdAt && o.dueAt)
    .sort((a,b) => a.dueAt < b.dueAt ? -1 : a.dueAt > b.dueAt ? 1 : 0);

  if(!ordens.length){
    return `<div class="gantt"><div class="empty-state">
      <strong>Nenhuma ordem neste filtro</strong>Escolha outra aba para ver o cronograma.
    </div></div>`;
  }

  /* janela do gráfico: começa no primeiro início, termina no último prazo */
  let ini = ordens.reduce((m,o) => o.createdAt < m ? o.createdAt : m, ordens[0].createdAt);
  let fim = ordens.reduce((m,o) => o.dueAt > m ? o.dueAt : m, ordens[0].dueAt);
  /* garante que hoje apareça e que a janela tenha folga nas pontas */
  if(today() < ini) ini = today();
  if(today() > fim) fim = today();
  ini = addDays(ini, -6);
  fim = addDays(fim, 6);
  const total = Math.max(1, diasEntre(ini, fim));
  const pct = d => (diasEntre(ini, d) / total) * 100;

  /* divisórias de mês */
  const meses = [];
  let cur = new Date(dia(ini).getFullYear(), dia(ini).getMonth(), 1);
  const ultimo = dia(fim);
  while(cur <= ultimo){
    const inicioMes = cur.toISOString().slice(0,10);
    const prox = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    const fimMes = prox.toISOString().slice(0,10);
    const de = Math.max(0, pct(inicioMes));
    const ate = Math.min(100, pct(fimMes));
    if(ate > 0 && de < 100)
      meses.push({label: MES_CURTO[cur.getMonth()] + '/' + String(cur.getFullYear()).slice(2),
                  left: de, width: ate - de});
    cur = prox;
  }
  /* divisórias de semana */
  const semanas = [];
  let d0 = dia(ini);
  d0.setDate(d0.getDate() + ((8 - d0.getDay()) % 7));   // próxima segunda
  while(d0 <= ultimo){
    const iso = d0.toISOString().slice(0,10);
    semanas.push({left: pct(iso), label: String(d0.getDate()).padStart(2,'0')});
    d0.setDate(d0.getDate() + 7);
  }

  const classe = o => {
    if(o.stockApplied || o.status === 'concluida') return 'conc';
    if(o.dueAt < today()) return 'atra';
    if(o.status === 'pausada') return 'paus';
    if(o.status === 'em producao') return 'prod';
    return 'plan';
  };

  const linhas = ordens.map(o => {
    const esq = Math.max(0, pct(o.createdAt));
    const dir = Math.min(100, pct(o.dueAt));
    const larg = Math.max(1.2, dir - esq);
    const it = item(o.productId);
    const atrasoTxt = (!o.stockApplied && o.dueAt < today())
      ? ` · ${diasEntre(o.dueAt, today())} dia(s) de atraso` : '';
    const tip = `${o.code} — ${it ? it.sku : '?'} · ${num(o.quantity)} un. · ${o.machine}\n` +
      `${fmtDate(o.createdAt)} a ${fmtDate(o.dueAt)} · ${o.progress}% concluído${atrasoTxt}`;
    return `<div class="gantt-row">
      <div class="gantt-lbl" onclick="verOP('${o.id}')" title="Abrir ${esc(o.code)}">
        <strong>${esc(o.code)}</strong>
        <span>${esc(it ? it.sku : '—')} · ${num(o.quantity)} un. · ${esc(o.machine)}</span>
      </div>
      <div class="gantt-track">
        <div class="gantt-bar ${classe(o)}" style="left:${esq}%;width:${larg}%"
             onclick="verOP('${o.id}')" title="${esc(tip)}">
          <i style="width:${Math.max(0, Math.min(100, o.progress))}%"></i>
          <span>${o.progress}%</span>
        </div>
      </div>
    </div>`;
  }).join('');

  const hojePct = pct(today());
  return `<div class="gantt"><div class="gantt-scroll"><div class="gantt-inner">
    <div class="gantt-head">
      <div class="gantt-lbl">Ordem</div>
      <div class="gantt-tl">
        ${meses.map(m=>`<div class="gantt-mes" style="left:${m.left}%;width:${m.width}%">${m.label}</div>`).join('')}
        ${semanas.map(w=>`<div class="gantt-sem" style="left:${w.left}%">${w.label}</div>`).join('')}
        ${hojePct>=0&&hojePct<=100?`<div class="gantt-hoje" style="left:${hojePct}%"></div>`:''}
      </div>
    </div>
    ${linhas}
  </div></div>
  <div class="gantt-legenda">
    <span><i style="background:#8A8A8A"></i>Planejada</span>
    <span><i style="background:#0052CC"></i>Em produção</span>
    <span><i style="background:#B35C00"></i>Pausada</span>
    <span><i style="background:#087F23"></i>Concluída</span>
    <span><i style="background:#C10000"></i>Prazo vencido</span>
    <span style="color:var(--text-light)">A área clara dentro da barra indica o percentual já produzido.</span>
  </div></div>`;
}

/* ---------------------------- QUALIDADE ---------------------------- */
function formInsp(id){
  const ins = id ? byId(app.data.inspections,id) : null;
  const ops = app.data.production.map(o=>({value:o.id,label:`${o.code} · ${itemLbl(o.productId)} · ${num(o.quantity)} un.`}));
  openForm(ins?`Editar ${ins.code}`:'Nova inspeção', [
    {name:'opId',label:'Ordem de produção',type:'select',required:true,options:ops,onchange:'preencherPelaOP()'},
    {name:'inspectedQty',label:'Quantidade inspecionada',type:'number',required:true,min:1,half:true},
    {name:'acceptedQty',label:'Quantidade conforme',type:'number',required:true,min:0,half:true},
    {name:'inspector',label:'Inspetor',required:true,half:true},
    {name:'createdAt',label:'Data',type:'date',required:true,half:true},
    {name:'notes',label:'Observações',type:'textarea'},
  ], ins || {createdAt:today(), inspector: app.user?app.user.name:''}, v => {
    if(v.acceptedQty > v.inspectedQty) return 'A quantidade conforme não pode ser maior que a inspecionada.';
    const rate = +((v.acceptedQty/v.inspectedQty)*100).toFixed(2);
    if(ins) Object.assign(ins, v, {rate});
    else app.data.inspections.push({id:uid(), code:seq(app.data.inspections,'INS',5), ...v, rate});
    audit(ins?'Editou inspeção':'Criou inspeção','Qualidade', ins?ins.code:'', `${rate.toFixed(2)}% de conformidade`);
    saveData(); renderGrid('quality');
    toast(`Inspeção salva. Conformidade de ${rate.toFixed(2)}%.`);
  });
}
function preencherPelaOP(){
  const op = byId(app.data.production, document.getElementById('fld_opId').value);
  if(!op) return;
  const q = document.getElementById('fld_inspectedQty');
  if(q && !q.value) q.value = op.quantity;
}

function formParceiro(kind, id){
  const col = kind==='sup' ? 'suppliers' : 'customers';
  const p = id ? byId(app.data[col], id) : null;
  const nome = kind==='sup' ? 'fornecedor' : 'cliente';
  const campos = [
    {name:'name',label:'Razão social',required:true},
    {name:'cnpj',label:'CNPJ',required:true,half:true},
    {name:'city',label:'Cidade',required:true,half:true},
    {name:'phone',label:'Telefone',half:true},
    {name:'email',label:'E-mail',type:'email',half:true},
  ];
  if(kind==='sup') campos.push(
    {name:'leadTimeDias', label:'Prazo médio de entrega (dias)', type:'number', min:1, half:true,
      hint:'Usado pelo MRP para calcular quando pedir.'});
  if(kind==='cli') campos.push(
    {name:'uf',label:'UF',type:'select',required:true,half:true,options:UFS.map(u=>({value:u,label:u})),
      hint:'Define a alíquota de ICMS na venda.'},
    {name:'ie',label:'Inscrição estadual',half:true},
    {name:'contribuinte',label:'Contribuinte de ICMS',type:'select',required:true,half:true,
      options:[{value:'sim',label:'Sim'},{value:'nao',label:'Não'}]},
    {name:'consumidorFinal',label:'Consumidor final',type:'select',required:true,half:true,
      options:[{value:'nao',label:'Não — revende'},{value:'sim',label:'Sim — uso próprio'}],
      hint:'Consumidor final não contribuinte em outro estado gera DIFAL.'});
  openForm(p?`Editar ${p.name}`:`Novo ${nome}`, campos,
    p ? {...p, contribuinte: p.contribuinte===false?'nao':'sim',
         consumidorFinal: p.consumidorFinal?'sim':'nao'}
      : {uf:emp().uf, contribuinte:'sim', consumidorFinal:'nao', leadTimeDias:15}, v => {
    if(kind==='sup') v.leadTimeDias = Number(v.leadTimeDias)||15;
    if(kind==='cli'){ v.contribuinte = v.contribuinte==='sim'; v.consumidorFinal = v.consumidorFinal==='sim'; }
    if(p) Object.assign(p, v);
    else app.data[col].push({id:uid(), code:seq(app.data[col], kind==='sup'?'FOR':'CLI',4), ...v, active:true});
    audit(p?'Editou cadastro':'Criou cadastro', kind==='sup'?'Fornecedores':'Clientes', p?p.code:'', v.name);
    saveData(); renderGrid(kind==='sup'?'suppliers':'customers');
    toast(p?'Cadastro atualizado.':`Novo ${nome} cadastrado.`);
  });
}

        <select id="ped_st">${c.sts.map(x=>`<option value="${x}"${doc&&doc.status===x?' selected':''}>${x}</option>`).join('')}</select>
        <div class="form-hint">${c.hint}</div>
      </div>
    </div>
    <div class="lines-head">
      <h4>Itens do pedido</h4>
      <button class="btn btn-xs btn-primary" onclick="addLine()">Adicionar item</button>
    </div>
    <div id="linesBox"></div>`;
  openModal(doc?`Editar ${doc.code}`:`Novo pedido de ${c.nome}`, body,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="salvarPedido()">Salvar pedido</button>`);
  renderLines();
}
function renderLines(){
  const c = PED[__ped.kind], box = document.getElementById('linesBox');
  const opts = c.itens();
  if(!__ped.lines.length){
    box.innerHTML = `<div class="lines-empty">Nenhum item. Use "Adicionar item" para incluir a primeira linha.</div>`;
    return;
  }
  box.innerHTML = `
    <table class="lines"><thead><tr>
      <th style="width:52%">Item</th><th class="num" style="width:14%">Qtd</th>
      <th class="num" style="width:18%">Preço un.</th><th class="num">Total</th><th></th>
    </tr></thead><tbody>
    ${__ped.lines.map((l,i)=>`<tr>
      <td><select onchange="updLine(${i},'itemId',this.value)">
        <option value="">— selecione —</option>
        ${opts.map(o=>`<option value="${o.id}"${o.id===l.itemId?' selected':''}>${esc(o.sku+' · '+o.description)}${__ped.kind==='venda'?` (${num(o.quantity)} disp.)`:''}</option>`).join('')}
      </select></td>
      <td><input type="number" min="1" value="${l.quantity}" oninput="updLine(${i},'quantity',this.value)"></td>
      <td><input type="number" min="0" step="0.01" value="${l.unitPrice}" oninput="updLine(${i},'unitPrice',this.value)"></td>
      <td class="num" id="lt${i}">${money(l.quantity*l.unitPrice)}</td>
      <td><button class="rm" onclick="rmLine(${i})" title="Remover linha" aria-label="Remover linha">✕</button></td>
    </tr>`).join('')}
    </tbody></table>
    <div class="lines-total"><span>Total do pedido</span><strong id="pedTotal">${money(pedTotal())}</strong></div>`;
}
const pedTotal = () => __ped.lines.reduce((s,l)=>s + (Number(l.quantity)||0)*(Number(l.unitPrice)||0), 0);
function addLine(){ __ped.lines.push({itemId:'',quantity:1,unitPrice:0}); renderLines(); }
function rmLine(i){ __ped.lines.splice(i,1); renderLines(); }
function updLine(i, field, v){
  const l = __ped.lines[i];
  if(field==='itemId'){
    l.itemId = v;
    const it = item(v);
    if(it && !Number(l.unitPrice)){
      l.unitPrice = __ped.kind==='venda' ? +(it.unitPrice*1.35).toFixed(2) : it.unitPrice;
      renderLines(); return;
    }
  } else l[field] = Number(v)||0;
  const cel = document.getElementById('lt'+i);
  if(cel) cel.textContent = money((Number(l.quantity)||0)*(Number(l.unitPrice)||0));
  const tot = document.getElementById('pedTotal');
  if(tot) tot.textContent = money(pedTotal());
}
function salvarPedido(){
  const c = PED[__ped.kind];
  const parc = document.getElementById('ped_parc').value;
  if(!parc){ toast(`Selecione o ${c.pLabel.toLowerCase()}.`,'err'); return; }
  if(!__ped.lines.length){ toast('Inclua pelo menos um item no pedido.','err'); return; }
  const vistos = new Set();
  for(let i=0;i<__ped.lines.length;i++){
    const l = __ped.lines[i], n = i+1;
    if(!l.itemId){ toast(`Linha ${n}: escolha o item.`,'err'); return; }
    if(!(Number(l.quantity) > 0)){ toast(`Linha ${n}: a quantidade precisa ser maior que zero.`,'err'); return; }
    if(Number(l.unitPrice) < 0){ toast(`Linha ${n}: o preço não pode ser negativo.`,'err'); return; }
    if(vistos.has(l.itemId)){
      toast(`Linha ${n}: ${itemLbl(l.itemId)} já está em outra linha. Some as quantidades numa linha só.`,'err');
      return;
    }
    vistos.add(l.itemId);
  }
  const lines = __ped.lines.map(l=>({itemId:l.itemId, quantity:Math.round(Number(l.quantity)),
                                     unitPrice:+Number(l.unitPrice).toFixed(2)}));
  const status = document.getElementById('ped_st').value;
  const doc = __ped.id ? byId(app.data[c.col], __ped.id) : null;
  if(doc){
    doc[c.parceiro] = parc; doc.lines = lines; doc.status = status;
    if(__ped.kind==='compra') doc.expectedAt = document.getElementById('ped_exp').value;
  } else {
    const novo = {id:uid(), code:seq(app.data[c.col], c.pre, 5), [c.parceiro]:parc,
                  lines, status, createdAt:today(), stockApplied:false};
    if(__ped.kind==='compra') novo.expectedAt = document.getElementById('ped_exp').value;
    app.data[c.col].push(novo);
  }
  audit(doc?'Editou pedido':'Criou pedido', __ped.kind==='compra'?'Compras':'Vendas',
        doc?doc.code:'', `${lines.length} item(ns) · ${money(pedTotal())}`);
  saveData(); closeModal(); switchTab(__ped.kind==='compra'?'purchases':'sales');
  toast(`${doc?'Pedido atualizado':'Pedido criado'} com ${lines.length} item(ns) · ${money(pedTotal())}.`);
}
function verPedido(kind, id){
  const c = PED[kind], doc = byId(app.data[c.col], id);
  if(!doc) return;
  const parceiro = kind==='compra' ? supLbl(doc.supplierId) : cliLbl(doc.customerId);
  openModal(`${doc.code} — ${parceiro}`, `

        <button class="btn btn-xs" onclick="closeModal();verRC('${doc.requisitionId}')">abrir</button></dd>`:''}

      <td class="num">${money(l.quantity*l.unitPrice)}</td></tr>`).join('')}</tbody></table>

/* ---------------------------- EXPEDIÇÃO ---------------------------- */
/* Não move estoque de novo: o faturamento já baixou o produto acabado, lote por lote.
   A expedição lê esse histórico e conduz a separação física, a conferência e o embarque. */
const ST_EXP = {'separacao':'badge-muted','separado':'badge-warning',
  'embarcado':'badge-info','entregue':'badge-success','cancelado':'badge-danger'};

const movsDaVenda = pv => app.data.moves.filter(m =>
  m.refType === 'venda' && m.refCode === pv.code && m.type === 'saida');
const expedicaoDaVenda = saleId => app.data.expedicoes
  .find(e => e.saleId === saleId && e.status !== 'cancelado');

function iniciarExpedicao(saleId){
  if(!guard('expedicao','criar')) return;
  const pv = byId(app.data.sales, saleId);
  if(!pv || !pv.stockApplied){ toast('Fature o pedido antes de iniciar a expedição.','warn'); return; }
  if(expedicaoDaVenda(saleId)){ toast('Este pedido já tem uma expedição em andamento.','warn'); return; }
  const movs = movsDaVenda(pv);
  if(!movs.length){ toast('Não há registro de baixa de estoque para este pedido.','err'); return; }
  const lines = movs.map(m => ({itemId:m.itemId, loteId:m.loteId||'', quantity:m.quantity, separado:false}));
  const exp = {id:uid(), code:seq(app.data.expedicoes,'EXP',5), saleId, customerId:pv.customerId,
    status:'separacao', lines, criadoEm:today(),
    separadoPor:'', separadoEm:'', transportadora:'', motorista:'', placa:'',
    volumes:0, pesoKg:0, previsaoEntrega:'', embarcadoPor:'', embarcadoEm:'',
    entregueEm:'', entreguePor:'', canhoto:'', motivoCancel:''};
  app.data.expedicoes.push(exp);
  audit('Iniciou expedição','Expedição', exp.code, `${lines.length} linha(s) para separar`);
  saveData(); switchTab('expedicao');
  toast(`${exp.code} criada. Use "Separar" para conferir os itens.`);
}

let __sep = null;
function formSeparacao(id){
  const exp = byId(app.data.expedicoes, id); if(!exp) return;
  if(!guard('expedicao','editar')) return;
  if(exp.status !== 'separacao'){ toast('Esta expedição já passou da etapa de separação.','warn'); return; }
  __sep = id;
  openModal(`Separar — ${exp.code}`, `
    <div class="info-box" style="margin-bottom:12px">
      Confira fisicamente cada linha antes de marcar. A quantidade e o lote vêm do que foi
      baixado do estoque no faturamento.
    </div>
    <div id="sepBox"></div>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="confirmarSeparacao()">Confirmar separação</button>`);
  renderSeparacao();
}
function renderSeparacao(){
  const exp = byId(app.data.expedicoes, __sep);
  document.getElementById('sepBox').innerHTML = `
    <table class="lines"><thead><tr>
      <th style="width:8%"></th><th style="width:44%">Item</th><th>Lote</th><th class="num">Qtd</th>
    </tr></thead><tbody>
    ${exp.lines.map((l,i)=>`<tr>
      <td><input type="checkbox" ${l.separado?'checked':''} style="width:auto;cursor:pointer"
           onchange="exp_toggleLinha(${i},this.checked)"></td>
      <td>${esc(itemLbl(l.itemId))}</td>
      <td>${l.loteId?esc(loteLbl(l.loteId)):'<span style="color:var(--text-light)">sem lote</span>'}</td>
      <td class="num">${num(l.quantity)}</td>
    </tr>`).join('')}
    </tbody></table>`;
}
function exp_toggleLinha(i, v){ byId(app.data.expedicoes, __sep).lines[i].separado = v; }
function confirmarSeparacao(){
  const exp = byId(app.data.expedicoes, __sep);
  if(!exp.lines.every(l=>l.separado)){ toast('Marque todas as linhas como separadas antes de confirmar.','err'); return; }
  exp.status = 'separado'; exp.separadoPor = app.user.name; exp.separadoEm = today();
  audit('Separou expedição','Expedição', exp.code, `${exp.lines.length} linha(s) conferida(s)`);
  saveData(); closeModal(); switchTab('expedicao');
  toast(`${exp.code} separada. Falta registrar o embarque.`);
}

function formEmbarque(id){
  const exp = byId(app.data.expedicoes, id); if(!exp) return;
  if(!guard('expedicao','aprovar')) return;
  if(exp.status !== 'separado'){ toast('A expedição precisa estar separada antes do embarque.','warn'); return; }
  openForm(`Registrar embarque — ${exp.code}`, [
    {name:'transportadora', label:'Transportadora', required:true},
    {name:'motorista', label:'Motorista', half:true},
    {name:'placa', label:'Placa do veículo', half:true},
    {name:'volumes', label:'Volumes', type:'number', required:true, min:1, half:true},
    {name:'pesoKg', label:'Peso total (kg)', type:'number', required:true, min:0.1, step:'0.1', half:true},
    {name:'previsaoEntrega', label:'Previsão de entrega', type:'date', required:true, half:true},
  ], {previsaoEntrega:addDays(today(),5), volumes:exp.lines.length}, v => {
    Object.assign(exp, v, {status:'embarcado', embarcadoPor:app.user.name, embarcadoEm:today()});
    audit('Registrou embarque','Expedição', exp.code,
      `${v.transportadora} · ${v.volumes} volume(s) · ${v.pesoKg} kg`);
    saveData(); switchTab(app.tab==='approvals'?'approvals':'expedicao');
    toast(`${exp.code} embarcada com ${v.transportadora}.`);
  }, 'Confirmar embarque');
}

function formEntrega(id){
  const exp = byId(app.data.expedicoes, id); if(!exp) return;
  if(!guard('expedicao','editar')) return;
  if(exp.status !== 'embarcado'){ toast('Só é possível confirmar entrega de carga já embarcada.','warn'); return; }
  openForm(`Confirmar entrega — ${exp.code}`, [
    {name:'entregueEm', label:'Data da entrega', type:'date', required:true, half:true},
    {name:'canhoto', label:'Referência do canhoto', half:true, hint:'Número do documento assinado pelo recebedor.'},
    {name:'obs', label:'Observações', type:'textarea'},
  ], {entregueEm:today()}, v => {
    if(v.entregueEm < exp.embarcadoEm) return 'A entrega não pode ser anterior ao embarque.';
    if(v.entregueEm > today()) return 'A data de entrega não pode estar no futuro.';
    Object.assign(exp, v, {status:'entregue', entreguePor:app.user.name});
    audit('Confirmou entrega','Expedição', exp.code, v.canhoto||'sem referência de canhoto');
    saveData(); switchTab('expedicao');
    toast(`${exp.code} marcada como entregue.`);
  }, 'Confirmar entrega');
}

function cancelarExpedicao(id){
  const exp = byId(app.data.expedicoes, id); if(!exp || exp.status==='entregue' || exp.status==='cancelado') return;
  if(!guard('expedicao','editar')) return;
  openModal(`Cancelar ${exp.code}`, `
    <div class="form-group">
      <label for="exp_motivo">Motivo *</label>
      <textarea id="exp_motivo" rows="3" placeholder="Descreva o motivo do cancelamento"></textarea>
    </div>`,
    `<button class="btn" onclick="closeModal()">Voltar</button>
     <button class="btn btn-danger" onclick="confirmarCancelExp('${id}')">Cancelar expedição</button>`);

function confirmarCancelExp(id){
  const motivo = document.getElementById('exp_motivo').value.trim();

  const exp = byId(app.data.expedicoes, id);
  exp.status = 'cancelado'; exp.motivoCancel = motivo;
  audit('Cancelou expedição','Expedição', exp.code, motivo);
  saveData(); closeModal(); switchTab('expedicao');
  toast(`${exp.code} cancelada.`);

function formTitulo(id){
  const t = id ? byId(app.data.financial,id) : null;
  openForm(t?`Editar ${t.code}`:'Novo título', [
    {name:'type',label:'Tipo',type:'select',required:true,half:true,
      options:[{value:'receber',label:'A receber'},{value:'pagar',label:'A pagar'}]},
    {name:'amount',label:'Valor (R$)',type:'number',required:true,min:0.01,step:'0.01',half:true},
    {name:'description',label:'Descrição',required:true},
    {name:'dueAt',label:'Vencimento',type:'date',required:true,half:true},
    {name:'paidAt',label:'Data da baixa',type:'date',half:true,hint:'Deixe em branco se ainda estiver em aberto.'},
  ], t || {type:'receber', dueAt:addDays(today(),30)}, v => {
    if(t) Object.assign(t, v);
    else app.data.financial.push({id:uid(), code:seq(app.data.financial,'FIN',5), ...v, refType:'manual', refId:''});
    audit(t?'Editou título':'Lançou título','Financeiro', t?t.code:'', `${v.type} · ${money(v.amount)}`);
    saveData(); renderGrid('financial'); renderFinKpis();
    toast(t?'Título atualizado.':'Título lançado.');
  });
}
function renderFinKpis(){
  const host = document.getElementById('finKpis');
  if(!host) return;
  const f = app.data.financial;
  const rec = f.filter(t=>t.type==='receber' && !t.paidAt).reduce((s,t)=>s+t.amount,0);
  const pag = f.filter(t=>t.type==='pagar'   && !t.paidAt).reduce((s,t)=>s+t.amount,0);
  const venc = f.filter(emAtraso);
  const saldo = rec - pag;
  host.innerHTML = `
    <div class="kpi-card ok"><h3>A receber em aberto</h3><div class="value" style="font-size:21px">${money(rec)}</div><div class="subtitle">${f.filter(t=>t.type==='receber'&&!t.paidAt).length} títulos</div></div>
    <div class="kpi-card bad"><h3>A pagar em aberto</h3><div class="value" style="font-size:21px">${money(pag)}</div><div class="subtitle">${f.filter(t=>t.type==='pagar'&&!t.paidAt).length} títulos</div></div>
    <div class="kpi-card ${saldo>=0?'ok':'bad'}"><h3>Saldo projetado</h3><div class="value" style="font-size:21px">${money(saldo)}</div><div class="subtitle">receber menos pagar</div></div>
    <div class="kpi-card ${venc.length?'bad':''}"><h3>Vencidos</h3><div class="value">${venc.length}</div><div class="subtitle">${money(venc.reduce((s,t)=>s+t.amount,0))} em atraso</div></div>`;
}

const ST_NF = {'rascunho':'badge-muted','emitida':'badge-success','cancelada':'badge-danger'};

function emitirNota(pvId){
  if(!guard('fiscal','criar')) return;
  const pv = byId(app.data.sales, pvId);
  if(!pv) return;
  if(app.data.invoices.some(n=>n.saleId===pvId && n.status!=='cancelada')){
    toast('Este pedido já tem nota emitida.','warn'); return;
  }
  if(!pv.stockApplied){ toast('Fature o pedido antes de emitir a nota.','warn'); return; }
  const t = tributarVenda(pv);
  const e = emp();
  openModal(`Emitir nota — ${pv.code}`, `
    <div class="info-box" style="margin-bottom:14px;border-left-color:var(--warning)">
      <strong>Espelho sem valor fiscal.</strong> O documento gerado aqui reproduz o cálculo e o layout
      de uma NF-e, mas não é transmitido à SEFAZ e não substitui nota fiscal.
      A emissão válida exige certificado digital e transmissão pelo servidor.
    </div>
    <dl class="dl" style="margin-bottom:12px">
      <dt>Destinatário</dt><dd>${esc(t.cliente.name||'—')} · ${esc(t.uf)}${
        t.cliente.contribuinte===false?' <span class="badge badge-muted">não contribuinte</span>':''}</dd>
      <dt>Natureza</dt><dd>${esc(CFOP_DESC[t.linhas[0]?t.linhas[0].cfop:'']||'Venda')}</dd>
      <dt>Regime</dt><dd>${e.regime==='simples'?'Simples Nacional':e.regime==='real'?'Lucro Real':'Lucro Presumido'}</dd>
      <dt>Série / número</dt><dd>${e.serieNFe} / ${e.proxNumero}</dd>
    </dl>
    ${tabelaImpostos(t)}
    <div class="form-group" style="margin-top:14px">
      <label for="nf_obs">Informações complementares</label>
      <textarea id="nf_obs" rows="2" placeholder="Ex.: pedido de compra do cliente, transportadora">${
        e.regime==='simples'?'Documento emitido por ME ou EPP optante pelo Simples Nacional.':''}</textarea>
    </div>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="confirmarNota('${pvId}')">Gerar espelho</button>`);
}
function tabelaImpostos(t){
  const e = emp();
  return `<table class="lines"><thead><tr>
      <th style="width:26%">Item</th><th class="num">NCM</th><th class="num">CFOP</th>
      <th class="num">Qtd</th><th class="num">Valor</th>
      ${e.regime==='simples'?'<th class="num">CSOSN</th>':'<th class="num">ICMS</th>'}
      <th class="num">IPI</th>
    </tr></thead><tbody>
    ${t.linhas.map(l=>`<tr>
      <td>${esc(itemLbl(l.itemId))}</td>

function confirmarNota(pvId){

  const nf = {id:uid(), numero:e.proxNumero, serie:e.serieNFe, saleId:pvId,
    customerId:pv.customerId, uf:t.uf, natureza:CFOP_DESC[t.linhas[0].cfop]||'Venda',
    regime:e.regime, linhas:t.linhas,
    totalProdutos:t.totalProdutos, totalICMS:t.totalICMS, totalIPI:t.totalIPI,
    totalPIS:t.totalPIS, totalCOFINS:t.totalCOFINS, totalDIFAL:t.totalDIFAL, totalNota:t.totalNota,
    obs:document.getElementById('nf_obs').value.trim(),
    status:'emitida', emitidaEm:today(), emitidaPor:app.user.name, canceladaEm:'', motivoCancel:''};
  app.data.invoices.push(nf);

function cancelarNota(id){
  if(!guard('fiscal','editar')) return;
  const nf = byId(app.data.invoices, id); if(!nf || nf.status==='cancelada') return;
  openModal(`Cancelar nota ${nf.numero}`, `
    <div class="info-box" style="margin-bottom:14px">
      Numa emissão real, o cancelamento só é aceito pela SEFAZ dentro do prazo legal
      e exige justificativa com no mínimo 15 caracteres.
    </div>
    <div class="form-group">
      <label for="nf_cancel">Justificativa *</label>
      <textarea id="nf_cancel" rows="3" placeholder="Descreva o motivo do cancelamento"></textarea>
    </div>`,
    `<button class="btn" onclick="closeModal()">Voltar</button>
     <button class="btn btn-danger" onclick="confirmarCancelamento('${id}')">Cancelar nota</button>`);
}
function confirmarCancelamento(id){
  const motivo = document.getElementById('nf_cancel').value.trim();
  if(motivo.length < 15){ toast('A justificativa precisa ter pelo menos 15 caracteres.','err'); return; }
  const nf = byId(app.data.invoices, id);
  nf.status = 'cancelada'; nf.canceladaEm = today(); nf.motivoCancel = motivo;
  audit('Cancelou nota','Documentos fiscais', `NF ${nf.numero}`, motivo);
  saveData(); closeModal(); switchTab('fiscal');
  toast(`Nota ${nf.numero} cancelada.`);
}

   MOTOR FISCAL
   Alíquotas e regras são referências configuráveis, não uma base oficial completa.
   ========================================================================== */
const emp = () => app.data.empresa;

const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR',
             'PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
/* estados do Sul/Sudeste (exceto ES) aplicam 7% ao vender para N/NE/CO/ES */
const SUL_SUDESTE = ['SP','RJ','MG','PR','SC','RS'];
const N_NE_CO_ES  = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','PA','PB',
                     'PE','PI','RN','RO','RR','SE','TO'];

function aliqInterestadual(ufOrigem, ufDestino, origemMercadoria){
  if(ufOrigem === ufDestino) return emp().aliqInternaICMS;
  if(['1','2','3','8'].includes(String(origemMercadoria))) return 4;   // importada
  if(SUL_SUDESTE.includes(ufOrigem) && N_NE_CO_ES.includes(ufDestino)) return 7;
  return 12;
}

/* CFOP por operação e destino */
function cfop(operacao, ufDestino, tipoItem){
  const fora = ufDestino !== emp().uf;
  const p = fora ? '6' : '5';
  const e = fora ? '2' : '1';
  if(operacao === 'venda')
    return p + (tipoItem === 'produto' && emp().segmento !== 'comercio' ? '101' : '102');
  if(operacao === 'compra')
    return e + (emp().segmento === 'comercio' ? '102' : '101');
  if(operacao === 'devolucao_venda') return e + '202';
  if(operacao === 'remessa') return p + '949';
  return p + '102';
}
const CFOP_DESC = {
  '5101':'Venda de produção do estabelecimento',
  '6101':'Venda de produção do estabelecimento, para outro estado',
  '5102':'Venda de mercadoria adquirida de terceiros',
  '6102':'Venda de mercadoria adquirida de terceiros, para outro estado',
  '1101':'Compra para industrialização',
  '2101':'Compra para industrialização, de outro estado',
  '1102':'Compra para comercialização',
  '2102':'Compra para comercialização, de outro estado',
  '1202':'Devolução de venda',
  '2202':'Devolução de venda, de outro estado',
};

/* CSOSN (Simples) x CST (regime normal) */
const CSOSN = {'101':'Tributada com permissão de crédito','102':'Tributada sem permissão de crédito',
  '201':'Tributada com permissão de crédito e com ST','202':'Tributada sem permissão de crédito e com ST',
  '400':'Não tributada','500':'ICMS cobrado anteriormente por ST','900':'Outros'};
const CST_ICMS = {'00':'Tributada integralmente','10':'Tributada e com cobrança de ICMS por ST',
  '20':'Com redução de base de cálculo','40':'Isenta','41':'Não tributada',
  '60':'ICMS cobrado anteriormente por ST','90':'Outras'};
const ORIGEM_MERC = {'0':'Nacional','1':'Estrangeira — importação direta','2':'Estrangeira — mercado interno',
  '3':'Nacional com mais de 40% de conteúdo importado','4':'Nacional por processo produtivo básico',
  '5':'Nacional com menos de 40% de conteúdo importado','8':'Nacional com mais de 70% de conteúdo importado'};

/* ---------- cálculo de uma linha ---------- */
function tributarLinha(itemId, quantidade, valorUnit, ufDestino, contribuinte, consumidorFinal){
  const it = item(itemId);
  const e = emp();
  const base = quantidade * valorUnit;
  const r = {itemId, quantidade, valorUnit, valorProduto:+base.toFixed(2),
    ncm: it ? it.ncm : '', origem: it ? it.origem : '0', unidade: it ? it.unidade : 'UN',
    cfop: cfop('venda', ufDestino, it ? it.type : 'produto'),
    icmsBase:0, icmsAliq:0, icmsValor:0, ipiBase:0, ipiAliq:0, ipiValor:0,
    pisValor:0, cofinsValor:0, difalValor:0, cst:'', csosn:''};

  /* IPI — só para indústria equiparada, sobre produto de fabricação própria */
  if(e.contribuinteIPI && it && it.type === 'produto' && it.aliqIPI > 0){
    r.ipiBase = +base.toFixed(2);
    r.ipiAliq = it.aliqIPI;
    r.ipiValor = +(base * it.aliqIPI / 100).toFixed(2);
  }

  if(e.regime === 'simples'){
    /* No Simples o ICMS é recolhido no DAS; a nota não destaca o imposto. */
    r.csosn = '102';
    r.icmsAliq = 0; r.icmsValor = 0;
    return r;
  }

  /* Regime normal: destaca ICMS */
  const aliq = aliqInterestadual(e.uf, ufDestino, r.origem);
  r.cst = '00';
  r.icmsBase = +base.toFixed(2);
  r.icmsAliq = aliq;
  r.icmsValor = +(base * aliq / 100).toFixed(2);

  /* DIFAL: venda interestadual para consumidor final não contribuinte */
  if(ufDestino !== e.uf && consumidorFinal && !contribuinte){
    const interna = e.aliqInternaICMS;
    r.difalValor = +(base * (interna - aliq) / 100).toFixed(2);
  }

  /* PIS e COFINS — cumulativo no presumido, não cumulativo no real */
  const pis    = e.regime === 'real' ? 1.65 : e.aliqPIS;
  const cofins = e.regime === 'real' ? 7.60 : e.aliqCOFINS;
  r.pisValor    = +(base * pis / 100).toFixed(2);
  r.cofinsValor = +(base * cofins / 100).toFixed(2);
  return r;
}

/* ---------- totaliza um pedido de venda ---------- */
function tributarVenda(pv){
  const cli = byId(app.data.customers, pv.customerId) || {};
  const uf = cli.uf || emp().uf;
  const linhas = pv.lines.map(l =>
    tributarLinha(l.itemId, l.quantity, l.unitPrice, uf, cli.contribuinte !== false, !!cli.consumidorFinal));
  const soma = campo => +linhas.reduce((a,l)=>a + (l[campo]||0), 0).toFixed(2);
  const produtos = soma('valorProduto');
  const ipi = soma('ipiValor');
  return {linhas, uf, cliente:cli,
    totalProdutos: produtos,
    totalICMS: soma('icmsValor'), totalIPI: ipi,
    totalPIS: soma('pisValor'), totalCOFINS: soma('cofinsValor'),
    totalDIFAL: soma('difalValor'),
    totalNota: +(produtos + ipi).toFixed(2)};
}

/* ==========================================================================
   ALÇADA EM CADEIA — faixas de valor exigem níveis crescentes
   ========================================================================== */
const NIVEIS = [
  {n:1, label:'Supervisão',  ate:  20000},
  {n:2, label:'Gerência',    ate: 100000},
  {n:3, label:'Diretoria',   ate: Infinity},
];
const nivelLabel = n => (NIVEIS.find(x=>x.n===n)||{}).label || 'sem alçada';
const nivelDoUsuario = u => u.master ? 3 : (Number(u.nivel) || 0);

/* quantos níveis a requisição precisa percorrer, dado o valor */
function nivelExigido(valor){
  return NIVEIS.find(f => valor <= f.ate).n;
}
/* próximo nível que ainda falta assinar */
function proximoNivel(rc){
  const exigido = nivelExigido(docTotal(rc));
  const assinados = (rc.aprovacoes||[]).filter(a=>a.acao==='aprovou').map(a=>a.nivel||0);
  for(let n=1; n<=exigido; n++) if(!assinados.includes(n)) return n;
  return 0;   // completa
}
function podeAssinar(rc, u){
  const prox = proximoNivel(rc);
  if(!prox) return {ok:false, motivo:'já tem todas as assinaturas'};
  const meu = nivelDoUsuario(u);
  if(meu < prox) return {ok:false, motivo:`aguarda ${nivelLabel(prox)} — seu nível é ${meu?nivelLabel(meu):'sem alçada'}`};
  if(!u.master && alcada(u) < docTotal(rc))
    return {ok:false, motivo:`acima do seu limite de ${money(alcada(u))}`};
  if((rc.aprovacoes||[]).some(a=>a.user===u.name && a.acao==='aprovou'))
    return {ok:false, motivo:'você já assinou esta requisição'};
  return {ok:true, nivel:prox};
}
function quemAssina(rc){
  return app.data.users.filter(u => u.active!==false &&
    (u.master || (u.perms&&u.perms.requisitions&&u.perms.requisitions.aprovar)) &&
    podeAssinar(rc,u).ok).map(u=>u.name);
}
function trilhaAssinaturas(rc){
  const exigido = nivelExigido(docTotal(rc));
  return NIVEIS.filter(f=>f.n<=exigido).map(f=>{
    const a = (rc.aprovacoes||[]).find(x=>x.acao==='aprovou' && x.nivel===f.n);
    return {...f, assinado:!!a, por:a?a.user:'', em:a?a.at:''};
  });
}
function selosAssinatura(rc){
  return trilhaAssinaturas(rc).map(t => t.assinado
    ? `<span class="badge badge-success" title="${esc(t.por)} em ${fmtDate(t.em)}">${t.label} ✓</span>`
    : `<span class="badge badge-muted">${t.label}</span>`).join(' ');
}

/* Reúne tudo que está parado esperando decisão de alguém, em uma fila só. */
function filaAprovacao(){
  const f = [];
  if(can('requisitions','aprovar')){
    app.data.requisitions.filter(r=>r.status==='aguardando').forEach(r=>{
      const total = docTotal(r);
      f.push({tipo:'Requisição', mod:'requisitions', id:r.id, code:r.code,
        quem: funcLbl(r.requesterId), desc: `${r.lines.length} item(ns) · ${deptoLbl(r.deptId)}`,
        valor: total, desde: r.createdAt, prazo: r.neededAt, urg: r.urgencia,
        podeAgir: podeAssinar(r, app.user).ok,
        motivo: podeAssinar(r, app.user).motivo || '',
        acoes: `<button class="btn btn-xs" onclick="verRC('${r.id}')">Ver</button>
          <button class="btn btn-xs btn-success" onclick="decidirRC('${r.id}',true)">Aprovar</button>
          <button class="btn btn-xs btn-danger" onclick="decidirRC('${r.id}',false)">Reprovar</button>`});
    });
  }
  if(can('purchases','aprovar')){
    app.data.purchases.filter(p=>!pedidoCompleto(p) && ['enviado','parcial'].includes(p.status)).forEach(p=>{
      const sd = saldoPedido(p).filter(l=>l.saldo>0);
      f.push({tipo:'Recebimento', mod:'purchases', id:p.id, code:p.code,
        quem: supLbl(p.supplierId),
        desc: p.status==='parcial' ? `saldo de ${sd.length} item(ns) pendente` : `${p.lines.length} item(ns) a dar entrada`,
        valor: saldoPedido(p).reduce((a,l)=>a+l.saldo*l.unitPrice,0), desde: p.createdAt,
        prazo: p.expectedAt, urg: p.expectedAt<today()?'alta':'normal', podeAgir:true,
        acoes:`<button class="btn btn-xs" onclick="verPedido('compra','${p.id}')">Ver</button>
          <button class="btn btn-xs btn-success" onclick="receberCompra('${p.id}')">Receber</button>`});
    });
  }
  if(can('sales','aprovar')){
    app.data.sales.filter(v=>!v.stockApplied && v.status==='aberto').forEach(v=>{
      const semSaldo = v.lines.some(l=>{ const it=item(l.itemId); return !it || it.quantity < l.quantity; });
      f.push({tipo:'Faturamento', mod:'sales', id:v.id, code:v.code,
        quem: cliLbl(v.customerId), desc:`${v.lines.length} item(ns)${semSaldo?' — sem saldo em estoque':''}`,
        valor: docTotal(v), desde: v.createdAt, prazo:'', urg: semSaldo?'alta':'normal',
        podeAgir: !semSaldo, motivo: semSaldo?'estoque insuficiente':'',
        acoes:`<button class="btn btn-xs" onclick="verPedido('venda','${v.id}')">Ver</button>
          ${semSaldo?'':`<button class="btn btn-xs btn-success" onclick="faturarVenda('${v.id}')">Faturar</button>`}`});
    });
  }
  if(can('production','aprovar')){
    app.data.production.filter(o=>!o.stockApplied && o.progress>=100).forEach(o=>{
      f.push({tipo:'Ordem concluída', mod:'production', id:o.id, code:o.code,
        quem: o.machine, desc:`${num(o.quantity)} un. de ${itemLbl(o.productId)}`,
        valor:0, desde:o.createdAt, prazo:o.dueAt, urg:'normal', podeAgir:true,
        acoes:`<button class="btn btn-xs btn-success" onclick="concluirOP('${o.id}')">Concluir</button>`});
    });
  }
  if(can('expedicao','aprovar')){
    app.data.expedicoes.filter(e=>e.status==='separado').forEach(e=>{
      f.push({tipo:'Embarque', mod:'expedicao', id:e.id, code:e.code,
        quem: cliLbl(e.customerId), desc:`${e.lines.length} item(ns) separado(s), aguardando romaneio`,
        valor:0, desde:e.separadoEm||e.criadoEm, prazo:'', urg:'normal', podeAgir:true,
        acoes:`<button class="btn btn-xs" onclick="verExpedicao('${e.id}')">Ver</button>
          <button class="btn btn-xs btn-success" onclick="formEmbarque('${e.id}')">Embarcar</button>`});
    });
  }
  if(can('financial','aprovar')){
    app.data.financial.filter(emAtraso).forEach(t=>{
      f.push({tipo: t.type==='pagar'?'Título vencido (pagar)':'Título vencido (receber)',
        mod:'financial', id:t.id, code:t.code, quem:t.description, desc:'vencido há '+
          Math.round((new Date(today())-new Date(t.dueAt))/864e5)+' dia(s)',
        valor:t.amount, desde:t.dueAt, prazo:t.dueAt, urg:'urgente', podeAgir:true,
        acoes:`<button class="btn btn-xs btn-success" onclick="baixarTitulo('${t.id}')">Baixar</button>`});
    });
  }
  const ordem = {urgente:0, alta:1, normal:2};
  return f.sort((a,b)=> (ordem[a.urg]-ordem[b.urg]) || (a.desde < b.desde ? -1 : 1));
}

/* ==========================================================================

   ========================================================================== */
const conta   = id => byId(app.data.contas, id);
const contaCod = codigo => app.data.contas.find(c => c.codigo === codigo);
const contaLbl = id => { const c = conta(id); return c ? `${c.codigo} · ${c.nome}` : '—'; };

/* saldo de uma conta na natureza dela: devedora = débitos−créditos, credora = o inverso */
function saldoConta(contaId, ate){
  let deb = 0, cred = 0;
  app.data.lancamentos.forEach(lc => {
    if(ate && lc.data > ate) return;
    lc.partidas.forEach(p => {
      if(p.contaId !== contaId) return;
      if(p.tipo === 'debito') deb += p.valor; else cred += p.valor;
    });
  });
  const c = conta(contaId);
  const saldo = c && c.natureza === 'credora' ? (cred - deb) : (deb - cred);
  return {debito:+deb.toFixed(2), credito:+cred.toFixed(2), saldo:+saldo.toFixed(2)};
}
/* soma de todas as contas analíticas de um tipo (ativo/passivo/pl/receita/custo/despesa).
   Contas "contra" (ex.: Deduções da Receita, que é devedora dentro de um grupo credor)
   entram com o sinal invertido, senão a dedução seria somada em vez de subtraída. */
const TIPO_NATUREZA = {ativo:'devedora', passivo:'credora', pl:'credora',
  receita:'credora', custo:'devedora', despesa:'devedora'};
function saldoTipo(tipo, ate){
  const dominante = TIPO_NATUREZA[tipo];
  return app.data.contas.filter(c => c.tipo === tipo && !c.sintetica)
    .reduce((a,c) => {
      const sd = saldoConta(c.id, ate).saldo;
      return a + (c.natureza === dominante ? sd : -sd);
    }, 0);
}

/* registra um lançamento. partidas: [{contaId, tipo:'debito'|'credito', valor}]
   recusa se não bater débito com crédito — trava de segurança do próprio sistema. */
function lancar(data, historico, partidas, origem){
  const deb = partidas.filter(p=>p.tipo==='debito').reduce((a,p)=>a+p.valor,0);
  const cred = partidas.filter(p=>p.tipo==='credito').reduce((a,p)=>a+p.valor,0);
  if(Math.abs(deb - cred) > 0.01){
    console.error('Lançamento fora do balanço:', historico, deb, cred);
    return null;
  }
  const lc = {id:uid(), codigo:seq(app.data.lancamentos,'LC',5), data, historico,
    partidas: partidas.filter(p=>p.valor>0.001).map(p=>({...p, valor:+p.valor.toFixed(2)})),
    origem: origem||{tipo:'manual',ref:''}, automatico: !!(origem && origem.tipo!=='manual'),
    estornado:false, estornoDe:''};
  app.data.lancamentos.push(lc);
  return lc;
}
function estornarLancamento(id){
  if(!guard('contabilidade','excluir')) return;
  const lc = byId(app.data.lancamentos, id); if(!lc || lc.estornado) return;
  if(app.data.lancamentos.some(x=>x.estornoDe===id)){ toast('Este lançamento já foi estornado.','warn'); return; }
  confirmDialog('Estornar lançamento',
    `Cria um lançamento inverso de ${lc.codigo}, datado de hoje. O original continua no histórico, marcado como estornado — nada é apagado.`,
    () => {
      const inv = lancar(today(), `Estorno de ${lc.codigo} — ${lc.historico}`,
        lc.partidas.map(p=>({contaId:p.contaId, valor:p.valor, tipo: p.tipo==='debito'?'credito':'debito'})),
        {tipo:'estorno', ref:lc.codigo});
      if(!inv){ toast('Não foi possível gerar o estorno.','err'); return; }
      inv.estornoDe = id;
      lc.estornado = true;
      audit('Estornou lançamento','Contabilidade', lc.codigo, inv.codigo);
      saveData(); switchTab('contabilidade');
      toast(`${lc.codigo} estornado por ${inv.codigo}.`);
    }, 'Estornar');
}

/* ---------- geradores automáticos — chamados pelas próprias operações de negócio ---------- */
function lancarRecebimentoCompra(pcCode, linhas, data, nf){
  // separa por tipo de item, caso o pedido inclua produto acabado além de matéria-prima
  let mat = 0, prod = 0;
  linhas.forEach(l => { const it = item(l.itemId); const v = l.quantity * l.unitPrice;
    if(it && it.type === 'produto') prod += v; else mat += v; });
  const partidas = [{contaId:contaCod('2.1.1').id, tipo:'credito', valor:mat+prod}];
  if(mat > 0) partidas.push({contaId:contaCod('1.1.3').id, tipo:'debito', valor:mat});
  if(prod > 0) partidas.push({contaId:contaCod('1.1.4').id, tipo:'debito', valor:prod});
  return lancar(data, `Recebimento de compra ${pcCode}${nf?' · NF '+nf:''}`, partidas,
    {tipo:'compra', ref:pcCode});
}
/* custo REAL de fabricar uma unidade — vem da ficha técnica, não do preço de venda.
   item.unitPrice em produtos é o preço de referência de VENDA (com markup); usar isso
   como custo achataria a margem bruta quase a zero, porque os dois números ficam próximos. */
function custoUnitarioProduto(itemId){
  const bom = bomDe(itemId);
  if(bom) return custoTotal(bom);
  const it = item(itemId);
  return it ? it.unitPrice : 0;   // sem ficha técnica: usa o preço como última alternativa
}
function lancarFaturamentoVenda(pv, tributos, custoCMV, data){
  const partidas = [];
  const totalReceber = tributos.totalProdutos + tributos.totalIPI;
  partidas.push({contaId:contaCod('1.1.2').id, tipo:'debito', valor:totalReceber});
  partidas.push({contaId:contaCod('4.1').id, tipo:'credito', valor:tributos.totalProdutos});
  if(tributos.totalIPI > 0)
    partidas.push({contaId:contaCod('2.1.4').id, tipo:'credito', valor:tributos.totalIPI});
  const deducoes = tributos.totalICMS + tributos.totalPIS + tributos.totalCOFINS;
  if(deducoes > 0){
    partidas.push({contaId:contaCod('4.2').id, tipo:'debito', valor:deducoes});
    if(tributos.totalICMS > 0) partidas.push({contaId:contaCod('2.1.3').id, tipo:'credito', valor:tributos.totalICMS});
    const pisCofins = tributos.totalPIS + tributos.totalCOFINS;
    if(pisCofins > 0) partidas.push({contaId:contaCod('2.1.5').id, tipo:'credito', valor:pisCofins});
  }
  lancar(data, `Faturamento da venda ${pv}`, partidas, {tipo:'venda', ref:pv});
  if(custoCMV > 0){
    lancar(data, `Baixa de estoque pelo custo — venda ${pv}`,
      [{contaId:contaCod('5.1').id, tipo:'debito', valor:custoCMV},
       {contaId:contaCod('1.1.4').id, tipo:'credito', valor:custoCMV}],
      {tipo:'venda', ref:pv});
  }
}
function lancarBaixaTitulo(t, data){
  const cCaixa = contaCod('1.1.1');
  if(t.type === 'pagar'){
    lancar(data, `Pagamento — ${t.description}`,
      [{contaId:contaCod('2.1.1').id, tipo:'debito', valor:t.amount},
       {contaId:cCaixa.id, tipo:'credito', valor:t.amount}],
      {tipo:'titulo', ref:t.code});
  } else {
    lancar(data, `Recebimento — ${t.description}`,
      [{contaId:cCaixa.id, tipo:'debito', valor:t.amount},
       {contaId:contaCod('1.1.2').id, tipo:'credito', valor:t.amount}],
      {tipo:'titulo', ref:t.code});
  }
}
function lancarProducao(op, data){
  const mat = op.custoMaterial || 0, ope = op.custoOperacao || 0;
  if(mat <= 0 && ope <= 0) return;
  const partidas = [{contaId:contaCod('1.1.4').id, tipo:'debito', valor:mat+ope}];
  if(mat > 0) partidas.push({contaId:contaCod('1.1.3').id, tipo:'credito', valor:mat});
  /* a mão de obra já foi reconhecida como despesa na folha do mês; ao ser absorvida
     pelo produto, uma parte dela deixa de ser despesa do período e vira valor de estoque */
  if(ope > 0) partidas.push({contaId:contaCod('6.1').id, tipo:'credito', valor:ope});
  lancar(data, `Produção concluída — ordem ${op.code}`, partidas, {tipo:'producao', ref:op.code});
}

/* ---------------------------- FOLHA DE PAGAMENTO ---------------------------- */
const ENCARGOS_PATRONAIS = 0.30;  // simplificação: FGTS + INSS patronal ~30% sobre o bruto
const ST_FOLHA = {'processada':'badge-warning','paga':'badge-success'};

function competenciaAtual(){ return today().slice(0,7); }
function processarFolha(competencia){
  if(!guard('contabilidade','criar')) return;
  competencia = competencia || competenciaAtual();
  if(app.data.folhas.some(f=>f.competencia===competencia)){
    toast(`A folha de ${competencia} já foi processada.`,'warn'); return;
  }
  const ativos = app.data.employees.filter(e=>e.status==='ativo');
  if(!ativos.length){ toast('Não há funcionários ativos para calcular a folha.','err'); return; }
  const bruto = ativos.reduce((a,e)=>a+e.salario,0);
  const encargos = +(bruto * ENCARGOS_PATRONAIS).toFixed(2);
  const total = +(bruto+encargos).toFixed(2);
  const folha = {id:uid(), code:seq(app.data.folhas,'FP',5), competencia,
    funcionarios:ativos.length, bruto, encargos, total,

/* ---------------------------- CONTABILIDADE — telas ---------------------------- */
/* saldo de uma conta dentro de um período específico (para o DRE por mês) */
function saldoContaPeriodo(contaId, de, ate){
  let deb=0, cred=0;
  app.data.lancamentos.forEach(lc => {
    if(de && lc.data < de) return;
    if(ate && lc.data > ate) return;
    lc.partidas.forEach(p => { if(p.contaId!==contaId) return;
      if(p.tipo==='debito') deb+=p.valor; else cred+=p.valor; });
  });
  const c = conta(contaId);
  const saldo = c && c.natureza==='credora' ? (cred-deb) : (deb-cred);
  return {debito:+deb.toFixed(2), credito:+cred.toFixed(2), saldo:+saldo.toFixed(2)};
}
function competenciasDisponiveis(){
  return [...new Set(app.data.lancamentos.map(lc=>lc.data.slice(0,7)))].sort();
}
function montaDRE(de, ate){
  const rb = saldoContaPeriodo(contaCod('4.1').id, de, ate).saldo;
  const dev = saldoContaPeriodo(contaCod('4.3').id, de, ate).saldo;
  const ded = saldoContaPeriodo(contaCod('4.2').id, de, ate).saldo;
  const rl = rb - dev - ded;
  const cmv = saldoContaPeriodo(contaCod('5.1').id, de, ate).saldo;
  const lb = rl - cmv;
  const dp = saldoContaPeriodo(contaCod('6.1').id, de, ate).saldo;
  const da = saldoContaPeriodo(contaCod('6.2').id, de, ate).saldo;
  const df = saldoContaPeriodo(contaCod('6.3').id, de, ate).saldo;
  const despTotal = dp+da+df;
  return {receitaBruta:rb, devolucoes:dev, deducoes:ded, receitaLiquida:rl, cmv, lucroBruto:lb,
    despesaPessoal:dp, despesaAdmin:da, despesaFinanceira:df, despesaTotal:despTotal,
    resultado: +(lb-despTotal).toFixed(2)};
}

  const passivoCirc = grupo('Passivo Circulante', ['2.1.1','2.1.2','2.1.3','2.1.4','2.1.5']);
  const totalPassivo = passivoCirc.total;

  const resultado = montaDRE(null,null).resultado;
  const plLinhas = [
    {c:contaCod('3.1'), s:saldoConta(contaCod('3.1').id)},
    {c:contaCod('3.2'), s:saldoConta(contaCod('3.2').id)},
  ].filter(x=>Math.abs(x.s.saldo)>0.01);
  const totalPL = plLinhas.reduce((a,x)=>a+x.s.saldo,0) + resultado;

  const totalPassivoPL = totalPassivo + totalPL;
  const bate = Math.abs(totalAtivo - totalPassivoPL) < 1;

  const bloco = (g) => `
    <div class="lines-head"><h4>${esc(g.titulo)}</h4></div>
    <table class="lines">${g.linhas.map(({c,s})=>`<tr><td>${esc(c.nome)}</td><td class="num">${money(s.saldo)}</td></tr>`).join('')}
    <tr style="font-weight:700;border-top:1px solid var(--border-color)"><td>Total</td><td class="num">${money(g.total)}</td></tr></table>`;

  return `
    <div class="info-box" style="margin-bottom:14px;border-left-color:${bate?'var(--success)':'var(--danger)'}">
      Ativo: <strong>${money(totalAtivo)}</strong> · Passivo + Patrimônio Líquido: <strong>${money(totalPassivoPL)}</strong>
      · ${bate ? 'o balanço bate.' : 'ATENÇÃO: o balanço não bate.'}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="panel"><div class="panel-body">
        ${bloco(ativoCirc)}
        ${ativoNCirc.linhas.length?bloco(ativoNCirc):''}
        <div class="lines-total" style="border-top:2px solid var(--border-color);margin-top:10px">
          <span>TOTAL DO ATIVO</span><strong>${money(totalAtivo)}</strong></div>
      </div></div>
      <div class="panel"><div class="panel-body">
        ${bloco(passivoCirc)}
        <div class="lines-head"><h4>Patrimônio Líquido</h4></div>
        <table class="lines">${plLinhas.map(({c,s})=>`<tr><td>${esc(c.nome)}</td><td class="num">${money(s.saldo)}</td></tr>`).join('')}
          <tr><td>Resultado do Período</td><td class="num" style="color:${resultado>=0?'var(--success)':'var(--danger)'}">${money(resultado)}</td></tr>
          <tr style="font-weight:700;border-top:1px solid var(--border-color)"><td>Total do PL</td><td class="num">${money(totalPL)}</td></tr>
        </table>
        <div class="lines-total" style="border-top:2px solid var(--border-color);margin-top:10px">
          <span>TOTAL PASSIVO + PL</span><strong>${money(totalPassivoPL)}</strong></div>
      </div></div>
    </div>
    <div class="toolbar" style="margin-top:14px">
      <button class="btn" onclick="exportBalanco()">Exportar Excel</button>
    </div>`;
}
function exportBalanco(){
  const linhas = [];
  ['1.1.1','1.1.2','1.1.3','1.1.4','1.2.1'].forEach(cod=>{
    const c=contaCod(cod), s=saldoConta(c.id); if(Math.abs(s.saldo)>0.01) linhas.push({Grupo:'Ativo', Conta:c.nome, Valor:s.saldo}); });
  ['2.1.1','2.1.2','2.1.3','2.1.4','2.1.5'].forEach(cod=>{
    const c=contaCod(cod), s=saldoConta(c.id); if(Math.abs(s.saldo)>0.01) linhas.push({Grupo:'Passivo', Conta:c.nome, Valor:s.saldo}); });
  ['3.1','3.2'].forEach(cod=>{
    const c=contaCod(cod), s=saldoConta(c.id); if(Math.abs(s.saldo)>0.01) linhas.push({Grupo:'Patrimônio Líquido', Conta:c.nome, Valor:s.saldo}); });
  linhas.push({Grupo:'Patrimônio Líquido', Conta:'Resultado do Período', Valor:montaDRE(null,null).resultado});
  toXlsx(linhas, 'Balanço Patrimonial', 'balanco');
}
