<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS Enterprise - ERP System</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf@0.10.1/dist/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
:root{
--primary:#0052CC;--primary-dark:#001A66;--primary-light:#3D7FE0;
--secondary:#666;--light-gray:#F0F0F0;--border-color:#D1D1D1;
--success:#087F23;--warning:#B35C00;--danger:#C10000;
--text-dark:#1A1A1A;--text-light:#666;--panel:#fff;--app-bg:#F5F5F5;
}
body.dark-mode{
--light-gray:#333;--border-color:#4A4A4A;--text-dark:#E6E6E6;--text-light:#A0A0A0;
--panel:#2A2A2A;--app-bg:#1A1A1A;--primary-light:#5B93E8;
}
body{margin:0;padding:0;background:var(--app-bg);color:var(--text-dark)}

/* ---------- LOGIN ---------- */
.login-container{display:flex;align-items:center;justify-content:center;min-height:100vh;
background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%)}
.login-box{background:var(--panel);padding:44px;width:400px;max-width:94vw;border:2px solid var(--primary);
box-shadow:0 4px 12px rgba(0,0,0,.25)}
.login-box h1{margin:0 0 4px;color:var(--primary);font-size:30px;font-weight:700;text-align:center;letter-spacing:2px}
.login-box .sub{text-align:center;color:var(--text-light);margin:0 0 28px;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.login-err{display:none;background:#FFEBEE;border:1px solid var(--danger);color:var(--danger);
padding:9px;font-size:12px;margin-bottom:14px}

/* ---------- FORM ---------- */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-weight:600;margin-bottom:5px;font-size:11px;
text-transform:uppercase;color:var(--text-dark);letter-spacing:.3px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px;
border:1px solid var(--border-color);background:var(--panel);color:var(--text-dark);font-size:13px}
.form-group input:focus,.form-group select:focus{outline:2px solid var(--primary-light);outline-offset:-1px}
.form-hint{font-size:11px;color:var(--text-light);margin-top:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- BUTTONS ---------- */
.btn{padding:9px 16px;border:1px solid var(--border-color);background:var(--panel);color:var(--text-dark);
font-weight:600;cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.btn:hover{background:var(--light-gray);border-color:var(--secondary)}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-success:hover{background:#065C19}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-danger:hover{background:#8F0000}
.btn-xs{padding:3px 8px;font-size:10px}

/* ---------- TOP BAR ---------- */
.top-bar{background:var(--primary);color:#fff;padding:10px 18px;display:flex;align-items:center;
justify-content:space-between;border-bottom:3px solid var(--primary-dark);gap:12px;flex-wrap:wrap}
.top-bar-left{display:flex;align-items:center;gap:14px;flex:1;min-width:260px}
.brand{font-weight:700;letter-spacing:2px;font-size:15px}
.home-btn{background:var(--primary-light);color:#fff;border:1px solid #fff;padding:7px 11px;
cursor:pointer;font-weight:600;font-size:11px}
.home-btn:hover{background:#fff;color:var(--primary)}
.command-bar{display:flex;align-items:center;gap:7px;position:relative}
.command-bar label{font-size:11px;font-weight:600;white-space:nowrap;text-transform:uppercase}
.command-bar input{padding:7px 9px;border:1px solid #fff;width:170px;font-size:12px;font-weight:600;
background:rgba(255,255,255,.14);color:#fff}
.command-bar input::placeholder{color:rgba(255,255,255,.65);font-weight:400}
.command-suggestions{position:absolute;top:100%;left:62px;background:var(--panel);border:1px solid var(--border-color);
list-style:none;margin:0;padding:0;width:250px;display:none;z-index:1000;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.command-suggestions.show{display:block}
.command-suggestions li{padding:8px 10px;cursor:pointer;font-size:12px;color:var(--text-dark);
border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;gap:10px}
.command-suggestions li:hover,.command-suggestions li.sel{background:var(--light-gray)}
.command-suggestions .code{font-weight:700;color:var(--primary)}
.top-bar-right{display:flex;gap:9px;align-items:center}
.user-info{font-size:11px;border-right:1px solid rgba(255,255,255,.35);padding-right:10px;text-transform:uppercase}
.mode-toggle,.logout-btn{background:var(--primary-light);color:#fff;border:1px solid #fff;
padding:6px 10px;cursor:pointer;font-size:11px;font-weight:600}
.mode-toggle:hover,.logout-btn:hover{background:#fff;color:var(--primary)}

/* ---------- LAYOUT ---------- */
.app-container{display:flex;height:calc(100vh - 52px)}
.sidebar{width:210px;background:var(--panel);border-right:2px solid var(--border-color);
overflow-y:auto;padding:14px 0;flex-shrink:0}
.sidebar-title{padding:0 16px;font-size:10px;font-weight:700;text-transform:uppercase;
color:var(--text-light);margin:16px 0 6px;letter-spacing:.8px}
.sidebar-title:first-child{margin-top:0}
.sidebar-item{padding:9px 16px;cursor:pointer;font-size:13px;border-left:3px solid transparent;
display:flex;justify-content:space-between;align-items:center;gap:8px}
.sidebar-item:hover{background:var(--light-gray);border-left-color:var(--primary-light)}
.sidebar-item.active{background:var(--light-gray);border-left-color:var(--primary);font-weight:600;color:var(--primary)}
.sidebar-item .tcode{font-size:9px;color:var(--text-light);font-weight:700;letter-spacing:.5px}
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content-area{flex:1;overflow-y:auto;padding:20px}
.page-title{font-size:19px;font-weight:700;margin:0 0 4px;color:var(--primary)}
.page-sub{font-size:12px;color:var(--text-light);margin:0 0 18px;padding-bottom:10px;
border-bottom:2px solid var(--border-color)}

/* ---------- KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi-card{background:var(--panel);border:2px solid var(--border-color);padding:14px;
border-top:4px solid var(--primary)}
.kpi-card h3{margin:0 0 6px;font-size:10px;font-weight:700;text-transform:uppercase;
color:var(--text-light);letter-spacing:.5px}
.kpi-card .value{font-size:26px;font-weight:700;color:var(--primary);margin:4px 0}
.kpi-card .subtitle{font-size:11px;color:var(--text-light)}
.kpi-card.ok{border-top-color:var(--success)}.kpi-card.ok .value{color:var(--success)}
.kpi-card.warn{border-top-color:var(--warning)}.kpi-card.warn .value{color:var(--warning)}
.kpi-card.bad{border-top-color:var(--danger)}.kpi-card.bad .value{color:var(--danger)}

/* ---------- PANEL / GRID ---------- */
.panel{background:var(--panel);border:2px solid var(--border-color);margin-bottom:18px}
.panel-head{background:var(--light-gray);border-bottom:2px solid var(--border-color);padding:9px 12px;
display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel-head h3{margin:0;font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px}
.panel-body{padding:14px}
.grid-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid-search{padding:7px 9px;border:1px solid var(--border-color);font-size:12px;width:210px;
background:var(--panel);color:var(--text-dark)}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}

/* ---------- SUB-ABAS ---------- */
.subtabs{display:flex;gap:0;margin-bottom:0;flex-wrap:wrap;border-bottom:2px solid var(--border-color)}
.subtab{padding:9px 15px;cursor:pointer;font-size:12px;font-weight:600;background:transparent;
border:none;border-bottom:3px solid transparent;color:var(--text-light);display:flex;
align-items:center;gap:7px;margin-bottom:-2px}
.subtab:hover{color:var(--primary);background:var(--light-gray)}
.subtab.active{color:var(--primary);border-bottom-color:var(--primary);background:var(--panel)}
.subtab .cnt{background:var(--light-gray);border:1px solid var(--border-color);
font-size:10px;padding:1px 6px;font-weight:700;min-width:20px;text-align:center}
.subtab.active .cnt{background:var(--primary);color:#fff;border-color:var(--primary)}
.subtab.alerta .cnt{background:rgba(179,92,0,.15);color:var(--warning);border-color:var(--warning)}
.subtab.alerta.active .cnt{background:var(--warning);color:#fff}

table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--light-gray);color:var(--text-dark);padding:9px 10px;text-align:left;font-weight:700;
border-bottom:2px solid var(--border-color);text-transform:uppercase;font-size:10px;
white-space:nowrap;letter-spacing:.4px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--primary)}
th .arrow{color:var(--primary);font-size:9px}
td{padding:8px 10px;border-bottom:1px solid var(--border-color);vertical-align:middle}
tbody tr:hover{background:var(--light-gray)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
.empty-state{padding:38px 20px;text-align:center;color:var(--text-light);font-size:13px}
.empty-state strong{display:block;color:var(--text-dark);margin-bottom:5px;font-size:14px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
border-top:2px solid var(--border-color);background:var(--light-gray);font-size:11px;gap:10px;flex-wrap:wrap}
.pager-info{color:var(--text-light)}
.pager-controls{display:flex;gap:5px;align-items:center}
.pager-controls button{padding:4px 9px;border:1px solid var(--border-color);background:var(--panel);
color:var(--text-dark);cursor:pointer;font-size:11px;font-weight:600}
.pager-controls button:disabled{opacity:.4;cursor:not-allowed}
.pager-controls button:hover:not(:disabled){background:var(--primary);color:#fff;border-color:var(--primary)}

/* ---------- BADGES / BARS ---------- */
.badge{display:inline-block;padding:3px 7px;font-size:9px;font-weight:700;text-transform:uppercase;
border:1px solid;white-space:nowrap;letter-spacing:.4px}
.badge-success{background:rgba(8,127,35,.1);color:var(--success);border-color:var(--success)}
.badge-warning{background:rgba(179,92,0,.1);color:var(--warning);border-color:var(--warning)}
.badge-danger{background:rgba(193,0,0,.1);color:var(--danger);border-color:var(--danger)}
.badge-info{background:rgba(0,82,204,.1);color:var(--primary);border-color:var(--primary)}
.badge-muted{background:transparent;color:var(--text-light);border-color:var(--border-color)}
.progress-wrap{display:flex;align-items:center;gap:8px;min-width:110px}
.progress{background:var(--light-gray);border:1px solid var(--border-color);height:12px;
flex:1 1 auto;min-width:52px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--primary);transition:width .2s ease}
.progress.ok > i{background:var(--success)}
.progress.warn > i{background:var(--warning)}
.progress-val{font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;
width:34px;text-align:right;flex:0 0 auto;color:var(--text-dark)}

/* ---------- GANTT ---------- */
.gantt{background:var(--panel);border:2px solid var(--border-color);border-top:none;overflow:hidden}
.gantt-scroll{overflow-x:auto}
.gantt-inner{min-width:760px}
.gantt-head{display:flex;border-bottom:2px solid var(--border-color);background:var(--light-gray)}
.gantt-lbl{width:230px;flex:0 0 230px;padding:8px 10px;font-size:10px;font-weight:700;
text-transform:uppercase;letter-spacing:.4px;color:var(--text-light);
border-right:2px solid var(--border-color)}
.gantt-tl{flex:1 1 auto;position:relative;height:38px}
.gantt-mes{position:absolute;top:0;bottom:0;border-left:1px solid var(--border-color);
font-size:10px;font-weight:700;padding:5px 0 0 6px;color:var(--text-dark);overflow:hidden;
text-transform:uppercase;letter-spacing:.3px}
.gantt-sem{position:absolute;top:19px;bottom:0;border-left:1px solid var(--border-color);
font-size:9px;padding-left:3px;color:var(--text-light);opacity:.75}
.gantt-row{display:flex;border-bottom:1px solid var(--border-color);min-height:32px}
.gantt-row:hover{background:var(--light-gray)}
.gantt-row .gantt-lbl{display:flex;flex-direction:column;justify-content:center;gap:1px;
text-transform:none;letter-spacing:0;font-weight:400;color:var(--text-dark);cursor:pointer}
.gantt-row .gantt-lbl strong{font-size:11px;color:var(--primary)}
.gantt-row .gantt-lbl span{font-size:10px;color:var(--text-light)}
.gantt-track{flex:1 1 auto;position:relative;background-image:repeating-linear-gradient(
  to right, transparent, transparent calc(100%/26 - 1px), var(--border-color) calc(100%/26 - 1px), var(--border-color) calc(100%/26))}
.gantt-bar{position:absolute;top:7px;height:18px;border:1px solid rgba(0,0,0,.25);
cursor:pointer;overflow:hidden;min-width:5px}
.gantt-bar > i{display:block;height:100%;background:rgba(255,255,255,.42)}
.gantt-bar span{position:absolute;inset:0;display:flex;align-items:center;padding-left:5px;
font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap}
.gantt-bar.plan{background:#8A8A8A}
.gantt-bar.prod{background:var(--primary)}
.gantt-bar.paus{background:var(--warning)}
.gantt-bar.conc{background:var(--success)}
.gantt-bar.atra{background:var(--danger)}
.gantt-hoje{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:5}
.gantt-hoje::after{content:'HOJE';position:absolute;top:-16px;left:-16px;font-size:8px;
font-weight:700;color:#fff;background:var(--danger);padding:1px 4px;letter-spacing:.5px}
.gantt-legenda{display:flex;gap:14px;flex-wrap:wrap;padding:10px 12px;
border-top:2px solid var(--border-color);background:var(--light-gray);font-size:10px}
.gantt-legenda i{display:inline-block;width:14px;height:10px;margin-right:5px;
vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}

/* ---------- KANBAN (funil de vendas) ---------- */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kanban-col{flex:0 0 250px;background:var(--light-gray);border:2px solid var(--border-color)}
.kanban-col-head{padding:9px 11px;border-bottom:2px solid var(--border-color);font-weight:700;
font-size:11px;text-transform:uppercase;letter-spacing:.3px;display:flex;justify-content:space-between;
align-items:center;gap:6px}
.kanban-col-head .cnt{background:var(--panel);border:1px solid var(--border-color);
font-size:10px;padding:1px 6px;font-weight:700}
.kanban-col-total{padding:4px 11px 9px;font-size:11px;color:var(--text-light);border-bottom:2px solid var(--border-color)}
.kanban-col-body{padding:8px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.kanban-card{background:var(--panel);border:1px solid var(--border-color);border-left:4px solid var(--primary);
padding:9px 10px;cursor:pointer;font-size:12px}
.kanban-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.14)}
.kanban-card .nome{font-weight:700;margin-bottom:2px;color:var(--text-dark)}
.kanban-card .cli{font-size:11px;color:var(--text-light);margin-bottom:5px}
.kanban-card .valor{color:var(--primary);font-weight:700;font-size:13px}
.kanban-card .meta{font-size:10px;color:var(--text-light);margin-top:5px;display:flex;justify-content:space-between}
.kanban-card .frio{color:var(--warning);font-weight:700}
.kanban-empty{padding:16px 8px;text-align:center;font-size:11px;color:var(--text-light)}

/* ---------- CHARTS ---------- */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.chart-container{background:var(--panel);border:2px solid var(--border-color);padding:14px;
display:flex;flex-direction:column;min-height:330px;max-height:400px}
.chart-container h3{margin:0 0 12px;font-size:12px;font-weight:700;color:var(--primary);
text-transform:uppercase;border-bottom:1px solid var(--border-color);padding-bottom:7px;flex-shrink:0;letter-spacing:.5px}
.chart-container canvas{flex:1 1 auto;min-height:0;max-width:100%}

/* ---------- MODAL / TOAST ---------- */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10000;
align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-content{background:var(--panel);border:2px solid var(--primary);width:100%;max-width:560px;
max-height:90vh;overflow-y:auto}
.modal-head{background:var(--primary);color:#fff;padding:12px 16px;font-size:13px;font-weight:700;
text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;letter-spacing:.5px}
.modal-head button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;line-height:1}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border-color);display:flex;gap:8px;justify-content:flex-end}
#toastContainer{position:fixed;top:64px;right:18px;z-index:11000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--border-color);border-left:4px solid var(--success);
padding:11px 14px;box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:12px;display:flex;gap:12px;
align-items:center;min-width:250px;animation:slideIn .25s ease}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
.toast button{background:none;border:none;cursor:pointer;color:var(--text-light);font-size:14px}
@keyframes slideIn{from{transform:translateX(340px);opacity:0}to{transform:translateX(0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.info-box{background:rgba(0,82,204,.07);border-left:4px solid var(--primary);padding:12px 14px;font-size:12px;line-height:1.6}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:12px}
.dl dt{font-weight:700;color:var(--text-light);text-transform:uppercase;font-size:10px;padding-top:2px}
.dl dd{margin:0}

/* ---------- MENU MOBILE ---------- */
.menu-btn{display:none;background:var(--primary-light);color:#fff;border:1px solid #fff;
padding:7px 11px;cursor:pointer;font-weight:700;font-size:14px;line-height:1}
.menu-btn:hover{background:#fff;color:var(--primary)}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900}
.backdrop.show{display:block}

/* ---------- EDITOR DE LINHAS DO PEDIDO ---------- */
.lines-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;
padding-bottom:6px;border-bottom:1px solid var(--border-color)}
.lines-head h4{margin:0;font-size:11px;font-weight:700;text-transform:uppercase;
color:var(--primary);letter-spacing:.5px}
table.lines{font-size:12px}
table.lines th{padding:6px 7px;font-size:9px}
table.lines td{padding:5px 7px}
table.lines select,table.lines input{width:100%;padding:6px;border:1px solid var(--border-color);
font-size:12px;background:var(--panel);color:var(--text-dark)}
table.lines .rm{background:none;border:none;color:var(--danger);cursor:pointer;font-size:15px;
padding:0 4px;line-height:1}
table.lines .rm:hover{color:#8F0000}
.lines-total{display:flex;justify-content:flex-end;gap:14px;align-items:baseline;
padding:12px 8px 0;font-size:13px;border-top:2px solid var(--border-color);margin-top:8px}
.lines-total strong{font-size:17px;color:var(--primary)}
.lines-empty{padding:18px;text-align:center;color:var(--text-light);font-size:12px}

@media (max-width:860px){
.menu-btn{display:block}
.sidebar{position:fixed;top:0;left:0;bottom:0;z-index:950;width:230px;transform:translateX(-100%);
transition:transform .2s ease;box-shadow:4px 0 16px rgba(0,0,0,.3);display:block!important;padding-top:14px}
.sidebar.open{transform:translateX(0)}
.app-container{height:auto}
.modal-content{max-width:100%}
.form-row{grid-template-columns:1fr}
.kpi-grid,.chart-grid{grid-template-columns:1fr}
.command-bar input{width:120px}
.command-suggestions{left:0;width:100%}
.content-area{padding:12px}
.dl{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginPage" class="login-container">
  <div class="login-box">
    <h1>NEXUS</h1>
    <p class="sub">Enterprise ERP System</p>
    <div class="login-err" id="loginErr"></div>
    <div class="form-group">
      <label for="loginEmail">Usuário</label>
      <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="username">
    </div>
    <div class="form-group">
      <label for="loginPassword">Senha</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>

const FORNECEDORES = [

const CLIENTES = [

];
const docTotal = doc => (doc.lines||[]).reduce((s,l)=>s + l.quantity*l.unitPrice, 0);
const docQty   = doc => (doc.lines||[]).reduce((s,l)=>s + Number(l.quantity), 0);
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const cnpj = () => `${String(rnd(90)+10)}.${String(rnd(900)+100)}.${String(rnd(900)+100)}/0001-${String(rnd(90)+10)}`;

function seedData(){
  const d = {
    empresa:{
      razao:'NEXUS AUTOMOTIVE SOLUTIONS LTDA', fantasia:'Nexus Automotive',
      cnpj:'12.345.678/0001-90', ie:'114.256.789.110', im:'',
      logradouro:'Rodovia SP-340, km 158', numero:'2400', bairro:'Distrito Industrial',
      municipio:'Mogi Mirim', uf:'SP', cep:'13803-000', fone:'19 3862-4400',
      regime:'presumido',            // simples | presumido | real
      segmento:'ambos',              // industria | comercio | ambos
      contribuinteIPI:true,
      serieNFe:1, proxNumero:1,
      aliqInternaICMS:18, aliqPIS:0.65, aliqCOFINS:3.00,
    },
    users:[
      {id:uid(), name:'Sandro Aparecido', email:'sandro03junior@gmail.com', password:'Kavro-71Pmez-3T',
       master:true, modelo:'administrador', active:true, perms:permsDe('administrador'),
       createdAt:today(), createdBy:'sistema', lastLogin:'', expiresAt:'', mustChangePassword:false, passwordChangedAt:today(), limite:0, nivel:3},
      {id:uid(), name:'Gerente Demonstração', email:'gerente@nexus.com', password:'Demo-2026',
       master:false, modelo:'gerente', active:true, perms:permsDe('gerente'),
       createdAt:today(), createdBy:'sistema', lastLogin:'', expiresAt:'', mustChangePassword:false, passwordChangedAt:today(), limite:80000, nivel:2},
      {id:uid(), name:'Operador Demonstração', email:'operador@nexus.com', password:'Demo-2026',
       master:false, modelo:'operador', active:true, perms:permsDe('operador'),
       createdAt:today(), createdBy:'sistema', lastLogin:'', expiresAt:'', mustChangePassword:false, passwordChangedAt:today(), limite:0, nivel:0},
      {id:uid(), name:'Consulta Demonstração', email:'consulta@nexus.com', password:'Demo-2026',
       master:false, modelo:'consulta', active:true, perms:permsDe('consulta'),
       createdAt:today(), createdBy:'sistema', lastLogin:'', expiresAt:'', mustChangePassword:false, passwordChangedAt:today(), limite:0, nivel:0},
    ],
    suppliers:[], customers:[], inventory:[], purchases:[], sales:[],
    production:[], inspections:[], financial:[], moves:[], audit:[],
    departments:[], employees:[], requisitions:[], quotations:[], receipts:[], boms:[], invoices:[],
    depositos:[], balances:[], lotes:[], expedicoes:[], contas:[], lancamentos:[], folhas:[], centros:[], devolucoes:[], oportunidades:[],
  };

  const LEAD_TIMES = [7, 12, 18, 10, 25, 15];  // dias — varia por fornecedor, alguns bem mais lentos
  FORNECEDORES.forEach(([name,city,phone],i)=>d.suppliers.push({
    id:uid(), code:'FOR'+String(i+1).padStart(4,'0'), name, cnpj:cnpj(), city, phone,
    email:'comercial@'+name.split(' ')[0].toLowerCase().replace(/[^a-z]/g,'')+'.com.br', active:true,
    leadTimeDias: LEAD_TIMES[i] || 15
  }));
  const UF_CIDADE = {'Ribeirão Preto':'SP','Curitiba':'PR','Campinas':'SP','Belo Horizonte':'MG',
    'Santos':'SP','São José dos Campos':'SP','Goiânia':'GO'};
  CLIENTES.forEach(([name,city,phone],i)=>d.customers.push({
    id:uid(), code:'CLI'+String(i+1).padStart(4,'0'), name, cnpj:cnpj(), city, phone,
    uf: UF_CIDADE[city]||'SP', ie: String(rnd(900)+100)+'.'+String(rnd(900)+100)+'.'+String(rnd(900)+100)+'.'+String(rnd(900)+100),
    contribuinte:true, consumidorFinal:false,
    email:'compras@'+name.split(' ')[0].toLowerCase().replace(/[^a-z]/g,'')+'.com.br', active:true
  }));

  let n=0;
  MATERIAS.forEach(([desc,cat])=>{
    n++; const q=rnd(900)+300;
    d.inventory.push({id:uid(), sku:'MP'+String(n).padStart(5,'0'), description:desc, category:cat,
      type:'materia', quantity:q, minQuantity:200, unitPrice:+(Math.random()*80+15).toFixed(2),
      supplierId:pick(d.suppliers).id, updatedAt:today(),
      ncm:pick(['7208.10.00','7604.29.20','3909.40.19','6806.10.10','7217.10.19','7304.31.10']),
      origem:'0', unidade:'KG', aliqIPI:0, cest:'', controlaLote:true});
  });
  n=0;
  PRODUTOS.forEach(([desc,cat])=>{
    n++; const q=rnd(400)+20;
    const NCM_CAT = {'Freios':'8708.30.90','Suspensão':'8708.80.00','Motor':'8409.91.90',
                     'Transmissão':'8708.40.90','Elétrica':'8511.50.90'};
    d.inventory.push({id:uid(), sku:'PA'+String(n).padStart(5,'0'), description:desc, category:cat,
      type:'produto', quantity:q, minQuantity:60, unitPrice:+(Math.random()*420+80).toFixed(2),
      supplierId:'', updatedAt:today(),
      ncm:NCM_CAT[cat]||'8708.99.90', origem:'0', unidade:'PC', controlaLote:true,
      aliqIPI: cat==='Elétrica'?5:cat==='Motor'?5:10, cest:''});
  });

  const produtos = d.inventory.filter(i=>i.type==='produto');
  const materias = d.inventory.filter(i=>i.type==='materia');

  // sinaliza reposição sem travar a fábrica: dois itens têm o mínimo elevado,
  // e só um fica com saldo realmente curto (feito antes de distribuir os saldos)
  {
    const mats = d.inventory.filter(i=>i.type==='materia');
    mats[1].minQuantity = Math.round(mats[1].quantity * 1.45);
    mats[2].minQuantity = Math.round(mats[2].quantity * 1.20);
    mats[0].quantity = Math.round(mats[0].minQuantity * 0.35);
  }

  // ---- Depósitos ----
  [['ALM','Almoxarifado central','materia', 'Recebimento e guarda de matéria-prima'],
   ['PRD','Estoque de processo','materia', 'Material liberado para as células de produção'],
   ['ACB','Produto acabado','produto',   'Peças prontas aguardando expedição'],
   ['EXP','Área de expedição','produto',  'Separado e conferido, pronto para embarque'],
   ['QUA','Quarentena','ambos',           'Material bloqueado aguardando decisão da qualidade']]
   .forEach(([code,nome,aceita,desc],i) => d.depositos.push({
     id:uid(), code, nome, aceita, descricao:desc, principal: i===0 || i===2, ativo:true}));

  const depALM = d.depositos.find(x=>x.code==='ALM');
  const depACB = d.depositos.find(x=>x.code==='ACB');

  // ---- Saldos iniciais por depósito ----
  d.inventory.forEach(it => {
    const dep = it.type==='materia' ? depALM : depACB;
    d.balances.push({id:uid(), itemId:it.id, depositId:dep.id, loteId:'', quantity:it.quantity});
  });
  // parte do material fica no estoque de processo, para o saldo não ficar num lugar só
  const depPRD = d.depositos.find(x=>x.code==='PRD');
  d.inventory.filter(i=>i.type==='materia').slice(0,5).forEach(it => {
    const b = d.balances.find(x=>x.itemId===it.id && x.depositId===depALM.id);
    const mover = Math.floor(b.quantity * 0.25);
    if(mover > 0){
      b.quantity -= mover;
      d.balances.push({id:uid(), itemId:it.id, depositId:depPRD.id, loteId:'', quantity:mover});
    }
  });

  // ---- Lotes de matéria-prima com rastreabilidade ----
  const mkLote = (it, dep, qtd, fornId, nfNum, diasAtras) => {
    const criado = addDays(today(), -diasAtras);
    const l = {id:uid(), itemId:it.id,
      codigo:`L${criado.replace(/-/g,'').slice(2)}-${String(d.lotes.length+1).padStart(3,'0')}`,
      fornecedorId:fornId||'', nf:nfNum||'', fabricacao:addDays(criado,-rnd(30)-5),
      /* a cada poucos lotes um recebe prazo curto, para o painel apontar vencimento */
      validade: it.type!=='materia' ? ''
        : _loteSeq % 7 === 3 ? addDays(today(), rnd(45)+8)
        : _loteSeq % 11 === 5 ? addDays(today(), -(rnd(25)+3))
        : addDays(criado, 430+rnd(260)),
      criadoEm:criado, obs:''};
    _loteSeq++;
    d.lotes.push(l);
    const b = d.balances.find(x=>x.itemId===it.id && x.depositId===dep && !x.loteId);
    if(b){ b.quantity -= qtd; if(b.quantity<=0) d.balances = d.balances.filter(x=>x.id!==b.id); }
    d.balances.push({id:uid(), itemId:it.id, depositId:dep, loteId:l.id, quantity:qtd});
    return l;
  };
  let _loteSeq = 0;
  d.inventory.filter(i=>i.type==='materia').forEach(it => {
    const b = d.balances.find(x=>x.itemId===it.id && x.depositId===depALM.id && !x.loteId);
    if(!b || b.quantity < 24) return;
    // divide o saldo em dois ou três lotes de entradas diferentes
    const n = rnd(2)+2;
    const total = b.quantity;
    for(let k=0;k<n;k++){
      /* o último lote leva todo o restante, para não sobrar saldo sem rastreio */
      const parte = k === n-1
        ? d.balances.filter(x=>x.itemId===it.id&&x.depositId===depALM.id&&!x.loteId).reduce((a,x)=>a+x.quantity,0)
        : Math.floor(total / n);
      if(parte > 0) mkLote(it, depALM.id, parte, it.supplierId, String(rnd(90000)+10000),
        (n-k)*38 + rnd(20));
    }
  });

  // parte de um lote fica bloqueada na quarentena, aguardando decisão da qualidade
  {
    const depQUA = d.depositos.find(x=>x.code==='QUA');
    const alvo = d.balances.filter(b=>b.depositId===depALM.id && b.loteId && b.quantity>80)[0];
    if(alvo && depQUA){
      const bloquear = Math.floor(alvo.quantity * 0.3);
      alvo.quantity -= bloquear;
      d.balances.push({id:uid(), itemId:alvo.itemId, depositId:depQUA.id,
        loteId:alvo.loteId, quantity:bloquear});
      d.moves.push({id:uid(), itemId:alvo.itemId, type:'saida', quantity:bloquear,
        refType:'transferencia', refCode:'TRF', createdAt:addDays(today(),-4),
        note:'Bloqueio pela qualidade — para QUA · Quarentena', depositId:depALM.id, loteId:alvo.loteId});
      d.moves.push({id:uid(), itemId:alvo.itemId, type:'entrada', quantity:bloquear,
        refType:'transferencia', refCode:'TRF', createdAt:addDays(today(),-4),
        note:'Bloqueio pela qualidade — de ALM · Almoxarifado central', depositId:depQUA.id, loteId:alvo.loteId});
    }
  }

  // ---- Centros de trabalho (capacidade produtiva) ----
  // os nomes batem exatamente com os usados em CENTROS/OPER logo abaixo, na ficha técnica
  [['Usinagem', 16], ['Prensagem', 16], ['Injeção', 24], ['Montagem', 24],
   ['Acabamento', 8], ['Inspeção', 8]]
   .forEach(([nome, horas]) => d.centros.push({id:uid(), nome, capacidadeDiariaHoras:horas, ativo:true}));

  // ---- Fichas técnicas (estrutura de produto) ----
  const CENTROS = ['Usinagem','Prensagem','Injeção','Montagem','Acabamento'];
  const OPER = {
    'Freios':      [['Prensagem',6.5],['Acabamento',4.0],['Montagem',3.5]],
    'Suspensão':   [['Usinagem',11.0],['Prensagem',5.0],['Montagem',4.5]],
    'Motor':       [['Usinagem',16.0],['Acabamento',6.0],['Montagem',5.5]],
    'Transmissão': [['Usinagem',13.0],['Montagem',7.5]],
    'Elétrica':    [['Injeção',5.5],['Montagem',9.0],['Acabamento',2.5]],
  };
  produtos.forEach(prod => {
    // 2 a 4 componentes, priorizando matéria-prima da mesma categoria
    const mesma = materias.filter(m=>m.category===prod.category);
    const outras = materias.filter(m=>m.category!==prod.category);
    const escolhidos = [];
    mesma.slice(0, Math.min(2, mesma.length)).forEach(m=>escolhidos.push(m));
    while(escolhidos.length < rnd(3)+2 && outras.length){
      const c = pick(outras);
      if(!escolhidos.some(x=>x.id===c.id)) escolhidos.push(c);
    }
    d.boms.push({
      id:uid(), productId:prod.id, versao:1, ativa:true,
      lines: escolhidos.map((m,k)=>({itemId:m.id,
        quantity:+(k===0 ? (Math.random()*1.5+0.8) : (Math.random()*0.9+0.2)).toFixed(3),
        perda:+(Math.random()*4).toFixed(1)})),
      operacoes: (OPER[prod.category]||[['Montagem',1]]).map(([centro,tempo],k)=>({
        seq:(k+1)*10, centro, tempo:+(tempo*(0.85+Math.random()*0.3)).toFixed(2),
        custoHora: centro==='Usinagem'?92 : centro==='Injeção'?78 : centro==='Prensagem'?68 : centro==='Acabamento'?54 : 46
      })),
      createdAt:today(), updatedAt:today()
    });
  });

  // preço de venda coerente com o custo apurado na ficha
  const MARKUP = {'Freios':1.62,'Suspensão':1.55,'Motor':1.48,'Transmissão':1.58,'Elétrica':1.68};
  d.boms.forEach((b,idx) => {
    const prod = d.inventory.find(i=>i.id===b.productId);
    if(!prod) return;
    const mat = b.lines.reduce((a,l)=>{
      const c = d.inventory.find(i=>i.id===l.itemId);
      return a + (c ? c.unitPrice * l.quantity * (1+l.perda/100) : 0);
    }, 0);
    const ope = b.operacoes.reduce((a,o)=> a + o.tempo/60*o.custoHora, 0);
    const custo = mat + ope;
    // três produtos ficam com margem apertada de propósito, para o painel ter o que apontar
    const mk = idx===3 ? 0.96 : idx===9 ? 1.04 : idx===14 ? 1.09
             : (MARKUP[prod.category]||1.55) * (0.94 + Math.random()*0.16);
    prod.unitPrice = +(custo * mk).toFixed(2);
  });

  // ---- Ordens de produção (algumas já concluídas, com histórico) ----
  const statuses = ['planejada','em producao','pausada','concluida'];
  for(let i=1;i<=30;i++){
    const prod = pick(produtos), comp = materias.find(m=>m.category===prod.category) || pick(materias);
    const st = i<=12 ? 'concluida' : pick(statuses);
    /* concluídas ficam no passado; as abertas se espalham entre atraso e futuro */
    const created = st==='concluida'
      ? addDays(today(), -(rnd(120)+25))
      : addDays(today(), -(rnd(40)+2));
    const bom = d.boms.find(b=>b.productId===prod.id && b.ativa);
    const qtdOP = (rnd(18)+3)*10;
    d.production.push({
      id:uid(), code:'OP'+String(i).padStart(5,'0'), productId:prod.id,
      bomId: bom ? bom.id : '',
      consumo: bom ? bom.lines.map(l=>({itemId:l.itemId,

  // espelhos de nota para parte das vendas faturadas
  d.sales.filter(v=>v.stockApplied).slice(0,7).forEach((v,i)=>{
    const cli = d.customers.find(c=>c.id===v.customerId) || {};
    const uf = cli.uf || 'SP';
    const linhas = v.lines.map(l=>{
      const it = d.inventory.find(x=>x.id===l.itemId) || {};
      const base = l.quantity * l.unitPrice;
      const fora = uf !== 'SP';
      const aliq = fora ? (['PR','RJ','MG','SC','RS'].includes(uf) ? 12 : 7) : 18;
      const ipi = (it.aliqIPI||0) > 0 ? +(base*it.aliqIPI/100).toFixed(2) : 0;
      return {itemId:l.itemId, quantidade:l.quantity, valorUnit:l.unitPrice,
        valorProduto:+base.toFixed(2), ncm:it.ncm||'', origem:it.origem||'0',
        unidade:it.unidade||'UN', cfop:(fora?'6':'5')+'101',
        icmsBase:+base.toFixed(2), icmsAliq:aliq, icmsValor:+(base*aliq/100).toFixed(2),
        ipiBase:ipi?+base.toFixed(2):0, ipiAliq:it.aliqIPI||0, ipiValor:ipi,
        pisValor:+(base*0.65/100).toFixed(2), cofinsValor:+(base*3/100).toFixed(2),
        difalValor:0, cst:'00', csosn:''};
    });
    const soma = c => +linhas.reduce((a,l)=>a+(l[c]||0),0).toFixed(2);
    const prod = soma('valorProduto'), ipiT = soma('ipiValor');
    d.invoices.push({id:uid(), numero:i+1, serie:1, saleId:v.id, customerId:v.customerId, uf,
      natureza:'Venda de produção do estabelecimento', regime:'presumido', linhas,
      totalProdutos:prod, totalICMS:soma('icmsValor'), totalIPI:ipiT,
      totalPIS:soma('pisValor'), totalCOFINS:soma('cofinsValor'), totalDIFAL:0,
      totalNota:+(prod+ipiT).toFixed(2), obs:'',
      status: i===6 ? 'cancelada' : 'emitida', emitidaEm:v.createdAt,
      emitidaPor:'Helena Prado',
      canceladaEm: i===6 ? addDays(v.createdAt,1) : '',
      motivoCancel: i===6 ? 'Divergência na quantidade acordada com o cliente, nota substituída.' : ''});
  });
  d.empresa.proxNumero = d.invoices.length + 1;

  // ---- Oportunidades de CRM (funil de vendas) ----
  {
    const vendedores = d.employees.filter(e=>['Marcelo Ibrahim','Larissa Ventura','Diego Assunção'].includes(e.name));
    const vend = () => vendedores[rnd(vendedores.length)];
    const ORIGENS = ['Indicação','Site','Evento','Prospecção ativa','Licitação'];
    const NEGOCIOS = [
      'Fornecimento trimestral de pastilhas de freio',
      'Contrato anual — linha de suspensão',
      'Reposição de kit de embreagem',
      'Parceria para distribuição regional',
      'Fornecimento de componentes elétricos',
      'Expansão de linha — peças de motor',
      'Contrato emergencial de reposição',
      'Homologação de novo fornecedor de peças',
      'Substituição de fornecedor concorrente',
      'Ampliação de carteira — peças de transmissão',
    ];
    const criarOpp = (nome, clienteId, leadEmpresa, estagio, diasAtras, valor, extra={}) => {
      const abertura = addDays(today(), -diasAtras);
      const op = {id:uid(), code:'OPP'+String(d.oportunidades.length+1).padStart(5,'0'),
        nome, clienteId:clienteId||'', leadEmpresa:leadEmpresa||'', vendedorId:vend().id,
        valorEstimado:valor, estagio, origem:pick(ORIGENS),
        dataAbertura:abertura, previsaoFechamento:addDays(abertura, rnd(40)+15),
        fechadoEm:'', motivoPerda:'', motivoPerdaDetalhe:'', saleId:'',
        atividades:[{id:uid(), tipo:pick(['ligacao','email','reuniao']), data:addDays(abertura,rnd(5)+1),
          descricao:'Primeiro contato realizado, cliente demonstrou interesse.', usuario:vend().name}],
        ...extra};
      d.oportunidades.push(op);
      return op;
    };

    // abertas, uma em cada estágio
    ESTAGIOS_CRM.forEach((est,i) => {
      const cli = pick(d.customers);
      criarOpp(NEGOCIOS[i], cli.id, '', est.id, rnd(20)+3, (rnd(400)+80)*100);
    });
    // dois leads sem cliente formal ainda
    criarOpp(NEGOCIOS[4], '', 'Distribuidora Nortec Auto Peças', 'qualificacao', 8, 42000);
    criarOpp(NEGOCIOS[5], '', 'Grupo Mecânica Vale Forte', 'prospeccao', 2, 18500);
    // uma oportunidade fria, sem contato há muito tempo (para o KPI "esfriando")
    const fria = criarOpp(NEGOCIOS[6], pick(d.customers).id, '', 'negociacao', 35, 65000);
    fria.atividades[0].data = addDays(today(), -25);

    // uma ganha, linkada a uma venda faturada já existente (realismo: o pedido "nasceu" dessa oportunidade)
    const vendaGanha = d.sales.filter(v=>v.stockApplied)[3];
    if(vendaGanha){
      const cli = d.customers.find(c=>c.id===vendaGanha.customerId);
      const ganha = criarOpp(NEGOCIOS[7], vendaGanha.customerId, '', 'ganho', 45, docTotal(vendaGanha));
      ganha.fechadoEm = addDays(vendaGanha.createdAt, -1);
      ganha.saleId = vendaGanha.id;
    }
    // uma perdida, com motivo
    const perdida = criarOpp(NEGOCIOS[8], pick(d.customers).id, '', 'perdido', 20, 28000);
    perdida.fechadoEm = addDays(today(), -5);
    perdida.motivoPerda = 'Concorrência';
    perdida.motivoPerdaDetalhe = 'Cliente fechou com fornecedor que ofereceu prazo de pagamento maior.';
  }

  // ---- Devoluções de demonstração (usa as mesmas funções de lançamento, sem depender de DOM) ----
  {
    /* mesma correção de antes: contaCod/lancar/custoUnitarioProduto leem de app.data */
    app.data = d;
    const depQUA = d.depositos.find(x=>x.code==='QUA');
    const depACB = d.depositos.find(x=>x.code==='ACB');
    const depALM = d.depositos.find(x=>x.code==='ALM');

    const criarDevSeed = (tipo, doc, linhas, motivo, condicao, dias) => {
      const dataDev = addDays(today(), -dias);
      const destino = tipo==='venda' ? (condicao==='avariada'?depQUA:depACB) : null;
      for(const l of linhas){
        if(tipo==='venda'){
          const b = destino ? d.balances.find(x=>x.itemId===l.itemId&&x.depositId===destino.id&&!x.loteId) : null;
          if(b) b.quantity += l.devolver; else if(destino) d.balances.push({id:uid(), itemId:l.itemId, depositId:destino.id, loteId:'', quantity:l.devolver});
        } else {
          const b = d.balances.find(x=>x.itemId===l.itemId&&x.depositId===depALM.id&&!x.loteId);
          if(b) b.quantity = Math.max(0, b.quantity - l.devolver);
        }
        d.moves.push({id:uid(), itemId:l.itemId, type: tipo==='venda'?'entrada':'saida', quantity:l.devolver,
          refType:'devolucao', refCode:doc.code, createdAt:dataDev,
          note:`Devolução (${tipo}) — ${motivo}`, depositId:(tipo==='venda'?destino:depALM)?.id||'', loteId:''});
      }
      const valorTotal = linhas.reduce((a,l)=>a+l.devolver*l.unitPrice,0);
      const dev = {id:uid(), code:'DEV'+String(d.devolucoes.length+1).padStart(5,'0'), tipo,
        refId:doc.id, refCode:doc.code, parceiroId: tipo==='venda'?doc.customerId:doc.supplierId,
        lines:linhas.map(l=>({itemId:l.itemId, quantity:l.devolver, unitPrice:l.unitPrice})),
        motivo, condicao: tipo==='venda'?condicao:'', data:dataDev, registradoPor:'Marcelo Ibrahim'};
      d.devolucoes.push(dev);
      if(tipo==='venda'){
        const custoCMV = linhas.reduce((a,l)=>a+custoUnitarioProduto(l.itemId)*l.devolver,0);
        const ajuste = ajustaTituloDevolucao('venda', doc.id, 'receber', valorTotal);
        lancarDevolucaoVenda(dev, valorTotal, custoCMV, ajuste);
      } else {
        const ajuste = ajustaTituloDevolucao('compra', doc.id, 'pagar', valorTotal);
        lancarDevolucaoCompra(dev, valorTotal, ajuste);
      }
      d.inventory.forEach(it => { it.quantity = d.balances.filter(b=>b.itemId===it.id).reduce((a,b)=>a+b.quantity,0); });
    };

    const vendasFaturadas = d.sales.filter(v=>v.stockApplied);
    if(vendasFaturadas[2]){
      const pv = vendasFaturadas[2], linha = pv.lines[0];
      const qtd = Math.min(3, linha.quantity);
      if(qtd>0) criarDevSeed('venda', pv, [{itemId:linha.itemId, unitPrice:linha.unitPrice, devolver:qtd}],
        'Cliente recebeu quantidade a mais do que o combinado no pedido.', 'boa', 12);
    }
    if(vendasFaturadas[5]){
      const pv = vendasFaturadas[5], linha = pv.lines[0];
      const qtd = Math.min(2, linha.quantity);
      if(qtd>0) criarDevSeed('venda', pv, [{itemId:linha.itemId, unitPrice:linha.unitPrice, devolver:qtd}],
        'Peça chegou com avaria de transporte, cliente recusou o recebimento.', 'avariada', 6);
    }
    const comprasRecebidas = d.purchases.filter(p=>pedidoIniciado(p));
    if(comprasRecebidas[1]){
      const pc = comprasRecebidas[1], linha = pc.lines[0];
      const disp = d.balances.filter(b=>b.itemId===linha.itemId).reduce((a,b)=>a+b.quantity,0);
      const qtd = Math.min(Math.floor(linha.quantity*0.15), disp, 50);
      if(qtd>0) criarDevSeed('compra', pc, [{itemId:linha.itemId, unitPrice:linha.unitPrice, devolver:qtd}],
        'Lote de matéria-prima fora da especificação dimensional, reprovado na inspeção de recebimento.', '', 9);
    }
  }

  // uma requisição de alto valor, para demonstrar a cadeia completa até Diretoria
  {
    const sol = d.employees.find(e=>e.name==='Renata Miquelin') || d.employees[0];
    const criado = addDays(today(), -12);
    const grandes = materias.slice(0,3).map(it=>({itemId:it.id, quantity:(rnd(40)+80)*10,
      unitPrice:+(it.unitPrice*1.05).toFixed(2)}));
    const req = {id:uid(), code:'RC'+String(d.requisitions.length+1).padStart(5,'0'),
      requesterId:sol.id, deptId:sol.deptId, lines:grandes,
      justificativa:'Formação de estoque para o contrato anual de fornecimento fechado com a montadora. Volume negociado exige compra única para garantir preço.',
      urgencia:'alta', status:'aguardando', createdAt:criado, neededAt:addDays(criado,45),
      aprovacoes:[
        {user:'Otávio Bertoldi', acao:'aprovou', nivel:1, nivelLabel:'Supervisão', at:addDays(criado,1), motivo:''},
        {user:'Helena Prado', acao:'aprovou', nivel:2, nivelLabel:'Gerência', at:addDays(criado,3),
         motivo:'De acordo com o volume contratado. Encaminho para a Diretoria pelo valor.'},
      ], purchaseId:''};
    d.requisitions.push(req);
    [...d.suppliers].sort(()=>Math.random()-.5).slice(0,3).forEach((f,k)=>{
      const fator = 0.94 + k*0.05;
      d.quotations.push({id:uid(), code:'COT'+String(d.quotations.length+1).padStart(5,'0'),
        requisitionId:req.id, supplierId:f.id,
        lines:grandes.map(l=>({itemId:l.itemId, quantity:l.quantity, unitPrice:+(l.unitPrice*fator).toFixed(2)})),
        prazoDias:rnd(15)+20, validade:addDays(criado,40),
        pagamento:pick(['30/60/90 dias','à vista com 5% de desconto','entrada + 2x']),
        escolhida:false, createdAt:addDays(criado,2)});
    });
  }

  // trilha de auditoria com histórico, para a aba não abrir vazia
  const nomes = [['Sandro Aparecido','mestre'],['Gerente Demonstração','gerente'],['Operador Demonstração','operador']];
  const eventos = [];
  d.purchases.filter(x=>x.stockApplied).slice(0,6).forEach(x=>eventos.push(
    ['Recebeu compra','Compras',x.code,`${x.lines.length} item(ns) · ${money(docTotal(x))}`, x.expectedAt]));
  d.sales.filter(x=>x.stockApplied).slice(0,6).forEach(x=>eventos.push(
    ['Faturou venda','Vendas',x.code,`${x.lines.length} item(ns) · ${money(docTotal(x))}`, x.createdAt]));
  d.production.filter(o=>o.stockApplied).slice(0,6).forEach(o=>eventos.push(
    ['Concluiu ordem','Produção',o.code,'Estoque movimentado', o.dueAt]));
  d.inspections.slice(0,5).forEach(i=>eventos.push(
    ['Criou inspeção','Qualidade',i.code,`${i.rate.toFixed(2)}% de conformidade`, i.createdAt]));
  eventos.forEach(([acao,ent,cod,det,dia])=>{
    const [user,role] = pick(nomes);
    d.audit.push({id:uid(), at:`${dia}T${String(rnd(9)+8).padStart(2,'0')}:${String(rnd(60)).padStart(2,'0')}:00.000Z`,
      user, role, acao, entidade:ent, codigo:cod, detalhe:det});
  });
  d.audit.sort((a,b)=> a.at < b.at ? 1 : -1);

  // garante alguns títulos vencidos para a demonstração mostrar o estado de atraso
  const emAberto = d.financial.filter(t=>!t.paidAt);
  [0,1,2].forEach(i=>{
    const t = emAberto[i] || d.financial[i];
    if(t){ t.paidAt=''; t.dueAt = addDays(today(), -(rnd(25)+5)); }
  });

  /* o cache de quantidade em cada item passa a refletir a soma dos saldos */
  d.inventory.forEach(it => {
    it.quantity = d.balances.filter(b=>b.itemId===it.id).reduce((a,b)=>a+b.quantity, 0);
  });

  d.moves.sort((a,b)=> a.createdAt < b.createdAt ? 1 : -1);

  // ==========================================================================
  // LANÇAMENTOS CONTÁBEIS HISTÓRICOS
  // Usa as MESMAS funções de lançamento que as telas usam em tempo real, aplicadas
  // em ordem cronológica sobre os documentos que o seed já criou. Garante que o
  // código de contabilidade seja o mesmo, tenha ele rodado ontem ou agora.
  // ==========================================================================
  {
    /* lancar/contaCod/tributarVenda leem de app.data — durante o seed os dados ainda
       estão só na variável local "d", então apontamos app.data pra ela antes de usar
       essas funções. loadData() faz "app.data = seedData()" logo em seguida, então
       isso só antecipa em alguns milissegundos uma atribuição que já ia acontecer. */
    app.data = d;

    const dataMaisAntiga = [
      ...d.receipts.map(r=>r.createdAt),
      ...d.sales.filter(v=>v.stockApplied).map(v=>v.createdAt),
      ...d.production.filter(o=>o.stockApplied).map(o=>o.concluidaEm),
    ].sort()[0] || today();
    const abertura = addDays(dataMaisAntiga, -30);

    // capital inicial — sem isso não haveria caixa para pagar nada
    lancar(abertura, 'Aporte de capital dos sócios na abertura da empresa',
      [{contaId:contaCod('1.1.1').id, tipo:'debito', valor:800000},
       {contaId:contaCod('3.1').id, tipo:'credito', valor:800000}],
      {tipo:'abertura', ref:'CAPITAL'});

    // uma linha do tempo única com todos os eventos que geram lançamento
    const eventos = [];
    d.receipts.forEach(r => eventos.push({data:r.createdAt, tipo:'compra', ref:r}));
    d.sales.filter(v=>v.stockApplied).forEach(v => eventos.push({data:v.createdAt, tipo:'venda', ref:v}));
    d.production.filter(o=>o.stockApplied).forEach(o => eventos.push({data:o.concluidaEm, tipo:'producao', ref:o}));
    d.financial.filter(t=>t.paidAt).forEach(t => eventos.push({data:t.paidAt, tipo:'titulo', ref:t}));
    eventos.sort((a,b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);

    eventos.forEach(ev => {
      if(ev.tipo === 'compra'){
        const r = ev.ref, pc = d.purchases.find(p=>p.id===r.purchaseId);
        lancarRecebimentoCompra(pc?pc.code:'?', r.lines, r.createdAt, r.nf);
      } else if(ev.tipo === 'venda'){
        const v = ev.ref;
        const cli = d.customers.find(c=>c.id===v.customerId) || {};
        const uf = cli.uf || 'SP';
        const trib = tributarVenda(v);
        const custoCMV = v.lines.reduce((a,l)=> a + custoUnitarioProduto(l.itemId)*l.quantity, 0);
        lancarFaturamentoVenda(v.code, trib, custoCMV, v.createdAt);
      } else if(ev.tipo === 'producao'){
        lancarProducao(ev.ref, ev.data);
      } else if(ev.tipo === 'titulo'){
        lancarBaixaTitulo(ev.ref, ev.data);
      }
    });

    // três meses de folha já processados e pagos, para o módulo abrir com histórico
    const ativos = d.employees.filter(e=>e.status==='ativo');
    const brutoMensal = ativos.reduce((a,e)=>a+e.salario,0);
    for(let m=3; m>=1; m--){
      const comp = addDays(today(), -m*30).slice(0,7);
      if(d.folhas.some(f=>f.competencia===comp)) continue;
      const encargos = +(brutoMensal*ENCARGOS_PATRONAIS).toFixed(2);
      const total = +(brutoMensal+encargos).toFixed(2);
      const dataProc = addDays(today(), -m*30);
      const dataPag = addDays(dataProc, 3);
      const f = {id:uid(), code:'FP'+String(d.folhas.length+1).padStart(5,'0'), competencia:comp,
        funcionarios:ativos.length, bruto:brutoMensal, encargos, total,
        status:'paga', processadoEm:dataProc, processadoPor:'Helena Prado',
        pagoEm:dataPag, pagoPor:'Helena Prado'};
      d.folhas.push(f);
      lancar(dataProc, `Folha de pagamento — competência ${comp}`,
        [{contaId:contaCod('6.1').id, tipo:'debito', valor:total},
         {contaId:contaCod('2.1.2').id, tipo:'credito', valor:total}], {tipo:'folha', ref:f.code});
      lancar(dataPag, `Pagamento da folha — competência ${comp}`,
        [{contaId:contaCod('2.1.2').id, tipo:'debito', valor:total},
         {contaId:contaCod('1.1.1').id, tipo:'credito', valor:total}], {tipo:'folha', ref:f.code});
    }
    // a competência do mês atual fica só processada, aguardando pagamento — item acionável no teste
    processarFolhaSeed(d);
  }

  d.lancamentos.sort((a,b)=> a.data < b.data ? -1 : (a.data > b.data ? 1 : 0));

  // garante ao menos um centro de trabalho sobrecarregado num horizonte de 30 dias,
  // para a demonstração sempre ter algo concreto para apontar
  {
    const cargas = cargaCentros(30).filter(c=>c.carga>0).sort((a,b)=>b.pct-a.pct);
    if(cargas.length){
      const alvo = cargas[0].centro;
      alvo.capacidadeDiariaHoras = Math.max(1, +(cargas[0].carga/30/1.4).toFixed(1));
    }
  }

  return d;
}

/* versão da folha usada só durante o seed (as funções live fazem guard/toast, que não existem aqui) */
function processarFolhaSeed(d){
  const comp = today().slice(0,7);
  if(d.folhas.some(f=>f.competencia===comp)) return;
  const ativos = d.employees.filter(e=>e.status==='ativo');
  if(!ativos.length) return;
  const bruto = ativos.reduce((a,e)=>a+e.salario,0);
  const encargos = +(bruto*ENCARGOS_PATRONAIS).toFixed(2);
  const total = +(bruto+encargos).toFixed(2);
  const f = {id:uid(), code:'FP'+String(d.folhas.length+1).padStart(5,'0'), competencia:comp,
    funcionarios:ativos.length, bruto, encargos, total,
    status:'processada', processadoEm:today(), processadoPor:'Helena Prado', pagoEm:'', pagoPor:''};
  d.folhas.push(f);
  lancar(today(), `Folha de pagamento — competência ${comp}`,
    [{contaId:contaCod('6.1').id, tipo:'debito', valor:total},
     {contaId:contaCod('2.1.2').id, tipo:'credito', valor:total}], {tipo:'folha', ref:f.code});
}

/* ---------- PERSISTÊNCIA ---------- */
function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ app.data = JSON.parse(raw); return; }
  }catch(e){ console.warn('Falha ao ler dados salvos:', e); }
  app.data = seedData();
  saveData();
}
function saveData(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(app.data)); }
  catch(e){ toast('Não foi possível salvar. O armazenamento do navegador está cheio.','err'); }
}
function resetData(){
  if(!guard('settings','config')) return;
  confirmDialog('Restaurar dados de demonstração',
    'Todos os registros criados ou editados serão apagados e substituídos pelos dados originais. Esta ação não pode ser desfeita.',
    () => { app.data = seedData(); saveData(); switchTab(app.tab); toast('Dados de demonstração restaurados.'); });
}

/* ==========================================================================
   INFRAESTRUTURA DE UI
   ========================================================================== */
function toast(msg, kind='ok'){
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast' + (kind==='err'?' err':kind==='warn'?' warn':'');
  t.innerHTML = `<span style="flex:1">${esc(msg)}</span><button aria-label="Fechar">✕</button>`;
  t.querySelector('button').onclick = () => t.remove();
  c.appendChild(t);
  setTimeout(()=>t.remove(), 4200);
}
function closeModal(){ document.getElementById('formModal').classList.remove('show'); }
function openModal(title, bodyHtml, footHtml){
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-head"><span>${esc(title)}</span><button onclick="closeModal()" aria-label="Fechar">✕</button></div>
    <div class="modal-body">${bodyHtml}</div>
    ${footHtml ? `<div class="modal-foot">${footHtml}</div>` : ''}`;
  document.getElementById('formModal').classList.add('show');
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
document.getElementById('formModal').addEventListener('click', e => {
  if(e.target.id==='formModal') closeModal();
});

function confirmDialog(title, message, onYes, yesLabel='Confirmar'){
  window.__confirmYes = () => { closeModal(); onYes(); };
  openModal(title, `<p style="margin:0;font-size:13px;line-height:1.6;white-space:pre-line">${esc(message)}</p>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-danger" onclick="window.__confirmYes()">${esc(yesLabel)}</button>`);
}

/* ---------- CONSTRUTOR DE FORMULÁRIOS ---------- */
/* fields: {name,label,type,options,required,hint,step,min,half,readonly,onchange} */
function openForm(title, fields, values, onSubmit, submitLabel='Salvar'){
  const field = f => {
    const v = values[f.name] ?? '';
    const req = f.required ? ' required' : '';
    const ro  = f.readonly ? ' disabled' : '';
    let input;
    if(f.type==='select'){
      input = `<select id="fld_${f.name}"${req}${ro} ${f.onchange?`onchange="${f.onchange}"`:''}>
        <option value="">— selecione —</option>
        ${f.options.map(o=>`<option value="${esc(o.value)}"${String(o.value)===String(v)?' selected':''}>${esc(o.label)}</option>`).join('')}
      </select>`;
    } else if(f.type==='textarea'){
      input = `<textarea id="fld_${f.name}" rows="3"${ro}>${esc(v)}</textarea>`;
    } else {
      input = `<input type="${f.type||'text'}" id="fld_${f.name}" value="${esc(v)}"${req}${ro}
        ${f.step?`step="${f.step}"`:''} ${f.min!==undefined?`min="${f.min}"`:''}
        ${f.onchange?`oninput="${f.onchange}"`:''}>`;
    }
    return `<div class="form-group" ${f.half?'':'style="grid-column:1/-1"'}>
      <label for="fld_${f.name}">${esc(f.label)}${f.required?' *':''}</label>${input}
      ${f.hint?`<div class="form-hint" id="hint_${f.name}">${f.hint}</div>`:''}</div>`;
  };
  window.__formSubmit = () => {
    const out = {};
    for(const f of fields){
      const el = document.getElementById('fld_'+f.name);
      let v = el.value.trim();
      if(f.required && !v){ toast(`Preencha o campo "${f.label}".`,'err'); el.focus(); return; }
      if(f.type==='number'){
        v = v===''? '' : Number(v);
        if(v!=='' && isNaN(v)){ toast(`"${f.label}" precisa ser um número.`,'err'); el.focus(); return; }
        if(v!=='' && f.min!==undefined && v < f.min){ toast(`"${f.label}" não pode ser menor que ${f.min}.`,'err'); el.focus(); return; }
      }
      out[f.name] = v;
    }
    const err = onSubmit(out);
    if(err){ toast(err,'err'); return; }
    closeModal();
  };
  openForm._fields = fields;
  openModal(title, `<div class="form-row">${fields.map(field).join('')}</div>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="window.__formSubmit()">${esc(submitLabel)}</button>`);
  const first = document.getElementById('fld_'+fields[0].name);
  if(first && !fields[0].readonly) first.focus();
}

/* ==========================================================================
   SUB-ABAS — filtram o grid sem trocar de módulo
   ========================================================================== */
const subState = {};
const SUBTABS = {};   /* {modulo: [{id,label,filtro,alerta}]} */

function subAtual(mod){
  const defs = SUBTABS[mod] || [];
  if(!subState[mod] || !defs.some(d=>d.id===subState[mod])) subState[mod] = defs.length?defs[0].id:'';
  return subState[mod];
}
function renderSubtabs(mod, gridKey){
  const defs = SUBTABS[mod] || [];
  if(!defs.length) return '';
  const atual = subAtual(mod);
  return `<div class="subtabs">${defs.map(d=>{
    const n = d.contar ? d.contar() : null;
    return `<button class="subtab${d.id===atual?' active':''}${d.alerta&&n?' alerta':''}"
      onclick="setSubtab('${mod}','${d.id}','${gridKey}')">
      ${esc(d.label)}${n!==null?`<span class="cnt">${n}</span>`:''}</button>`;
  }).join('')}</div>`;
}
function setSubtab(mod, id, gridKey){
  subState[mod] = id;
  gs(gridKey).page = 1;
  switchTab(mod);
}
/* aplica o filtro da sub-aba ativa sobre a lista */
function filtraSub(mod, rows){
  const defs = SUBTABS[mod] || [];
  const d = defs.find(x=>x.id===subAtual(mod));
  return d && d.filtro ? rows.filter(d.filtro) : rows;
}

/* ==========================================================================
   GRID GENÉRICO — busca, ordenação, paginação
   ========================================================================== */
const gridState = {};
function gs(key){
  if(!gridState[key]) gridState[key] = {page:1, size:10, q:'', sort:null, dir:'asc'};
  return gridState[key];
}
const GRIDS = {};   // preenchido por cada módulo

function renderGrid(key){
  const cfg = GRIDS[key], st = gs(key), host = document.getElementById('grid_'+key);
  if(!host) return;
  let rows = cfg.rows();

  if(st.q){
    const q = st.q.toLowerCase();
    rows = rows.filter(r => cfg.cols.some(c => String(c.raw ? c.raw(r) : '').toLowerCase().includes(q)));
  }
  if(st.sort){
    const col = cfg.cols.find(c=>c.key===st.sort);
    if(col){
      const s = st.dir==='asc' ? 1 : -1;
      rows = [...rows].sort((a,b)=>{
        const va = col.raw(a), vb = col.raw(b);
        if(typeof va==='number' && typeof vb==='number') return (va-vb)*s;
        return String(va).localeCompare(String(vb),'pt-BR',{numeric:true})*s;
      });
    }
  }
  const total = rows.length, pages = Math.max(1, Math.ceil(total/st.size));
  if(st.page > pages) st.page = pages;
  const start = (st.page-1)*st.size;
  const page = rows.slice(start, start+st.size);

  const head = cfg.cols.map(c =>
    `<th class="sortable${c.num?' num':''}" onclick="sortGrid('${key}','${c.key}')">${esc(c.label)}${
      st.sort===c.key ? ` <span class="arrow">${st.dir==='asc'?'▲':'▼'}</span>` : ''}</th>`).join('')
    + (cfg.actions ? '<th style="width:1%">Ações</th>' : '');

  const body = page.length
    ? page.map(r => '<tr>' + cfg.cols.map(c =>
        `<td class="${c.num?'num':''}">${c.cell ? c.cell(r) : esc(c.raw(r))}</td>`).join('')
        + (cfg.actions ? `<td style="white-space:nowrap">${cfg.actions(r)}</td>` : '') + '</tr>').join('')
    : `<tr><td colspan="${cfg.cols.length + (cfg.actions?1:0)}"><div class="empty-state">
        <strong>${st.q ? 'Nenhum resultado para essa busca' : (cfg.emptyTitle||'Nenhum registro ainda')}</strong>
        ${st.q ? 'Tente outro termo ou limpe a busca.' : (cfg.emptyHint||'Use o botão acima para cadastrar o primeiro.')}
      </div></td></tr>`;

  host.innerHTML = `
    <div class="panel-head">
      <h3>${esc(cfg.title)}</h3>
      <div class="grid-toolbar">
        <input class="grid-search" placeholder="Buscar…" value="${esc(st.q)}"
               oninput="searchGrid('${key}', this.value)" aria-label="Buscar em ${esc(cfg.title)}">
        ${cfg.toolbar ? cfg.toolbar() : ''}
      </div>
    </div>
    <table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
    <div class="pager">
      <span class="pager-info">${total ? `${start+1}–${Math.min(start+st.size,total)} de ${total} registro${total>1?'s':''}` : '0 registros'}</span>
      <div class="pager-controls">
        <button onclick="pageGrid('${key}',1)" ${st.page===1?'disabled':''}>««</button>
        <button onclick="pageGrid('${key}',${st.page-1})" ${st.page===1?'disabled':''}>‹</button>
        <span style="padding:0 6px">Página ${st.page} de ${pages}</span>
        <button onclick="pageGrid('${key}',${st.page+1})" ${st.page===pages?'disabled':''}>›</button>
        <button onclick="pageGrid('${key}',${pages})" ${st.page===pages?'disabled':''}>»»</button>
      </div>
    </div>`;
}
let _searchTimer;
function searchGrid(key,v){
  const st = gs(key); st.q = v; st.page = 1;
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(()=>{ renderGrid(key);
    const el = document.querySelector(`#grid_${key} .grid-search`);
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 180);
}
function sortGrid(key,col){
  const st = gs(key);
  if(st.sort===col) st.dir = st.dir==='asc'?'desc':'asc'; else { st.sort=col; st.dir='asc'; }
  renderGrid(key);
}
function pageGrid(key,p){ gs(key).page = p; renderGrid(key); }

/* ==========================================================================
   REGRAS DE NEGÓCIO — integração entre módulos
   ========================================================================== */
const item   = id => byId(app.data.inventory, id);
const itemLbl= id => { const i=item(id); return i ? `${i.sku} · ${i.description}` : '—'; };
const supLbl = id => { const s=byId(app.data.suppliers,id); return s ? s.name : '—'; };
const cliLbl = id => { const c=byId(app.data.customers,id); return c ? c.name : '—'; };
const opLbl  = id => { const o=byId(app.data.production,id); return o ? o.code : '—'; };

/* ==========================================================================
   SALDOS POR DEPÓSITO E LOTE
   item.quantity é mantido como cache do total; a verdade está em balances.
   ========================================================================== */
const dep      = id => byId(app.data.depositos, id);
const depLbl   = id => { const d = dep(id); return d ? `${d.code} · ${d.nome}` : '—'; };
const depPadrao = tipo => app.data.depositos.find(d =>
  d.ativo && d.principal && (d.aceita === tipo || d.aceita === 'ambos'))
  || app.data.depositos.find(d => d.ativo) || null;
const depsQueAceitam = tipo => app.data.depositos.filter(d =>
  d.ativo && (d.aceita === tipo || d.aceita === 'ambos'));

const lote    = id => byId(app.data.lotes, id);
const loteLbl = id => { const l = lote(id); return l ? l.codigo : '—'; };

function saldos(itemId, depositId, loteId){
  return app.data.balances.filter(b =>
    b.itemId === itemId &&
    (depositId === undefined || b.depositId === depositId) &&
    (loteId === undefined || b.loteId === loteId));
}
const saldoDeposito = (itemId, depositId) =>
  saldos(itemId, depositId).reduce((a,b) => a + b.quantity, 0);
const saldoTotal = itemId => saldos(itemId).reduce((a,b) => a + b.quantity, 0);
const saldoLote  = loteId => app.data.balances.filter(b => b.loteId === loteId)
  .reduce((a,b) => a + b.quantity, 0);

function sincronizaCache(itemId){
  const it = item(itemId);
  if(it){ it.quantity = saldoTotal(itemId); it.updatedAt = today(); }
}
/* soma ou subtrai num depósito, criando a linha de saldo se precisar */
function ajustaSaldo(itemId, depositId, loteId, delta){
  let b = app.data.balances.find(x =>
    x.itemId === itemId && x.depositId === depositId && (x.loteId||'') === (loteId||''));
  if(!b){
    b = {id:uid(), itemId, depositId, loteId: loteId||'', quantity:0};
    app.data.balances.push(b);
  }
  b.quantity += delta;
  if(b.quantity <= 0 && Math.abs(b.quantity) < 0.0001)
    app.data.balances = app.data.balances.filter(x => x.id !== b.id);
  sincronizaCache(itemId);
}
/* sugere de quais lotes tirar, do mais antigo para o mais novo */
function sugereLotes(itemId, depositId, quantidade){
  const disp = saldos(itemId, depositId).filter(b => b.quantity > 0)
    .map(b => ({...b, l: lote(b.loteId)}))
    .sort((a,b) => {
      if(!a.l && !b.l) return 0;
      if(!a.l) return -1;
      if(!b.l) return 1;
      const va = a.l.validade || '9999-12-31', vb = b.l.validade || '9999-12-31';
      if(va !== vb) return va < vb ? -1 : 1;
      return a.l.criadoEm < b.l.criadoEm ? -1 : 1;
    });
  const out = [];
  let falta = quantidade;
  for(const b of disp){
    if(falta <= 0) break;
    const usa = Math.min(falta, b.quantity);
    out.push({loteId:b.loteId, quantity:usa, disponivel:b.quantity});
    falta -= usa;
  }
  return {linhas:out, atendido: quantidade - falta, falta};
}

function moveStock(itemId, type, qty, refType, refCode, note, depositId, loteId){
  const it = item(itemId);
  if(!it) return 'Item de estoque não encontrado.';
  qty = Math.round(Number(qty));
  if(!(qty > 0)) return 'A quantidade precisa ser maior que zero.';

  const depId = depositId || (depPadrao(it.type) || {}).id || '';
  if(!depId) return 'Nenhum depósito cadastrado para receber este item.';

  if(type === 'saida'){
    const disp = loteId !== undefined && loteId !== ''
      ? saldos(itemId, depId, loteId).reduce((a,b)=>a+b.quantity,0)
      : saldoDeposito(itemId, depId);
    if(disp < qty)
      return `Estoque insuficiente de ${it.sku} em ${depLbl(depId)}. Disponível: ${num(disp)}, necessário: ${num(qty)}.`;
  }
  ajustaSaldo(itemId, depId, loteId || '', type === 'entrada' ? qty : -qty);
  app.data.moves.unshift({id:uid(), itemId, type, quantity:qty, refType, refCode,
    createdAt:today(), note, depositId:depId, loteId:loteId||''});
  return null;
}

/* transferência entre depósitos, em uma operação só */
function transfereEstoque(itemId, deOrigem, paraDestino, qty, loteId, motivo){
  const it = item(itemId);
  if(!it) return 'Item não encontrado.';
  if(deOrigem === paraDestino) return 'Origem e destino precisam ser diferentes.';
  qty = Math.round(Number(qty));
  if(!(qty > 0)) return 'A quantidade precisa ser maior que zero.';
  const disp = loteId ? saldos(itemId, deOrigem, loteId).reduce((a,b)=>a+b.quantity,0)
                      : saldoDeposito(itemId, deOrigem);
  if(disp < qty)
    return `Saldo insuficiente em ${depLbl(deOrigem)}. Disponível: ${num(disp)}, solicitado: ${num(qty)}.`;
  const dst = dep(paraDestino);
  if(dst && dst.aceita !== 'ambos' && dst.aceita !== it.type)
    return `${dst.nome} não recebe ${it.type === 'materia' ? 'matéria-prima' : 'produto acabado'}.`;

  ajustaSaldo(itemId, deOrigem, loteId||'', -qty);
  ajustaSaldo(itemId, paraDestino, loteId||'', qty);
  const nota = motivo || 'Transferência entre depósitos';
  app.data.moves.unshift({id:uid(), itemId, type:'saida', quantity:qty, refType:'transferencia',
    refCode:'TRF', createdAt:today(), note:`${nota} — para ${depLbl(paraDestino)}`,
    depositId:deOrigem, loteId:loteId||''});
  app.data.moves.unshift({id:uid(), itemId, type:'entrada', quantity:qty, refType:'transferencia',
    refCode:'TRF', createdAt:today(), note:`${nota} — de ${depLbl(deOrigem)}`,
    depositId:paraDestino, loteId:loteId||''});
  return null;
}

function concluirOP(id){
  if(!guard('production','aprovar')) return;
  const op = byId(app.data.production, id);
  if(!op) return;
  if(op.stockApplied){ toast('Esta ordem já foi concluída e o estoque já foi movimentado.','warn'); return; }
  const prod = item(op.productId);
  if(!prod){ toast('O produto desta ordem não existe mais no estoque.','err'); return; }
  const consumo = op.consumo || [];
  if(!consumo.length){ toast('Esta ordem não tem componentes definidos. Edite-a e vincule uma ficha técnica.','err'); return; }

  const faltas = faltaEstoque(consumo);
  if(faltas.length){
    toast('Estoque insuficiente — ' + faltas.map(f=>{
      const it = item(f.itemId);
      return `${it?it.sku:'?'}: falta ${num(f.falta)}`;
    }).join(' · '), 'err');
    return;
  }
  const custoMat = consumo.reduce((a,c)=>{ const it=item(c.itemId); return a + (it?it.unitPrice*c.quantity:0); }, 0);
  const custoOp  = (op.operacoes||[]).reduce((a,o)=> a + (o.tempo||0)/60*(o.custoHora||0), 0) * op.quantity;
  const resumo = consumo.map(c=>`${num(c.quantity)} un. de ${itemLbl(c.itemId)}`).join('\n');
  confirmDialog('Concluir ordem de produção',
    `${op.code} — ${num(op.quantity)} un. de ${prod.sku}\n\nSerão baixados do estoque:\n${resumo}\n\n` +
    `Custo apurado: ${money(custoMat)} de material + ${money(custoOp)} de transformação = ${money(custoMat+custoOp)} ` +
    `(${money((custoMat+custoOp)/op.quantity)} por peça).`,
    () => {
      const depMP = depPadrao('materia'), depPA = depPadrao('produto');
      for(const c of consumo){
        /* consome do lote mais antigo primeiro, para o rastreio ficar correto */
        const sug = sugereLotes(c.itemId, depMP ? depMP.id : '', c.quantity);
        if(sug.falta > 0){
          toast(`Saldo insuficiente de ${item(c.itemId).sku} no depósito de matéria-prima.`,'err');
          return;
        }
        for(const parte of sug.linhas){
          const err = moveStock(c.itemId,'saida',parte.quantity,'producao',op.code,
            parte.loteId ? `Consumo do lote ${loteLbl(parte.loteId)}` : 'Consumo conforme ficha técnica',
            depMP ? depMP.id : '', parte.loteId);
          if(err){ toast(err,'err'); return; }
        }
      }
      /* o produto acabado nasce com lote próprio, ligado à ordem */
      const loteProd = {id:uid(), itemId:op.productId,
        codigo:`${op.code}-${today().replace(/-/g,'').slice(2)}`,
        fornecedorId:'', nf:'', fabricacao:today(), validade:'',
        criadoEm:today(), obs:`Produzido pela ordem ${op.code}`};
      app.data.lotes.push(loteProd);
      moveStock(op.productId,'entrada',op.quantity,'producao',op.code,'Entrada de produção',
        depPA ? depPA.id : '', loteProd.id);
      op.loteProduzido = loteProd.id;
      op.status='concluida'; op.progress=100; op.stockApplied=true;
      op.custoMaterial = +custoMat.toFixed(2); op.custoOperacao = +custoOp.toFixed(2);
      op.concluidaEm = today();
      lancarProducao(op, today());
      audit('Concluiu ordem','Produção',op.code,
        `${num(op.quantity)} un. de ${prod.sku} · custo ${money(custoMat+custoOp)}`);
      saveData(); switchTab(app.tab==='approvals'?'approvals':'production');
      toast(`${op.code} concluída. Custo de ${money((custoMat+custoOp)/op.quantity)} por peça.`);
    }, 'Concluir');
}

/* quanto já foi recebido de cada linha do pedido */
function recebidoDe(pcId, itemId){
  return app.data.receipts.filter(r=>r.purchaseId===pcId)
    .flatMap(r=>r.lines).filter(l=>l.itemId===itemId)
    .reduce((a,l)=>a+l.quantity, 0);
}
function saldoPedido(pc){
  return pc.lines.map(l => ({...l, recebido: recebidoDe(pc.id, l.itemId),
    saldo: l.quantity - recebidoDe(pc.id, l.itemId)}));
}
const pedidoCompleto = pc => saldoPedido(pc).every(l => l.saldo <= 0);
const pedidoIniciado = pc => app.data.receipts.some(r=>r.purchaseId===pc.id);

let __rec = null;
function receberCompra(id){

        <input type="text" id="rec_nf" placeholder="Número da NF">

    `<button class="btn" onclick="closeModal()">Cancelar</button>

function renderLinesRec(){
  document.getElementById('recLinesBox').innerHTML = `
    <table class="lines"><thead><tr>
      <th style="width:44%">Item</th><th class="num">Pedido</th><th class="num">Já recebido</th>
      <th class="num">Saldo</th><th class="num" style="width:18%">Receber agora</th>
    </tr></thead><tbody>
    ${__rec.lines.map((l,i)=>`<tr>
      <td>${esc(itemLbl(l.itemId))}</td>
      <td class="num">${num(l.quantity)}</td>
      <td class="num">${num(l.recebido)}</td>

      <td><input type="number" min="0" max="${l.saldo}" value="${l.receber}"
           oninput="updLineRec(${i}, this.value)"></td>
    </tr>`).join('')}</tbody></table>
    <div class="form-hint" style="margin-top:8px">Deixe zero nos itens que não vieram nesta entrega.</div>`;
}
function updLineRec(i, v){
  const l = __rec.lines[i];
  let q = Math.round(Number(v)||0);
  if(q > l.saldo){ q = l.saldo; toast(`Não é possível receber mais que o saldo de ${num(l.saldo)}.`,'warn'); renderLinesRec(); return; }
  if(q < 0) q = 0;
  l.receber = q;
}
function confirmarRecebimento(){
  const pc = byId(app.data.purchases, __rec.pcId);
  const data = document.getElementById('rec_data').value;
  const nf = document.getElementById('rec_nf').value.trim();
  const obs = document.getElementById('rec_obs').value.trim();
  const chegaram = __rec.lines.filter(l=>l.receber > 0);
  if(!data){ toast('Informe a data do recebimento.','err'); return; }
  if(data > today()){ toast('A data do recebimento não pode estar no futuro.','err'); return; }
  if(!chegaram.length){ toast('Informe a quantidade de pelo menos um item.','err'); return; }

  const valor = chegaram.reduce((a,l)=>a + l.receber * l.unitPrice, 0);
  const depDest = depPadrao('materia');
  chegaram.forEach(l => {
    const it = item(l.itemId);
    let loteId = '';
    if(it && it.controlaLote){
      const nl = {id:uid(), itemId:l.itemId,
        codigo: nf ? `NF${nf}-${it.sku}` : `REC${data.replace(/-/g,'').slice(2)}-${it.sku}`,
        fornecedorId: pc.supplierId, nf, fabricacao: data,

function faturarVenda(id){
  if(!guard('sales','aprovar')) return;
  const pv = byId(app.data.sales, id);
  if(!pv || pv.stockApplied) return;
  if(!pv.lines.length){ toast('Este pedido não tem itens.','err'); return; }
  // confere o saldo de todas as linhas antes de mexer em qualquer uma
  const faltas = [];
  const somado = {};
  pv.lines.forEach(l => { somado[l.itemId] = (somado[l.itemId]||0) + Number(l.quantity); });
  for(const [iid, qt] of Object.entries(somado)){
    const it = item(iid);
    if(!it){ faltas.push('um produto do pedido não existe mais no estoque'); continue; }
    const dpa = depPadrao('produto');
    const disp = dpa ? saldoDeposito(iid, dpa.id) : saldoTotal(iid);
    if(disp < qt) faltas.push(`${it.sku}: pedido ${num(qt)}, disponível ${num(disp)}`);
  }
  if(faltas.length){
    toast('Estoque insuficiente — ' + faltas.join(' · '), 'err');
    return;
  }
  const resumo = pv.lines.map(l=>`${num(l.quantity)} un. de ${itemLbl(l.itemId)}`).join('\n');
  confirmDialog('Faturar pedido de venda',
    `Serão baixadas ${pv.lines.length} linha(s) do estoque:\n\n${resumo}\n\nE um título a receber de ${money(docTotal(pv))} com vencimento em 30 dias.`,
    () => {
      const depPA = depPadrao('produto');
      for(const l of pv.lines){
        const sug = sugereLotes(l.itemId, depPA ? depPA.id : '', l.quantity);
        if(sug.falta > 0){ toast(`Saldo insuficiente de ${item(l.itemId).sku} em ${depPA?depPA.nome:'estoque'}.`,'err'); return; }
        for(const parte of sug.linhas){
          const err = moveStock(l.itemId,'saida',parte.quantity,'venda',pv.code,
            parte.loteId ? `Venda do lote ${loteLbl(parte.loteId)}` : 'Faturamento de venda',
            depPA ? depPA.id : '', parte.loteId);
          if(err){ toast(err,'err'); return; }
        }
      }
      pv.status='faturado'; pv.stockApplied=true;
      app.data.financial.push({id:uid(), code:seq(app.data.financial,'FIN',5), type:'receber',
        description:'Venda '+pv.code, amount:+docTotal(pv).toFixed(2),
        dueAt:addDays(today(),30), paidAt:'', refType:'venda', refId:pv.id});

      const trib = tributarVenda(pv);
      const custoCMV = pv.lines.reduce((a,l)=> a + custoUnitarioProduto(l.itemId)*l.quantity, 0);
      lancarFaturamentoVenda(pv.code, trib, custoCMV, today());

      audit('Faturou venda','Vendas',pv.code,`${pv.lines.length} item(ns) · ${money(docTotal(pv))}`);
      saveData(); switchTab('sales');
      toast(`${pv.code} faturado. ${pv.lines.length} item(ns) baixados e título a receber gerado.`);
    }, 'Faturar');
}

const emAtraso = t => !t.paidAt && t.dueAt < today();
function kpis(){
  const inv = app.data.inventory;
  const abaixoMin = inv.filter(i => i.quantity < i.minQuantity).length;
  const valorEstoque = inv.reduce((s,i)=>s+i.quantity*i.unitPrice, 0);
  const opsAbertas = app.data.production.filter(o=>o.status!=='concluida').length;
  const opsAtrasadas = app.data.production.filter(o=>o.status!=='concluida' && o.dueAt < today()).length;
  const insp = app.data.inspections;
  const totalInsp = insp.reduce((s,i)=>s+i.inspectedQty,0);
  const totalAcc  = insp.reduce((s,i)=>s+i.acceptedQty,0);
  const conf = totalInsp ? (totalAcc/totalInsp*100) : 0;
  const reqAguard = app.data.requisitions.filter(r=>r.status==='aguardando');
  const receber = app.data.financial.filter(t=>t.type==='receber' && !t.paidAt).reduce((s,t)=>s+t.amount,0);
  const pagar   = app.data.financial.filter(t=>t.type==='pagar'   && !t.paidAt).reduce((s,t)=>s+t.amount,0);
  const vencidos = app.data.financial.filter(emAtraso).length;
  return {abaixoMin, valorEstoque, opsAbertas, opsAtrasadas, conf, receber, pagar, vencidos,
          itens:inv.length, clientes:app.data.customers.length, fornecedores:app.data.suppliers.length,
          reqAguard:reqAguard.length, reqValor:reqAguard.reduce((a,r)=>a+docTotal(r),0),

/* ---------- modelos de perfil ---------- */
function permsVazio(){
  const o = {};
  for(const m in MOD_ACOES){ o[m] = {}; MOD_ACOES[m].forEach(a => o[m][a] = false); }
  return o;
}
function permsDe(modelo){
  const p = permsVazio();
  const setAll = (mods, acoes) => mods.forEach(m => {
    if(!p[m]) return;
    (acoes || MOD_ACOES[m]).forEach(a => { if(MOD_ACOES[m].includes(a)) p[m][a] = true; });
  });
  const operacional = ['dashboard','approvals','inventory','depositos','lotes','moves','boms','mrp','production','quality','expedicao',
                       'suppliers','requisitions','purchases','departments','employees',
                       'crm','customers','sales','financial','fiscal','contabilidade','devolucoes','reports','importData'];
  if(modelo==='administrador'){ setAll(Object.keys(MOD_ACOES)); }
  else if(modelo==='gerente'){
    setAll(operacional);
    setAll(['audit'],['ver']); setAll(['settings'],['ver']); setAll(['users'],['ver']);
  }
  else if(modelo==='operador'){
    setAll(operacional, ['ver','criar','editar']);
    p.employees.criar = false; p.employees.editar = false;
    p.departments.criar = false; p.departments.editar = false;
    p.approvals.ver = false;
    p.contabilidade.criar = false; p.contabilidade.editar = false; p.contabilidade.excluir = false;
    p.mrp.editar = false;
    setAll(['settings'],['ver']);
  }
  else if(modelo==='consulta'){
    setAll(operacional, ['ver']);
    p.importData.ver = false; p.approvals.ver = false; p.employees.ver = false;
  }
  return p;
}
